# CI-only runtime fixture. Never used by deployment workflows.
# LOADER supplies real fresh isolates; the two SQLite fixtures exercise registry/activity
# persistence and RPC. Synthetic parent credentials must never be copied to deployed config.
name = "operator-loader-fixture"
main = "loader-worker.ts"
compatibility_date = "2026-02-05"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[[worker_loaders]]
binding = "LOADER"

[[durable_objects.bindings]]
name = "OPERATOR_REGISTRY"
class_name = "FixtureRegistry"

[[durable_objects.bindings]]
name = "ACTIVITY"
class_name = "FixtureActivity"

# Compatibility-only SDK root; not a production namespace or migration.
[[durable_objects.bindings]]
name = "FLUE_ROOT"
class_name = "FixtureFlueRoot"

# Test-only passive Tail receipt store; never wakes the Flue execution owner.
[[durable_objects.bindings]]
name = "TAIL_INBOX"
class_name = "FixtureTailInbox"

[[migrations]]
tag = "fixture-v1"
new_sqlite_classes = ["FixtureRegistry", "FixtureActivity", "FixtureFlueRoot"]

[[migrations]]
tag = "fixture-v2"
new_sqlite_classes = ["FixtureTailInbox"]

# Production owner/facet composition; external services remain outside the evicted owner.
[[durable_objects.bindings]]
name = "OPERATOR_ACTIVITY"
class_name = "OperatorActivity"

[[durable_objects.bindings]]
name = "RECOVERY_SERVICES"
class_name = "RecoveryServices"

[[migrations]]
tag = "fixture-v3"
new_sqlite_classes = ["OperatorActivity", "RecoveryServices"]

[[kv_namespaces]]
binding = "KV"
id = "00000000000000000000000000000000"

[vars]
PARENT_SECRET = "fixture-parent-only"
