<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Codeflare: the enterprise agentic coding engine.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0c"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.16" r="0.95">
      <stop offset="0" stop-color="#ff5c3c" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#ff5c3c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Brand lockup: coral mark + wordmark -->
  <rect x="80" y="72" width="46" height="46" rx="11" fill="#ff5c3c"/>
  <text x="144" y="106" font-family="JetBrains Mono" font-size="38" font-weight="700" fill="#fafafa" letter-spacing="-1">codeflare</text>

  <!-- Positioning -->
  <text x="80" y="296" font-family="JetBrains Mono" font-size="21" font-weight="700" fill="#ff5c3c" letter-spacing="6">NOT A CODING ASSISTANT</text>
  <text x="80" y="368" font-family="JetBrains Mono" font-size="50" font-weight="700" fill="#fafafa" letter-spacing="-1.5">The enterprise agentic</text>
  <text x="80" y="430" font-family="JetBrains Mono" font-size="50" font-weight="700" fill="#fafafa" letter-spacing="-1.5">coding engine.</text>
  <text x="80" y="488" font-family="JetBrains Mono" font-size="21" font-weight="400" fill="#a1a1aa" letter-spacing="-0.3">Agents build, review, test, and ship inside your cloud boundary.</text>
  <text x="80" y="518" font-family="JetBrains Mono" font-size="21" font-weight="400" fill="#a1a1aa" letter-spacing="-0.3">Governed, attributed, encrypted.</text>

  <!-- Foot -->
  <line x1="80" y1="560" x2="1120" y2="560" stroke="#27272a" stroke-width="1"/>
  <text x="80" y="596" font-family="JetBrains Mono" font-size="20" font-weight="600" fill="#fafafa" letter-spacing="4">CODEFLARE.CH</text>
  <text x="1120" y="596" text-anchor="end" font-family="JetBrains Mono" font-size="16" font-weight="400" fill="#71717a" letter-spacing="2">GRAY MATTER GMBH</text>
</svg>
