version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # Cooldown before a freshly published version is proposed. The npm
    # compromise pattern is publish-malicious-version then wait for automation
    # to pull it within hours; a waiting period lets the ecosystem revoke it
    # first. 7 days is zizmor's floor for default-days; majors get 30 because
    # they carry the most change and get the least scrutiny in review.
    cooldown:
      default-days: 7
      semver-major-days: 30
    # Owns the application Wrangler pin. Workflow-only Wrangler has its own
    # isolated lock-backed directory below.

  - package-ecosystem: npm
    directory: /.github/npm-tools/wrangler
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30

  - package-ecosystem: npm
    directory: /web-ui
    target-branch: develop
    schedule:
      interval: weekly
    # Cooldown before a freshly published version is proposed. The npm
    # compromise pattern is publish-malicious-version then wait for automation
    # to pull it within hours; a waiting period lets the ecosystem revoke it
    # first. 7 days is zizmor's floor for default-days; majors get 30 because
    # they carry the most change and get the least scrutiny in review.
    cooldown:
      default-days: 7
      semver-major-days: 30

  - package-ecosystem: npm
    directory: /host
    target-branch: develop
    schedule:
      interval: weekly
    # Cooldown before a freshly published version is proposed. The npm
    # compromise pattern is publish-malicious-version then wait for automation
    # to pull it within hours; a waiting period lets the ecosystem revoke it
    # first. 7 days is zizmor's floor for default-days; majors get 30 because
    # they carry the most change and get the least scrutiny in review.
    cooldown:
      default-days: 7
      semver-major-days: 30

  - package-ecosystem: npm
    directory: /landing
    target-branch: develop
    schedule:
      interval: weekly
    # Cooldown before a freshly published version is proposed. The npm
    # compromise pattern is publish-malicious-version then wait for automation
    # to pull it within hours; a waiting period lets the ecosystem revoke it
    # first. 7 days is zizmor's floor for default-days; majors get 30 because
    # they carry the most change and get the least scrutiny in review.
    cooldown:
      default-days: 7
      semver-major-days: 30

  - package-ecosystem: npm
    directory: /openvscode/agent-sidebar
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
    # Both type packages describe a runtime this repo pins, so npm's newest is
    # not automatically safe. @types/vscode is an API floor that must not exceed
    # code-server's embedded Code version in the Dockerfile; @types/node must
    # match engines.node. Taking either ahead of its runtime types the extension
    # against APIs that are not there and moves failure from build time to
    # activation time. They are bumped deliberately with their runtime. The
    # contract test in host/__tests__/entrypoint-openvscode.test.js checks the
    # VS Code floor against embedded Code and @types/node against the major of
    # the Node used by the sidebar builder stage. Node type minors move on
    # DefinitelyTyped's cadence rather than Node's, so they are left free here and
    # only majors are ignored below.
    ignore:
      - dependency-name: "@types/vscode"
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Pi agent preseed (@gotgenes/pi-subagents, context-mode)
  # is intentionally NOT managed by Dependabot. Although it has a real
  # package.json + lockfile, every version here is ALSO pinned as a literal
  # install spec in entrypoint.sh (the Pi settings `required` array) and baked
  # into src/lib/agent-seed.generated.ts. Dependabot only sees the manifest, so
  # it would bump the manifest while the entrypoint literal + generated seed
  # drift out of sync. The `pi-extensions` job in bump-shadow-pins.yml owns these
  # pins instead: it updates the manifest, lockfile, entrypoint.sh, the
  # agent-seed-manifest tests, and regenerates the seed in one PR.
  # context-mode is the exception: it is pinned in TWO installs (this Pi copy AND
  # the Claude global plugin via plugin.json), so the dedicated `context-mode` job
  # owns its FULL bump (both pins in one PR) and the `pi-extensions` job skips it —
  # otherwise two PRs could move only one pin and the Dockerfile would FATAL on drift.

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # Docker supports the default waiting period but not semver-specific
    # cooldown keys.
    cooldown:
      default-days: 7
    ignore:
      # Stay on Node LTS (even majors: 22, 24, 26, ...). Dependabot kept proposing
      # Node 25 Current (non-LTS), which should not ship to the production Container DO.
      # Revisit manually when Node 26 LTS is released.
      - dependency-name: "docker.io/library/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "public.ecr.aws/docker/library/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # GitHub Actions supports the default waiting period but not semver-specific
    # cooldown keys.
    cooldown:
      default-days: 7
