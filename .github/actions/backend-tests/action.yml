name: 'Backend tests (fail-closed)'
description: >-
  Runs the backend vitest suite (Cloudflare Workers pool) with a machine-readable
  JSON report and gates the result via scripts/ci/check-backend-test-report.mjs.
  The gate tolerates the known workerd teardown crash ONLY on a parsed report
  showing >0 tests and 0 failures — everything else fails closed. Single source
  of truth for the guard formerly duplicated across test.yml and deploy.yml.
inputs:
  shard:
    description: 'Optional vitest --shard value (e.g. "1/2"). Empty runs the whole suite.'
    required: false
    default: ''
  artifact-suffix:
    description: 'Suffix for the uploaded report/log artifact name (artifact names cannot contain "/").'
    required: false
    default: 'all'
  node-suite:
    description: 'Run the Node-runtime suite ("true"/"false"). It is not sharded — enable in exactly one leg.'
    required: false
    default: 'true'
  workers-suite:
    description: 'Run the sharded Workers-pool suite ("true"/"false"). Off for the leg that only carries the Node suite.'
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Run backend vitest suite
      if: inputs.workers-suite == 'true'
      shell: bash
      env:
        # Plain-text output so the gate's fingerprint check reads stable bytes.
        NO_COLOR: '1'
        FORCE_COLOR: '0'
        SHARD: ${{ inputs.shard }}
      run: |
        set +e
        # CLI reporters replace the config ones: dot for humans, json for the gate.
        npm test -- ${SHARD:+--shard="$SHARD"} \
          --reporter=dot --reporter=json --outputFile.json=/tmp/backend-tests.json \
          2>&1 | tee /tmp/backend-tests.log
        status=${PIPESTATUS[0]}
        set -e
        node scripts/ci/check-backend-test-report.mjs "$status" /tmp/backend-tests.json /tmp/backend-tests.log

    - name: Run Node-environment tests
      # Plain Node vitest project (vitest.node.config.ts): no workerd, but the
      # same JSON gate closes the zero-test hole — a file that loads yet collects
      # nothing fails loudly instead of rotting green.
      if: inputs.node-suite == 'true'
      shell: bash
      env:
        NO_COLOR: '1'
        FORCE_COLOR: '0'
        WORKERS_SUITE: ${{ inputs.workers-suite }}
      run: |
        # `pretest` (seed regeneration) hooks `npm test`, not `npm run test:node`.
        # On the leg that skips the Workers suite nothing has regenerated the seeds
        # yet, and these tests read them.
        if [ "$WORKERS_SUITE" != "true" ]; then npm run pretest; fi
        set +e
        npm run test:node -- \
          --reporter=dot --reporter=json --outputFile.json=/tmp/node-tests.json \
          2>&1 | tee /tmp/node-tests.log
        status=${PIPESTATUS[0]}
        set -e
        node scripts/ci/check-backend-test-report.mjs "$status" /tmp/node-tests.json /tmp/node-tests.log

    - name: Upload test report and log
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: backend-tests-${{ inputs.artifact-suffix }}
        path: |
          /tmp/backend-tests.json
          /tmp/backend-tests.log
          /tmp/node-tests.json
          /tmp/node-tests.log
        retention-days: 5
        if-no-files-found: ignore
