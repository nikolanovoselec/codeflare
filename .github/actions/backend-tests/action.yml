name: 'Backend tests (fail-closed)'
description: >-
  Runs the backend vitest suite (Cloudflare Workers pool) with a machine-readable
  JSON report and gates the result via scripts/ci/check-backend-test-report.mjs.
  The gate tolerates the known workerd teardown crash ONLY on a parsed report
  showing >0 tests and 0 failures — everything else fails closed. Single source
  of truth for the guard formerly duplicated across test.yml and deploy.yml.
inputs:
  shard:
    description: 'Optional vitest --shard value (e.g. "1/2"). Empty runs the whole suite.'
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Run backend vitest suite
      shell: bash
      env:
        # Plain-text output so the gate's fingerprint check reads stable bytes.
        NO_COLOR: '1'
        FORCE_COLOR: '0'
        SHARD: ${{ inputs.shard }}
      run: |
        set +e
        # CLI reporters replace the config ones: dot for humans, json for the gate.
        npm test -- ${SHARD:+--shard="$SHARD"} \
          --reporter=dot --reporter=json --outputFile.json=/tmp/backend-tests.json \
          2>&1 | tee /tmp/backend-tests.log
        status=${PIPESTATUS[0]}
        set -e
        node scripts/ci/check-backend-test-report.mjs "$status" /tmp/backend-tests.json /tmp/backend-tests.log
