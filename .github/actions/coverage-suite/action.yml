name: 'Coverage suite (fail-closed)'
description: 'Runs one complete Vitest suite with global coverage thresholds and the bounded workerd teardown exception.'
inputs:
  working-directory:
    description: 'Package directory containing the Vitest suite.'
    required: true
  key-prefix:
    description: 'Dependency-cache prefix for that package directory.'
    required: true
  slug:
    description: 'Name used in the coverage summary.'
    required: true
  tolerate-pool-crash:
    description: 'Whether the known post-report workerd teardown fingerprint may excuse a non-zero exit.'
    required: false
    default: 'false'
  changed-base:
    description: 'Full pull-request base SHA; blank disables changed-line evaluation outside pull requests.'
    required: false
    default: ''
  changed-line-threshold:
    description: 'Package changed-production-line coverage floor (strictly below 100).'
    required: false
    default: '80'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'

    - uses: ./.github/actions/install-deps
      with:
        directory: ${{ inputs.working-directory }}
        key-prefix: ${{ inputs.key-prefix }}

    - name: Create assets directory required by wrangler.toml
      shell: bash
      run: mkdir -p "$GITHUB_WORKSPACE/web-ui/dist"

    - name: Fetch changed-line base commit
      if: inputs.changed-base != ''
      shell: bash
      env:
        CHANGED_BASE: ${{ inputs.changed-base }}
      run: |
        set -euo pipefail
        [[ "$CHANGED_BASE" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::changed-base must be a full commit SHA"; exit 1; }
        git cat-file -e "$CHANGED_BASE^{commit}" 2>/dev/null \
          || git fetch --no-tags --depth=1 origin "$CHANGED_BASE"
        git cat-file -e "$CHANGED_BASE^{commit}" 2>/dev/null \
          || { echo "::error::unable to resolve the exact changed-base commit"; exit 1; }

    - name: Run suite with coverage
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        NO_COLOR: '1'
        TOLERATE_POOL_CRASH: ${{ inputs.tolerate-pool-crash }}
        CHANGED_BASE: ${{ inputs.changed-base }}
        CHANGED_LINE_THRESHOLD: ${{ inputs.changed-line-threshold }}
        PACKAGE_ROOT: ${{ inputs.working-directory }}
      run: |
        set -o pipefail
        status=0
        npm test -- --coverage --reporter=dot 2>&1 | tee /tmp/coverage.log || status=$?

        args=(/tmp/coverage.log "$status" "$TOLERATE_POOL_CRASH")
        if [ -n "$CHANGED_BASE" ]; then
          args+=(
            "$GITHUB_WORKSPACE/$PACKAGE_ROOT/coverage/lcov.info"
            "$CHANGED_BASE"
            "$PACKAGE_ROOT"
            "$CHANGED_LINE_THRESHOLD"
          )
        fi
        node "$GITHUB_WORKSPACE/scripts/ci/check-coverage-result.mjs" "${args[@]}"

    - name: Publish coverage table
      if: always()
      shell: bash
      env:
        SLUG: ${{ inputs.slug }}
      run: node "$GITHUB_WORKSPACE/scripts/ci/render-coverage-summary.mjs" /tmp/coverage.log "$SLUG" >> "$GITHUB_STEP_SUMMARY"
