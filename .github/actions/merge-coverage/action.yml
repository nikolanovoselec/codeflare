name: 'Merge matrix coverage (fail-closed)'
description: 'Merges coverage emitted by every test shard, then enforces package and changed-line thresholds without rerunning tests.'
inputs:
  artifact-pattern:
    description: 'Artifact pattern containing shard coverage-final.json files.'
    required: true
  artifact-prefix:
    description: 'Exact artifact directory prefix; identities must be prefix-1 through prefix-N.'
    required: true
  expected-shards:
    description: 'Exact number of coverage reports required.'
    required: true
  slug:
    description: 'Package label used for temporary paths and summaries.'
    required: true
  package-root:
    description: 'Package root accepted by the changed-line coverage gate.'
    required: true
  changed-base:
    description: 'Full pull-request base SHA; blank disables changed-line evaluation.'
    required: false
    default: ''
  changed-line-threshold:
    description: 'Changed-production-line coverage floor.'
    required: true
  statements-threshold:
    required: true
  branches-threshold:
    required: true
  functions-threshold:
    required: true
  lines-threshold:
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'

    - name: Download shard coverage
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: ${{ inputs.artifact-pattern }}
        path: ${{ runner.temp }}/${{ inputs.slug }}-coverage-shards

    - name: Fetch changed-line base commit
      if: inputs.changed-base != ''
      shell: bash
      env:
        CHANGED_BASE: ${{ inputs.changed-base }}
      run: |
        set -euo pipefail
        [[ "$CHANGED_BASE" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::changed-base must be a full commit SHA"; exit 1; }
        git cat-file -e "$CHANGED_BASE^{commit}" 2>/dev/null \
          || git fetch --no-tags --depth=1 origin "$CHANGED_BASE"
        git cat-file -e "$CHANGED_BASE^{commit}" 2>/dev/null \
          || { echo "::error::unable to resolve the exact changed-base commit"; exit 1; }

    - name: Merge shard coverage and enforce thresholds
      shell: bash
      env:
        SLUG: ${{ inputs.slug }}
        EXPECTED_SHARDS: ${{ inputs.expected-shards }}
        ARTIFACT_PREFIX: ${{ inputs.artifact-prefix }}
        PACKAGE_ROOT: ${{ inputs.package-root }}
        CHANGED_BASE: ${{ inputs.changed-base }}
        CHANGED_LINE_THRESHOLD: ${{ inputs.changed-line-threshold }}
        STATEMENTS_THRESHOLD: ${{ inputs.statements-threshold }}
        BRANCHES_THRESHOLD: ${{ inputs.branches-threshold }}
        FUNCTIONS_THRESHOLD: ${{ inputs.functions-threshold }}
        LINES_THRESHOLD: ${{ inputs.lines-threshold }}
      run: |
        set -o pipefail
        shard_root="$RUNNER_TEMP/${SLUG}-coverage-shards"
        output="$RUNNER_TEMP/${SLUG}-coverage"
        log="$RUNNER_TEMP/${SLUG}-coverage.log"
        status=0
        node "$GITHUB_WORKSPACE/scripts/ci/merge-shard-coverage.mjs" \
          "$shard_root" "$output" "$EXPECTED_SHARDS" "$ARTIFACT_PREFIX" \
          "$STATEMENTS_THRESHOLD" "$BRANCHES_THRESHOLD" \
          "$FUNCTIONS_THRESHOLD" "$LINES_THRESHOLD" \
          2>&1 | tee "$log" || status=$?

        args=("$log" "$status" false)
        if [ -n "$CHANGED_BASE" ]; then
          args+=("$output/lcov.info" "$CHANGED_BASE" "$PACKAGE_ROOT" "$CHANGED_LINE_THRESHOLD")
        fi
        node "$GITHUB_WORKSPACE/scripts/ci/check-coverage-result.mjs" "${args[@]}"

    - name: Upload merged coverage
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-${{ inputs.slug }}
        path: |
          ${{ runner.temp }}/${{ inputs.slug }}-coverage
          ${{ runner.temp }}/${{ inputs.slug }}-coverage.log
        retention-days: 5
        if-no-files-found: error
