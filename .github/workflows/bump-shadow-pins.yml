name: Bump Shadow Pins

# Watches reviewed pins outside normal Dependabot ownership and opens one PR
# per bump, regenerating committed locks where the image consumes npm packages.
#
# Currently watched:
# - context-mode npm package (plugin.json + entrypoint.sh + Pi foreground-owner runtime + README.md)
# - graphify PyPI package graphifyy (plugin.json; Dockerfile reads the pin via jq,
#   so no Dockerfile literal to bump)
# - zoxide, yazi, lazygit, silverbullet, code-server (GitHub release binaries pinned in Dockerfile; code-server also owns its embedded Code gitlink)
# - Anthropic's official Claude Code Open VSX package (version + linux-x64 SHA-256 metadata)
# - lock-backed image npm tools: agent CLIs, Bun, context-mode,
#   consult-llm-mcp, and chrome-devtools-mcp
# - uv versioned GitHub archive + authoritative SHA-256 digest
# - browser-run-mcp: @modelcontextprotocol/sdk manifest + lock pin
# - pi-extensions: every dependency in preseed/agents/pi/package.json except context-mode
#   (the @juicesharp rpiv family, @narumitw/pi-goal, @narumitw/pi-plan-mode, @narumitw/pi-usage,
#   pi-caveman, pi-web-access, pi-mcp-adapter, @gotgenes/pi-subagents) — each is also a literal install
#   spec in entrypoint.sh + baked into the seed; context-mode is owned
#   atomically by its dedicated job above
# - impeccable skill bundle (vendored for Claude Code + Pi, checked via impeccable.style)
# - actionlint and zizmor (version + SHA256 in the non-executable
#   .github/workflow-tool-pins.json manifest; workflows read that one validated
#   source, so the standard GITHUB_TOKEN can push bump branches without workflow
#   write permission)
# - the five coding-agent CLIs baked into the image (claude-code, codex,
#   opencode-ai, copilot, pi-coding-agent) from the shared npm-tools lock; the
#   candidate is the newest release published MORE than 7 days ago, mirroring
#   the dependabot.yml cooldown, and the bump is forward-only
# - the Antigravity CLI installer script, pinned by sha256 in the Dockerfile
#   (a changed hash is both a normal vendor update and what substitution looks
#   like, so its PR asks for the installer diff to be reviewed)

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:

# Every job probes `git ls-remote` for an existing bump branch and then creates
# it. That check is TOCTOU the moment two runs overlap — a Monday cron racing a
# manual dispatch would have both jobs decide the branch is absent and both push.
# Serialised rather than cancel-in-progress: a half-finished run has already
# pushed branches, and cancelling it would leave them without PRs.
concurrency:
  group: bump-shadow-pins
  cancel-in-progress: false

# Baseline is read-only; every job that pushes a bump branch and opens a PR
# elevates itself. pi-extensions-discover only lists package names.
#
# No job persists credentials: `actions/checkout` would write the token into
# .git/config, where every later step can read it — including the install
# scripts `npm ci` runs in the jobs that regenerate lockfiles. Checkouts set
# persist-credentials: false and the push authenticates explicitly, narrowing
# the token's exposure from "the rest of the job" to one git invocation.
# Branch-existence probes use unauthenticated ls-remote (this repo is public).
permissions:
  contents: read

jobs:
  context-mode:
    runs-on: ubuntu-latest
    # Without this every job inherits the 360-minute ceiling. These jobs curl
    # third-party hosts with no --max-time and several run `npm ci`; a hung TLS
    # connection burns six runner-hours before GitHub kills it. install-deps
    # already wraps npm ci in `timeout 600` for exactly this reason.
    timeout-minutes: 20
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open the bump PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Resolve the newest release past the cooldown
        id: cooldown
        uses: ./.github/actions/npm-cooldown-version
        with:
          package: context-mode

      - name: Diff current pin against npm latest
        id: ver
        env:
          COOLDOWN_VERSION: ${{ steps.cooldown.outputs.version }}
        run: |
          set -euo pipefail
          CURRENT=$(jq -r .version preseed/agents/claude/plugins/context-mode/.claude-plugin/plugin.json)
          LATEST="$COOLDOWN_VERSION"
          if [ -z "$LATEST" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Nothing past the cooldown."; exit 0; fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          DECISION=$(node scripts/ci/semver-forward.mjs "$CURRENT" "$LATEST")
          if [ "$DECISION" = upgrade ]; then
            echo "Bumping $CURRENT -> $LATEST"
          elif [ "$DECISION" = skip ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Candidate $LATEST is not newer than pinned $CURRENT — nothing to do."
          else
            echo "::error::unexpected forward-only decision: $DECISION"
            exit 2
          fi

      - name: Skip if a branch for this version already exists
        if: steps.ver.outputs.skip != 'true'
        env:
          LAT: ${{ steps.ver.outputs.latest }}
        id: branch
        run: |
          BRANCH="bump/context-mode-$LAT"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists, skipping (existing PR likely open)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply bump
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -B "$BRANCH"

          node <<'NODE'
          const fs = require('node:fs');
          const cur = process.env.CUR;
          const lat = process.env.LAT;
          const files = [
            'preseed/agents/claude/plugins/context-mode/.claude-plugin/plugin.json',
            'preseed/agents/claude/plugins/context-mode/README.md',
            'preseed/npm-tools/package.json',
          ];
          for (const f of files) {
            const before = fs.readFileSync(f, 'utf-8');
            const after = before.replaceAll(cur, lat);
            if (before !== after) {
              fs.writeFileSync(f, after);
              console.log(`updated ${f}`);
            }
          }
          // Fix entrypoint.sh fallback versions (these may have drifted from
          // the canonical plugin.json version). Regex targets the specific
          // patterns rather than a blind string replace.
          const ep = 'entrypoint.sh';
          let epContent = fs.readFileSync(ep, 'utf-8');
          const epBefore = epContent;
          epContent = epContent.replace(
            /CONTEXT_MODE_VERSION="[^"]+"/g,
            `CONTEXT_MODE_VERSION="${lat}"`
          );
          epContent = epContent.replace(
            /\.version \/\/ "[^"]+"' "\$CONTEXT_MODE_MANIFEST"/g,
            `.version // "${lat}"' "$CONTEXT_MODE_MANIFEST"`
          );
          epContent = epContent.replace(
            /\|\| echo "[0-9]+\.[0-9]+\.[0-9]+"/g,
            `|| echo "${lat}"`
          );
          epContent = epContent.replace(
            /npm:context-mode@[0-9]+\.[0-9]+\.[0-9]+/g,
            `npm:context-mode@${lat}`
          );
          if (epContent !== epBefore) {
            fs.writeFileSync(ep, epContent);
            console.log(`updated ${ep}`);
          }

          // Pi prewarm copy: Pi loads context-mode as its OWN `npm:context-mode@<ver>`
          // package (preseed/agents/pi package.json + lockfile), mirrored in
          // context-mode-runtime.ts (CONTEXT_MODE_PACKAGE) and the Pi settings test. This job
          // owns the WHOLE context-mode bump so the global plugin pin and the Pi pin
          // move together in ONE PR and can never drift (the Dockerfile FATALs if they
          // do; the pi-extensions job excludes context-mode for this reason). Name-anchored
          // replacements only, so no unrelated version string is ever rewritten.
          const piFiles = [
            'preseed/agents/pi/package.json',
            'preseed/agents/pi/extensions/context-mode-runtime.ts',
            'host/__tests__/pi-settings-packages.test.js',
          ];
          for (const f of piFiles) {
            const before = fs.readFileSync(f, 'utf-8');
            const after = before
              .replaceAll(`"context-mode": "${cur}"`, `"context-mode": "${lat}"`)
              .replaceAll(`npm:context-mode@${cur}`, `npm:context-mode@${lat}`);
            if (before !== after) { fs.writeFileSync(f, after); console.log(`updated ${f}`); }
          }
          NODE

          # Regenerate both lock-backed installs and retain the bounded bundled
          # dependency integrity pins before rebuilding the embedded seed.
          node scripts/regenerate-npm-package-lock.mjs preseed/agents/pi
          node scripts/regenerate-npm-package-lock.mjs preseed/npm-tools
          npm ci --no-audit --no-fund --silent
          npm run generate:agent-seed

          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed (replacement found nothing) - aborting."
            exit 1
          fi
          git commit -m "chore(deps): bump context-mode $CUR -> $LAT"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUR: ${{ steps.ver.outputs.current }}
          LAT: ${{ steps.ver.outputs.latest }}

      - name: Open PR
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUR: ${{ steps.ver.outputs.current }}
          LAT: ${{ steps.ver.outputs.latest }}
        run: |
          set -euo pipefail
          BODY=$(cat <<EOF
          Auto-generated bump of \`context-mode\` from \`$CUR\` to \`$LAT\`.

          The version is shadow-pinned (no package.json entry the global install reads) so Dependabot can't open this PR - \`bump-shadow-pins.yml\` does it weekly. This job bumps BOTH context-mode installs (the Claude global plugin pin AND the Pi prewarm copy) in one PR so they can never drift; the \`pi-extensions\` job intentionally excludes context-mode.

          Files updated by string replace + lockfile + agent-seed regenerate:
          - \`preseed/agents/claude/plugins/context-mode/.claude-plugin/plugin.json\` (global install)
          - \`preseed/agents/claude/plugins/context-mode/README.md\`
          - \`entrypoint.sh\` (CONTEXT_MODE_VERSION + jq/bash fallback strings + Pi \`npm:context-mode@\` spec)
          - \`preseed/agents/pi/package.json\` + \`package-lock.json\` (Pi prewarm copy)
          - \`preseed/agents/pi/extensions/context-mode-runtime.ts\` (\`CONTEXT_MODE_PACKAGE\` + foreground-owner loader)
          - \`host/__tests__/pi-settings-packages.test.js\` (pinned-version assertions)
          - \`src/lib/agent-seed.generated.ts\` (regenerated)

          ## Test plan
          - [ ] CI green
          - [ ] Smoke test on integration: \`ctx_doctor\` reports the new version
          EOF
          )
          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "chore(deps): bump context-mode $CUR -> $LAT" \
            --body "$BODY"

  graphify:
    runs-on: ubuntu-latest
    # Without this every job inherits the 360-minute ceiling. These jobs curl
    # third-party hosts with no --max-time and several run `npm ci`; a hung TLS
    # connection burns six runner-hours before GitHub kills it. install-deps
    # already wraps npm ci in `timeout 600` for exactly this reason.
    timeout-minutes: 20
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open the bump PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Diff current pin against PyPI latest
        id: ver
        run: |
          set -euo pipefail
          CURRENT=$(jq -r .version preseed/agents/claude/plugins/graphify/.claude-plugin/plugin.json)
          # graphify ships on PyPI as `graphifyy` (Dockerfile: uv tool install graphifyy==$VER).
          LATEST=$(curl -fsSL https://pypi.org/pypi/graphifyy/json | jq -r .info.version)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already on $LATEST, nothing to do."
          else
            echo "Bumping $CURRENT -> $LATEST"
          fi

      - name: Skip if a branch for this version already exists
        if: steps.ver.outputs.skip != 'true'
        env:
          LAT: ${{ steps.ver.outputs.latest }}
        id: branch
        run: |
          BRANCH="bump/graphify-$LAT"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists, skipping (existing PR likely open)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply bump
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -B "$BRANCH"

          node <<'NODE'
          const fs = require('node:fs');
          const cur = process.env.CUR;
          const lat = process.env.LAT;
          // plugin.json carries the version twice (.version + the graphifyy@X.Y.Z
          // string in .description); replaceAll covers both occurrences.
          const files = [
            'preseed/agents/claude/plugins/graphify/.claude-plugin/plugin.json',
          ];
          for (const f of files) {
            const before = fs.readFileSync(f, 'utf-8');
            const after = before.replaceAll(cur, lat);
            if (before !== after) {
              fs.writeFileSync(f, after);
              console.log(`updated ${f}`);
            }
          }
          NODE

          npm ci --no-audit --no-fund --silent
          npm run generate:agent-seed

          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed (replacement found nothing) - aborting."
            exit 1
          fi
          git commit -m "chore(deps): bump graphify $CUR -> $LAT"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUR: ${{ steps.ver.outputs.current }}
          LAT: ${{ steps.ver.outputs.latest }}

      - name: Open PR
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUR: ${{ steps.ver.outputs.current }}
          LAT: ${{ steps.ver.outputs.latest }}
        run: |
          set -euo pipefail
          BODY=$(cat <<EOF
          Auto-generated bump of \`graphify\` (PyPI \`graphifyy\`) from \`$CUR\` to \`$LAT\`.

          The version is shadow-pinned (no package.json entry; the Dockerfile reads it from \`plugin.json\` via jq) so Dependabot can't open this PR - \`bump-shadow-pins.yml\` does it weekly.

          Files updated by string replace + agent-seed regenerate:
          - \`preseed/agents/claude/plugins/graphify/.claude-plugin/plugin.json\` (.version + graphifyy@X.Y.Z description)
          - \`src/lib/agent-seed.generated.ts\` (regenerated)

          ## Test plan
          - [ ] CI green
          - [ ] Review the graphify CHANGELOG for the bumped range before merge
          - [ ] Smoke test on integration: \`graphify --version\` reports the new version
          EOF
          )
          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "chore(deps): bump graphify $CUR -> $LAT" \
            --body "$BODY"

  zoxide:
    runs-on: ubuntu-latest
    # Without this every job inherits the 360-minute ceiling. These jobs curl
    # third-party hosts with no --max-time and several run `npm ci`; a hung TLS
    # connection burns six runner-hours before GitHub kills it. install-deps
    # already wraps npm ci in `timeout 600` for exactly this reason.
    timeout-minutes: 20
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open the bump PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Compare Dockerfile pin against latest GitHub release
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT=$(grep -oP 'ZOXIDE_VERSION="\K[^"]+' Dockerfile)
          TAG=$(gh api repos/ajeetdsouza/zoxide/releases/latest --jq .tag_name)
          LATEST="${TAG#v}"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already on $LATEST, nothing to do."
          else
            echo "Bumping $CURRENT -> $LATEST"
          fi

      - name: Skip if a branch for this version already exists
        if: steps.ver.outputs.skip != 'true'
        env:
          LAT: ${{ steps.ver.outputs.latest }}
        id: branch
        run: |
          BRANCH="bump/zoxide-$LAT"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply bump
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -B "$BRANCH"

          node <<'NODE'
          const fs = require('node:fs');
          const lat = process.env.LAT;
          let content = fs.readFileSync('Dockerfile', 'utf-8');
          content = content.replace(/ZOXIDE_VERSION="[^"]+"/, `ZOXIDE_VERSION="${lat}"`);
          content = content.replace(/ZOXIDE_SHA256="[^"]+"/, `ZOXIDE_SHA256="NEEDS_UPDATE_SEE_PR_BODY"`);
          fs.writeFileSync('Dockerfile', content);
          NODE

          git add Dockerfile
          if git diff --cached --quiet; then
            echo "Nothing changed - aborting."
            exit 1
          fi
          git commit -m "chore(deps): bump zoxide $CUR -> $LAT"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUR: ${{ steps.ver.outputs.current }}
          LAT: ${{ steps.ver.outputs.latest }}

      - name: Open PR
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUR: ${{ steps.ver.outputs.current }}
          LAT: ${{ steps.ver.outputs.latest }}
        run: |
          set -euo pipefail
          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "chore(deps): bump zoxide $CUR -> $LAT" \
            --body "$(cat <<EOF
          Auto-generated bump of \`zoxide\` from \`$CUR\` to \`$LAT\`.

          The version is pinned in \`Dockerfile\` with a SHA256 checksum - Dependabot can't see it, so \`bump-shadow-pins.yml\` opens this PR weekly.

          **Action required before merge:** Update the SHA256 checksum in Dockerfile:
          \`\`\`bash
          curl -fsSL "https://github.com/ajeetdsouza/zoxide/releases/download/v${LAT}/zoxide-${LAT}-x86_64-unknown-linux-musl.tar.gz" | sha256sum
          \`\`\`

          ## Test plan
          - [ ] Update \`ZOXIDE_SHA256\` in Dockerfile
          - [ ] CI green (Docker build verifies checksum)
          EOF
          )"

  yazi:
    runs-on: ubuntu-latest
    # Without this every job inherits the 360-minute ceiling. These jobs curl
    # third-party hosts with no --max-time and several run `npm ci`; a hung TLS
    # connection burns six runner-hours before GitHub kills it. install-deps
