          Files updated:
          - \`preseed/agents/claude/skills/impeccable/**\`
          - \`preseed/agents/pi/skills/impeccable/**\`
          - \`preseed/agents/claude/manifest.json\` + \`preseed/agents/pi/manifest.json\`
          - \`src/lib/agent-seed.generated.ts\`

          ## Test plan
          - [ ] CI green
          - [ ] Smoke test on integration: \`/impeccable\` loads in Claude Code and Pi
          EOF
          )
          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "chore(deps): bump impeccable $CUR -> $LAT" \
