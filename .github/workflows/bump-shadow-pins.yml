          \`\`\`bash
          curl -fsSL "https://github.com/sxyazi/yazi/releases/download/v${LAT}/yazi-x86_64-unknown-linux-musl.zip" | sha256sum
          \`\`\`

          ## Test plan
          - [ ] Update \`YAZI_SHA256\` in Dockerfile
          - [ ] CI green (Docker build verifies checksum)
          EOF
          )"

  lazygit:
    runs-on: ubuntu-latest
    # Without this every job inherits the 360-minute ceiling. These jobs curl
    # third-party hosts with no --max-time and several run `npm ci`; a hung TLS
    # connection burns six runner-hours before GitHub kills it. install-deps
    # already wraps npm ci in `timeout 600` for exactly this reason.
    timeout-minutes: 20
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open the bump PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Compare Dockerfile pin against latest GitHub release
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT=$(grep -oP 'LAZYGIT_VERSION="\K[^"]+' Dockerfile)
          TAG=$(gh api repos/jesseduffield/lazygit/releases/latest --jq .tag_name)
          LATEST="${TAG#v}"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already on $LATEST, nothing to do."
          else
            echo "Bumping $CURRENT -> $LATEST"
          fi

      - name: Skip if a branch for this version already exists
        if: steps.ver.outputs.skip != 'true'
        env:
          LAT: ${{ steps.ver.outputs.latest }}
        id: branch
        run: |
          BRANCH="bump/lazygit-$LAT"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply bump
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -B "$BRANCH"

          node <<'NODE'
          const fs = require('node:fs');
          const lat = process.env.LAT;
          let content = fs.readFileSync('Dockerfile', 'utf-8');
          content = content.replace(/LAZYGIT_VERSION="[^"]+"/, `LAZYGIT_VERSION="${lat}"`);
          content = content.replace(/LAZYGIT_SHA256="[^"]+"/, `LAZYGIT_SHA256="NEEDS_UPDATE_SEE_PR_BODY"`);
          fs.writeFileSync('Dockerfile', content);
          NODE

          git add Dockerfile
          if git diff --cached --quiet; then
            echo "Nothing changed - aborting."
            exit 1
          fi
          git commit -m "chore(deps): bump lazygit $CUR -> $LAT"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUR: ${{ steps.ver.outputs.current }}
          LAT: ${{ steps.ver.outputs.latest }}

      - name: Open PR
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUR: ${{ steps.ver.outputs.current }}
          LAT: ${{ steps.ver.outputs.latest }}
        run: |
          set -euo pipefail
          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "chore(deps): bump lazygit $CUR -> $LAT" \
            --body "$(cat <<EOF
          Auto-generated bump of \`lazygit\` from \`$CUR\` to \`$LAT\`.

          The version is pinned in \`Dockerfile\` with a SHA256 checksum - Dependabot can't see it, so \`bump-shadow-pins.yml\` opens this PR weekly.

          **Action required before merge:** Update the SHA256 checksum in Dockerfile:
          \`\`\`bash
          curl -fsSL "https://github.com/jesseduffield/lazygit/releases/download/v${LAT}/lazygit_${LAT}_linux_x86_64.tar.gz" | sha256sum
          \`\`\`

          ## Test plan
          - [ ] Update \`LAZYGIT_SHA256\` in Dockerfile
          - [ ] CI green (Docker build verifies checksum)
          EOF
          )"

  silverbullet:
    runs-on: ubuntu-latest
    # Without this every job inherits the 360-minute ceiling. These jobs curl
    # third-party hosts with no --max-time and several run `npm ci`; a hung TLS
    # connection burns six runner-hours before GitHub kills it. install-deps
    # already wraps npm ci in `timeout 600` for exactly this reason.
    timeout-minutes: 20
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open the bump PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the latest release and authoritative digest
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT=$(grep -oP 'SILVERBULLET_VERSION="\K[^"]+' Dockerfile)
          VENDORED=$(grep -oP 'SilverBullet \K[0-9]+\.[0-9]+\.[0-9]+(?= native service worker)' src/routes/vault/native-sw.ts)
          RELEASE=$(gh api repos/silverbulletmd/silverbullet/releases/latest)
          TAG=$(jq -r .tag_name <<<"$RELEASE")
          LATEST="${TAG#v}"
          VERSION_RE='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          ASSET=$(jq -c '.assets[] | select(.name == "silverbullet-server-linux-x86_64.zip")' <<<"$RELEASE")
          DIGEST=$(jq -r '.digest // empty' <<<"$ASSET")
          URL=$(jq -r '.browser_download_url // empty' <<<"$ASSET")
          if [[ "$TAG" != "$LATEST" && "$TAG" != "v$LATEST" ]] || [[ ! "$CURRENT" =~ $VERSION_RE ]] || [[ ! "$LATEST" =~ $VERSION_RE ]]; then
            echo "Invalid SilverBullet release metadata: current=$CURRENT tag=$TAG" >&2
            exit 1
          fi
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || [ -z "$URL" ]; then
            echo "Release $TAG has no authoritative linux-x86_64 SHA-256 asset digest" >&2
            exit 1
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "sha256=${DIGEST#sha256:}" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$LATEST" ] && [ "$VENDORED" = "$LATEST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Binary and vendored worker are already on $LATEST."
          else
            echo "Bumping coupled SilverBullet assets $CURRENT/$VENDORED -> $LATEST"
          fi

      - name: Skip if a branch for this version already exists
        if: steps.ver.outputs.skip != 'true'
        env:
          LAT: ${{ steps.ver.outputs.latest }}
        id: branch
        run: |
          BRANCH="bump/silverbullet-$LAT"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply coupled SilverBullet bump
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -B "$BRANCH"

          curl -fsSL --retry 3 --retry-delay 5 --connect-timeout 30 "$ASSET_URL" -o /tmp/silverbullet.zip
          printf '%s  %s\n' "$SILVERBULLET_SHA256" /tmp/silverbullet.zip | sha256sum -c -
          rm -rf /tmp/silverbullet-release /tmp/silverbullet-vault
          mkdir -p /tmp/silverbullet-release /tmp/silverbullet-vault
          unzip -q /tmp/silverbullet.zip -d /tmp/silverbullet-release
          /tmp/silverbullet-release/silverbullet --hostname 127.0.0.1 --port 3031 --single /tmp/silverbullet-vault >/tmp/silverbullet.log 2>&1 &
          SB_PID=$!
          trap 'kill "$SB_PID" 2>/dev/null || true; wait "$SB_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS -D /tmp/silverbullet-ping.headers http://127.0.0.1:3031/.ping -o /dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then cat /tmp/silverbullet.log; exit 1; fi
            sleep 1
          done
          SERVER_VERSION=$(awk 'tolower($1) == "x-server-version:" { print $2 }' /tmp/silverbullet-ping.headers | tr -d '\r')
          if [[ "$SERVER_VERSION" != "$LAT" && "$SERVER_VERSION" != "$LAT-"* ]]; then
            echo "Verified archive served unexpected X-Server-Version: $SERVER_VERSION (expected $LAT)" >&2
            cat /tmp/silverbullet.log
            exit 1
          fi
          curl -fsS http://127.0.0.1:3031/service_worker.js -o /tmp/service_worker.js
          SILVERBULLET_VERSION="$LAT" SILVERBULLET_SHA256="$SILVERBULLET_SHA256" \
            node scripts/ci/update-silverbullet-pins.mjs \
              Dockerfile src/routes/vault/native-sw.ts /tmp/service_worker.js
          kill "$SB_PID" 2>/dev/null || true
          wait "$SB_PID" 2>/dev/null || true
          trap - EXIT

          git add Dockerfile src/routes/vault/native-sw.ts
          if git diff --cached --quiet; then
            echo "Nothing changed - aborting."
            exit 1
          fi
          git commit -m "chore(deps): bump silverbullet $CUR -> $LAT"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUR: ${{ steps.ver.outputs.current }}
          LAT: ${{ steps.ver.outputs.latest }}
          ASSET_URL: ${{ steps.ver.outputs.url }}
          SILVERBULLET_SHA256: ${{ steps.ver.outputs.sha256 }}

      - name: Open PR
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUR: ${{ steps.ver.outputs.current }}
          LAT: ${{ steps.ver.outputs.latest }}
        run: |
          set -euo pipefail
          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "chore(deps): bump silverbullet $CUR -> $LAT" \
            --body "$(cat <<EOF
          Auto-generated bump of \`silverbullet\` from \`$CUR\` to \`$LAT\`.

          SilverBullet is a coupled shadow pin: the release binary, its authoritative GitHub asset digest, and Codeflare's grafted native service worker must move together. Dependabot cannot update these files, so \`bump-shadow-pins.yml\` owns the complete bump.

          Updated atomically:
          - \`Dockerfile\` version + SHA-256 from GitHub release asset metadata
          - \`src/routes/vault/native-sw.ts\` verbatim worker + drift hash

          ## Test plan
          - [ ] CI green (Docker verifies the release digest)
          - [ ] Native-worker graft anchors, syntax, cache reload, and behavioral guards pass
          EOF
          )"

  code-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open the bump PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Derive code-server pins from the immutable artifact and release tag
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT=$(grep -oP 'CODE_SERVER_VERSION="\K[^"]+' Dockerfile)
          CURRENT_COMMIT=$(grep -oP 'CODE_SERVER_COMMIT="\K[^"]+' Dockerfile)
          CURRENT_CODE_VERSION=$(grep -oP 'CODE_SERVER_CODE_VERSION="\K[^"]+' Dockerfile)
          CURRENT_VSCODE_COMMIT=$(grep -oP 'CODE_SERVER_VSCODE_COMMIT="\K[^"]+' Dockerfile)
          TAG=$(gh api repos/coder/code-server/releases/latest --jq .tag_name)
          LATEST="${TAG#v}"
          VERSION_RE='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ "$TAG" != "v$LATEST" ]] || [[ ! "$CURRENT" =~ $VERSION_RE ]] || [[ ! "$LATEST" =~ $VERSION_RE ]]; then
            echo "Invalid code-server release metadata: current=$CURRENT tag=$TAG" >&2
            exit 1
          fi

          REF_TYPE=$(gh api "repos/coder/code-server/git/ref/tags/$TAG" --jq .object.type)
          REF_SHA=$(gh api "repos/coder/code-server/git/ref/tags/$TAG" --jq .object.sha)
          if [ "$REF_TYPE" = tag ]; then
            CODE_SERVER_TAG_COMMIT=$(gh api "repos/coder/code-server/git/tags/$REF_SHA" --jq .object.sha)
          elif [ "$REF_TYPE" = commit ]; then
            CODE_SERVER_TAG_COMMIT="$REF_SHA"
          else
            echo "Unexpected tag target type: $REF_TYPE" >&2
            exit 1
          fi
          TREE_SHA=$(gh api "repos/coder/code-server/git/commits/$CODE_SERVER_TAG_COMMIT" --jq .tree.sha)
          CODE_SERVER_VSCODE_COMMIT=$(gh api "repos/coder/code-server/git/trees/$TREE_SHA?recursive=1" \
            --jq '.tree[] | select(.path == "lib/vscode" and .mode == "160000" and .type == "commit") | .sha')
          TAG_CODE_VERSION=$(gh api "repos/microsoft/vscode/contents/package.json?ref=$CODE_SERVER_VSCODE_COMMIT" \
            --jq .content | base64 -d | jq -r .version)

          ARCHIVE="code-server-${LATEST}-linux-amd64.tar.gz"
          ARCHIVE_ROOT="code-server-${LATEST}-linux-amd64"
          gh release download "$TAG" --repo coder/code-server --pattern "$ARCHIVE" --dir /tmp
          PACKAGE_JSON=$(tar -xOf "/tmp/$ARCHIVE" "$ARCHIVE_ROOT/package.json")
          CODE_PACKAGE_JSON=$(tar -xOf "/tmp/$ARCHIVE" "$ARCHIVE_ROOT/lib/vscode/package.json")
          PRODUCT_JSON=$(tar -xOf "/tmp/$ARCHIVE" "$ARCHIVE_ROOT/lib/vscode/product.json")
          CODE_SERVER_COMMIT=$(jq -r .commit <<<"$PACKAGE_JSON")
          CODE_SERVER_CODE_VERSION=$(jq -r .version <<<"$CODE_PACKAGE_JSON")
          PRODUCT_COMMIT=$(jq -r .commit <<<"$PRODUCT_JSON")
          PRODUCT_CODE_VERSION=$(jq -r .version <<<"$PRODUCT_JSON")
          PRODUCT_CODE_SERVER_VERSION=$(jq -r .codeServerVersion <<<"$PRODUCT_JSON")
          rm -f "/tmp/$ARCHIVE"

          [[ "$CODE_SERVER_TAG_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CODE_SERVER_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CODE_SERVER_VSCODE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CODE_SERVER_CODE_VERSION" =~ $VERSION_RE ]]
          [ "$TAG_CODE_VERSION" = "$CODE_SERVER_CODE_VERSION" ]
          [ "$PRODUCT_COMMIT" = "$CODE_SERVER_COMMIT" ]
          [ "$PRODUCT_CODE_VERSION" = "$CODE_SERVER_CODE_VERSION" ]
          [ "$PRODUCT_CODE_SERVER_VERSION" = "$LATEST" ]

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "commit=$CODE_SERVER_COMMIT" >> "$GITHUB_OUTPUT"
          echo "code_version=$CODE_SERVER_CODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "vscode_commit=$CODE_SERVER_VSCODE_COMMIT" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$LATEST" ] \
            && [ "$CURRENT_COMMIT" = "$CODE_SERVER_COMMIT" ] \
            && [ "$CURRENT_CODE_VERSION" = "$CODE_SERVER_CODE_VERSION" ] \
            && [ "$CURRENT_VSCODE_COMMIT" = "$CODE_SERVER_VSCODE_COMMIT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "All code-server provenance pins already match $TAG."
          else
            echo "Bumping code-server $CURRENT -> $LATEST (Code $CODE_SERVER_CODE_VERSION)."
          fi

      - name: Skip if a branch for this version already exists
        if: steps.ver.outputs.skip != 'true'
        id: branch
        env:
          LATEST: ${{ steps.ver.outputs.latest }}
        run: |
          BRANCH="bump/code-server-$LATEST"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply bump and invalidate the release checksum
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          CUR: ${{ steps.ver.outputs.current }}
          LAT: ${{ steps.ver.outputs.latest }}
          CODE_SERVER_VERSION: ${{ steps.ver.outputs.latest }}
          CODE_SERVER_COMMIT: ${{ steps.ver.outputs.commit }}
          CODE_SERVER_CODE_VERSION: ${{ steps.ver.outputs.code_version }}
          CODE_SERVER_VSCODE_COMMIT: ${{ steps.ver.outputs.vscode_commit }}
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -B "$BRANCH"

          node scripts/ci/update-code-server-pins.mjs Dockerfile

          git add Dockerfile
          git diff --cached --quiet && { echo "Nothing changed - aborting."; exit 1; }
          git commit -m "chore(deps): bump code-server $CUR -> $LAT"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"

      - name: Open PR
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          CUR: ${{ steps.ver.outputs.current }}
          LAT: ${{ steps.ver.outputs.latest }}
          CODE_VERSION: ${{ steps.ver.outputs.code_version }}
          VSCODE_COMMIT: ${{ steps.ver.outputs.vscode_commit }}
        run: |
          set -euo pipefail
          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "chore(deps): bump code-server $CUR -> $LAT" \
            --body "$(cat <<EOF
          Auto-generated Browser IDE runtime bump from \`code-server $CUR\` to \`$LAT\` (embedded Code \`$CODE_VERSION\`, source \`$VSCODE_COMMIT\`).

          The runtime, embedded Code version, and source gitlink are derived from the immutable upstream tag. The archive checksum is deliberately invalidated so release-asset verification remains an explicit review step.

          **Action required before merge:** set \`CODE_SERVER_SHA256\` from the linux-amd64 release asset:
          \`\`\`bash
          gh api repos/coder/code-server/releases/tags/v${LAT} \\
            --jq '.assets[] | select(.name == "code-server-${LAT}-linux-amd64.tar.gz") | .digest'
          \`\`\`

          ## Test plan
          - [ ] Replace \`NEEDS_UPDATE_SEE_PR_BODY\` with the digest (without \`sha256:\`)
          - [ ] Review code-server and Code release notes
          - [ ] Deployment image Browser IDE smoke green
          - [ ] Integration Pi and official Claude pass@3 green
          EOF
          )"

  uv:
    # uv is downloaded as an immutable GitHub release archive and verified
    # against GitHub's authoritative asset digest before extraction.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve newest uv release past cooldown with authoritative digest
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT=$(grep -oP '^ARG UV_VERSION=\K.+' Dockerfile)
          CUTOFF=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          RELEASE=$(gh api 'repos/astral-sh/uv/releases?per_page=100' | jq -c --arg cutoff "$CUTOFF" '[.[] | select(.draft == false and .prerelease == false and .published_at <= $cutoff)][0]')
          LATEST=$(jq -r '.tag_name // empty' <<<"$RELEASE")
          LATEST="${LATEST#v}"
          DIGEST=$(jq -r '.assets[] | select(.name == "uv-x86_64-unknown-linux-gnu.tar.gz") | .digest // empty' <<<"$RELEASE")
          SHA256="${DIGEST#sha256:}"
          [ -n "$LATEST" ] && [[ "$SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo 'No cooldown-eligible uv release with digest' >&2; exit 1; }
          printf 'current=%s\nlatest=%s\nsha256=%s\n' "$CURRENT" "$LATEST" "$SHA256" >> "$GITHUB_OUTPUT"
          NEWEST=$(printf '%s\n%s\n' "$CURRENT" "$LATEST" | sort -V | tail -1)
          if [ "$CURRENT" = "$LATEST" ] || [ "$NEWEST" = "$CURRENT" ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if branch exists
        if: steps.ver.outputs.skip != 'true'
        id: branch
        env:
          LAT: ${{ steps.ver.outputs.latest }}
        run: |
          BRANCH="bump/uv-$LAT"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply bump and open PR
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          CUR: ${{ steps.ver.outputs.current }}
          LAT: ${{ steps.ver.outputs.latest }}
          SHA256: ${{ steps.ver.outputs.sha256 }}
        run: |
          set -euo pipefail
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git checkout -B "$BRANCH"
          sed -i "s/^ARG UV_VERSION=.*/ARG UV_VERSION=${LAT}/; s/^ARG UV_X86_64_LINUX_SHA256=.*/ARG UV_X86_64_LINUX_SHA256=${SHA256}/" Dockerfile
          git add Dockerfile
          git commit -m "chore(deps): bump uv $CUR -> $LAT"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          gh pr create --base develop --head "$BRANCH" --title "chore(deps): bump uv $CUR -> $LAT" --body "Updates the immutable uv release archive and its authoritative SHA-256 digest together. CI verifies the digest before extraction."

  bun:
    # Bun is installed from the shared lock because context-mode
    # autodetects it for faster ctx_execute/ctx_batch_execute subprocess starts.
    runs-on: ubuntu-latest
    # Without this every job inherits the 360-minute ceiling. These jobs curl
    # third-party hosts with no --max-time and several run `npm ci`; a hung TLS
    # connection burns six runner-hours before GitHub kills it. install-deps
    # already wraps npm ci in `timeout 600` for exactly this reason.
    timeout-minutes: 20
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open the bump PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Resolve the newest release past the cooldown
        id: cooldown
        uses: ./.github/actions/npm-cooldown-version
        with:
          package: bun

      - name: Diff Dockerfile pin against npm latest
        id: ver
        env:
          COOLDOWN_VERSION: ${{ steps.cooldown.outputs.version }}
        run: |
          set -euo pipefail
