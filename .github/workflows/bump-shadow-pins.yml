  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open the bump PR
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Compare zizmor.yml pin against latest GitHub release
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT=$(grep -oP "^\s+VERSION: '\K[^']+" .github/workflows/zizmor.yml)
          TAG=$(gh api repos/rhysd/actionlint/releases/latest --jq .tag_name)
          LATEST="${TAG#v}"
          VERSION_RE='^[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "$CURRENT" =~ $VERSION_RE ]] || [[ ! "$LATEST" =~ $VERSION_RE ]]; then
            echo "Invalid actionlint version: current=$CURRENT latest=$LATEST" >&2
            exit 1
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already on $LATEST, nothing to do."
          else
            echo "Bumping $CURRENT -> $LATEST"
          fi

      - name: Skip if a branch for this version already exists
        if: steps.ver.outputs.skip != 'true'
        id: branch
        env:
          LATEST: ${{ steps.ver.outputs.latest }}
        run: |
          set -euo pipefail
          BRANCH="bump/actionlint-$LATEST"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve the release checksum
        # actionlint publishes a signed checksums.txt per release, so the new
        # SHA256 is derivable here — the bump PR needs no manual checksum step
        # (unlike the Dockerfile binaries, whose upstreams publish none).
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        id: sum
        env:
          LAT: ${{ steps.ver.outputs.latest }}
        run: |
          set -euo pipefail
          ASSET="actionlint_${LAT}_linux_amd64.tar.gz"
          curl -fsSL -o /tmp/checksums.txt \
            "https://github.com/rhysd/actionlint/releases/download/v${LAT}/actionlint_${LAT}_checksums.txt"
          SHA=$(awk -v a="$ASSET" '$2 == a { print $1 }' /tmp/checksums.txt)
          if [[ ! "$SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "No sha256 for $ASSET in checksums.txt" >&2
            exit 1
          fi
          # Verify the published checksum against the artifact actually served,
          # so a bad checksums.txt can never be committed as a trusted pin.
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${LAT}/${ASSET}"
          echo "${SHA}  /tmp/actionlint.tar.gz" | sha256sum -c -
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Apply bump
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUR: ${{ steps.ver.outputs.current }}
          LAT: ${{ steps.ver.outputs.latest }}
          SHA: ${{ steps.sum.outputs.sha256 }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -B "$BRANCH"

          node <<'NODE'
          const fs = require('node:fs');
          const f = '.github/workflows/zizmor.yml';
          const before = fs.readFileSync(f, 'utf-8');
          const after = before
            .replace(/VERSION: '[^']+'/, `VERSION: '${process.env.LAT}'`)
            .replace(/SHA256: '[^']+'/, `SHA256: '${process.env.SHA}'`);
          if (before === after) {
            console.error('Replacement matched nothing in ' + f);
            process.exit(1);
          }
          fs.writeFileSync(f, after);
          NODE

          git add .github/workflows/zizmor.yml
          if git diff --cached --quiet; then
            echo "Nothing changed - aborting."
            exit 1
          fi
          git commit -m "chore(deps): bump actionlint $CUR -> $LAT"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"

      - name: Open PR
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUR: ${{ steps.ver.outputs.current }}
          LAT: ${{ steps.ver.outputs.latest }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          BODY=$(cat <<EOF
          Auto-generated bump of \`actionlint\` from \`$CUR\` to \`$LAT\`.

          The version and its SHA256 are literals in \`.github/workflows/zizmor.yml\` (a checksum-pinned release binary, not a package.json entry), so Dependabot can't see them - \`bump-shadow-pins.yml\` opens this PR weekly.

          The new checksum is taken from the release's \`checksums.txt\` and re-verified against the downloaded artifact in this job, so no manual checksum step is required.

          Files updated:
          - \`.github/workflows/zizmor.yml\` (\`VERSION\` + \`SHA256\` in the \`actionlint\` job)

          ## Test plan
          - [ ] CI green (the \`actionlint\` job verifies the checksum before running, and lints every workflow with the new binary)
          EOF
          )
          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "chore(deps): bump actionlint $CUR -> $LAT" \
            --body "$BODY"
