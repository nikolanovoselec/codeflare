          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -B "$BRANCH"

          node scripts/update-npm-tool-manifests.mjs \
            preseed/npm-tools/package.json chrome-devtools-mcp "$CUR" "$LAT"
          node scripts/regenerate-npm-package-lock.mjs preseed/npm-tools

          git add preseed/npm-tools/package.json preseed/npm-tools/package-lock.json
          if git diff --cached --quiet; then
            echo "Nothing changed (replacement found nothing) - aborting."
            exit 1
          fi
          git commit -m "chore(deps): bump chrome-devtools-mcp $CUR -> $LAT"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUR: ${{ steps.ver.outputs.current }}
          LAT: ${{ steps.ver.outputs.latest }}

      - name: Open PR
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUR: ${{ steps.ver.outputs.current }}
          LAT: ${{ steps.ver.outputs.latest }}
        run: |
          set -euo pipefail
          BODY=$(cat <<EOF
          Auto-generated bump of \`chrome-devtools-mcp\` from \`$CUR\` to \`$LAT\`.

          The interactive Browser Run server and its integrity tree are committed in the shared image-tools lock; the image still exposes the stable bin path used by both agents.

          Files updated:
          - \`preseed/npm-tools/package.json\` + \`package-lock.json\`

          ## Test plan
          - [ ] CI green
          - [ ] Smoke test on integration: \`chrome-devtools\` responds through Claude Code and Pi's MCP adapter
          EOF
          )
          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "chore(deps): bump chrome-devtools-mcp $CUR -> $LAT" \
            --body "$BODY"

  browser-run-mcp:
    # The Claude-side browser-run MCP server pins @modelcontextprotocol/sdk exact
    # in its dedicated manifest and committed lock. The pi-extensions job reads
    # only Pi's package.json, so this job updates the Browser Run pair weekly.
    runs-on: ubuntu-latest
    # Without this every job inherits the 360-minute ceiling. These jobs curl
    # third-party hosts with no --max-time and several run `npm ci`; a hung TLS
    # connection burns six runner-hours before GitHub kills it. install-deps
    # already wraps npm ci in `timeout 600` for exactly this reason.
    timeout-minutes: 20
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open the bump PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Resolve the newest release past the cooldown
        id: cooldown
        uses: ./.github/actions/npm-cooldown-version
        with:
          package: '@modelcontextprotocol/sdk'

      - name: Diff @modelcontextprotocol/sdk pin against npm latest
        id: ver
        env:
          COOLDOWN_VERSION: ${{ steps.cooldown.outputs.version }}
        run: |
          set -euo pipefail
          PKG=preseed/agents/claude/browser-run-mcp/package.json
          CURRENT=$(jq -r '.dependencies["@modelcontextprotocol/sdk"]' "$PKG")
          LATEST="$COOLDOWN_VERSION"
          if [ -z "$LATEST" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Nothing past the cooldown."; exit 0; fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          DECISION=$(node scripts/ci/semver-forward.mjs "$CURRENT" "$LATEST")
          if [ "$DECISION" = upgrade ]; then
            echo "Bumping $CURRENT -> $LATEST"
          elif [ "$DECISION" = skip ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Candidate $LATEST is not newer than pinned $CURRENT — nothing to do."
          else
            echo "::error::unexpected forward-only decision: $DECISION"
            exit 2
          fi

      - name: Skip if a branch for this version already exists
        if: steps.ver.outputs.skip != 'true'
        env:
          LAT: ${{ steps.ver.outputs.latest }}
        id: branch
        run: |
          BRANCH="bump/browser-run-mcp-sdk-$LAT"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists, skipping (existing PR likely open)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply bump
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -B "$BRANCH"

          node scripts/update-npm-tool-manifests.mjs \
            preseed/agents/claude/browser-run-mcp/package.json \
            @modelcontextprotocol/sdk "$CUR" "$LAT"
          node scripts/regenerate-npm-package-lock.mjs preseed/agents/claude/browser-run-mcp

          git add preseed/agents/claude/browser-run-mcp/package.json preseed/agents/claude/browser-run-mcp/package-lock.json
          if git diff --cached --quiet; then
            echo "Nothing changed (replacement found nothing) - aborting."
            exit 1
          fi
          git commit -m "chore(deps): bump @modelcontextprotocol/sdk (browser-run-mcp) $CUR -> $LAT"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUR: ${{ steps.ver.outputs.current }}
          LAT: ${{ steps.ver.outputs.latest }}

      - name: Open PR
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUR: ${{ steps.ver.outputs.current }}
          LAT: ${{ steps.ver.outputs.latest }}
        run: |
          set -euo pipefail
          BODY=$(cat <<EOF
          Auto-generated bump of \`@modelcontextprotocol/sdk\` (the Claude-side \`browser-run\` MCP server) from \`$CUR\` to \`$LAT\`.

          The exact version and registry integrity tree are committed in \`preseed/agents/claude/browser-run-mcp/package.json\` and \`package-lock.json\`; this job updates both atomically.

          Files updated:
          - \`preseed/agents/claude/browser-run-mcp/package.json\` + \`package-lock.json\` (\`@modelcontextprotocol/sdk\` \`$CUR\` -> \`$LAT\`)

          ## Test plan
          - [ ] CI green (Docker build installs the new SDK; the browser-run-mcp import smoke test passes)
          - [ ] Smoke test on integration: \`browser_markdown\` responds on Claude Code
          EOF
          )
          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "chore(deps): bump @modelcontextprotocol/sdk (browser-run-mcp) $CUR -> $LAT" \
            --body "$BODY"

  claude-vscode-extension:
    # The official extension is a privileged proprietary package bundled into
    # the server image from Open VSX. Its metadata file is the one source of
    # truth for Docker, staging validation, and deployment image smoke.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve newest Open VSX release past cooldown
        id: version
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const request = (url) => fetch(url, { signal: AbortSignal.timeout(30_000) });
          (async () => {
          const pin = JSON.parse(fs.readFileSync('openvscode/agent-sidebar/official-claude.json', 'utf8'));
          const base = `https://open-vsx.org/api/${pin.namespace}/${pin.name}`;
          const latestResponse = await request(`${base}/latest`);
          if (!latestResponse.ok) throw new Error(`latest metadata fetch failed: ${latestResponse.status}`);
          const latest = await latestResponse.json();
          const versions = Object.keys(latest.allVersions ?? {})
            .filter((value) => /^\d+\.\d+\.\d+$/.test(value))
            .sort((left, right) => right.localeCompare(left, undefined, { numeric: true }));
          const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
          let candidate;
          for (const version of versions) {
            const response = await request(`${base}/${pin.targetPlatform}/${version}`);
            if (!response.ok) continue;
            const metadata = await response.json();
            if (metadata.namespace !== pin.namespace || metadata.name !== pin.name ||
                metadata.version !== version || metadata.targetPlatform !== pin.targetPlatform ||
                metadata.verified !== true) {
              throw new Error(`invalid Open VSX identity for ${version}`);
            }
            const publishedAt = Date.parse(metadata.timestamp);
            if (!Number.isFinite(publishedAt)) throw new Error(`invalid publication timestamp for ${version}`);
            if (publishedAt > cutoff) continue;
            const checksumUrl = new URL(metadata.files?.sha256);
            if (checksumUrl.origin !== 'https://open-vsx.org' ||
                !checksumUrl.pathname.startsWith(`/api/${pin.namespace}/${pin.name}/`)) {
              throw new Error(`untrusted checksum URL for ${version}`);
            }
            const checksumResponse = await request(checksumUrl);
            if (!checksumResponse.ok) throw new Error(`checksum fetch failed for ${version}`);
            const sha256 = (await checksumResponse.text()).trim();
            if (!/^[0-9a-f]{64}$/.test(sha256)) throw new Error(`invalid checksum for ${version}`);
            candidate = { version, sha256, timestamp: new Date(publishedAt).toISOString() };
            break;
          }
          if (!candidate) throw new Error('No cooldown-eligible Claude VS Code extension found');
          const output = process.env.GITHUB_OUTPUT;
          const forward = candidate.version.localeCompare(pin.version, undefined, { numeric: true });
          fs.appendFileSync(output, `current=${pin.version}\nlatest=${candidate.version}\nsha256=${candidate.sha256}\npublished=${candidate.timestamp}\n`);
          if (forward <= 0) fs.appendFileSync(output, 'skip=true\n');
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Skip existing branch
        if: steps.version.outputs.skip != 'true'
        id: branch
        env:
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          set -euo pipefail
          BRANCH="bump/claude-vscode-$LATEST"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply bump
        if: steps.version.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          LAT: ${{ steps.version.outputs.latest }}
          SHA: ${{ steps.version.outputs.sha256 }}
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -B "$BRANCH"
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'openvscode/agent-sidebar/official-claude.json';
          const pin = JSON.parse(fs.readFileSync(path, 'utf8'));
          pin.version = process.env.LAT;
          pin.sha256 = process.env.SHA;
          fs.writeFileSync(path, `${JSON.stringify(pin, null, 2)}\n`);
          NODE
          git add openvscode/agent-sidebar/official-claude.json
          git commit -m "chore: bump Claude VS Code extension $LAT"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"

      - name: Open PR
        if: steps.version.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          CUR: ${{ steps.version.outputs.current }}
          LAT: ${{ steps.version.outputs.latest }}
          SHA: ${{ steps.version.outputs.sha256 }}
          PUBLISHED: ${{ steps.version.outputs.published }}
        run: |
          set -euo pipefail
          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "chore: bump Claude VS Code extension $CUR -> $LAT" \
            --body "$(cat <<EOF
          Bumps Anthropic's official linux-x64 Open VSX extension from \`$CUR\` to \`$LAT\` after the seven-day cooldown.

          - Published: \`$PUBLISHED\`
          - SHA-256: \`$SHA\`
          - Single pin: \`openvscode/agent-sidebar/official-claude.json\`

          Deployment downloads the exact package, verifies this digest and identity, and runs packaged host smoke before push.
          EOF
          )"

  agent-clis:
    # The five coding-agent CLIs baked into the image. They used to install at
    # @latest, which meant the most privileged packages in the container — they
    # execute user code and hold OAuth tokens — were the only ones exempt from
    # the cooldown dependabot.yml spends 40 lines justifying. The shared
    # npm-tools manifest and lock now own them, so they still update weekly but
    # through a PR that CI has run against.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open the bump PR
    strategy:
      fail-fast: false
      # One PR per package: a single combined PR means one bad package blocks
      # four good updates, and makes the revert a manual edit.
      matrix:
        include:
          - pkg: '@anthropic-ai/claude-code'
          - pkg: '@openai/codex'
          - pkg: 'opencode-ai'
          - pkg: '@github/copilot'
          - pkg: '@earendil-works/pi-coding-agent'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the newest release past the cooldown
        id: cooldown
        uses: ./.github/actions/npm-cooldown-version
        with:
          package: ${{ matrix.pkg }}

      - name: Diff the shared lock pin against npm
        id: ver
        env:
          COOLDOWN_VERSION: ${{ steps.cooldown.outputs.version }}
          PKG: ${{ matrix.pkg }}
        run: |
          set -euo pipefail
          CURRENT=$(PKG="$PKG" node -p "require('./preseed/npm-tools/package.json').dependencies[process.env.PKG]")
          LATEST="$COOLDOWN_VERSION"
          if [ -z "$LATEST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Nothing past the cooldown."
            exit 0
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          DECISION=$(node scripts/ci/semver-forward.mjs "$CURRENT" "$LATEST")
          if [ "$DECISION" = upgrade ]; then
            echo "Bumping $PKG $CURRENT -> $LATEST"
          elif [ "$DECISION" = skip ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Candidate $LATEST is not newer than pinned $CURRENT — nothing to do."
          else
            echo "::error::unexpected forward-only decision: $DECISION"
            exit 2
          fi

      - name: Skip if a branch for this version already exists
        if: steps.ver.outputs.skip != 'true'
        id: branch
        env:
          PKG: ${{ matrix.pkg }}
          LATEST: ${{ steps.ver.outputs.latest }}
        run: |
          set -euo pipefail
          SLUG=$(printf '%s' "$PKG" | tr -c 'A-Za-z0-9' '-' | sed 's/-\+/-/g; s/^-//; s/-$//')
          BRANCH="bump/${SLUG}-${LATEST}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply bump
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: ${{ matrix.pkg }}
          CUR: ${{ steps.ver.outputs.current }}
          LAT: ${{ steps.ver.outputs.latest }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -B "$BRANCH"

          if [ "$PKG" = '@earendil-works/pi-coding-agent' ]; then
            node scripts/update-pi-runtime-artifacts.mjs "$CUR" "$LAT"
          else
            node scripts/update-npm-tool-manifests.mjs \
              preseed/npm-tools/package.json "$PKG" "$CUR" "$LAT"
            node scripts/regenerate-npm-package-lock.mjs preseed/npm-tools
          fi

          git add preseed/npm-tools/package.json preseed/npm-tools/package-lock.json
          if [ "$PKG" = '@earendil-works/pi-coding-agent' ]; then
            git add preseed/agents/pi/package.json preseed/agents/pi/package-lock.json src/lib/agent-seed.generated.ts
          fi
          if git diff --cached --quiet; then
            echo "Nothing changed - aborting."
            exit 1
          fi
          git commit -m "chore(deps): bump $PKG $CUR -> $LAT"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"

      - name: Open PR
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: ${{ matrix.pkg }}
          CUR: ${{ steps.ver.outputs.current }}
          LAT: ${{ steps.ver.outputs.latest }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          BODY=$(cat <<EOF
          Auto-generated bump of \`$PKG\` from \`$CUR\` to \`$LAT\`.

          This coding-agent CLI is baked from the committed \`preseed/npm-tools/package-lock.json\`, so both its exact version and registry integrity tree are reviewable.

          The candidate version is the newest release published **more than 7 days ago**, matching the cooldown in \`.github/dependabot.yml\` — a version published hours ago is not eligible, because the npm compromise pattern is publish-malicious-then-wait-for-automation.

          Files updated:
          - \`preseed/npm-tools/package.json\` + \`package-lock.json\`
          - Pi bumps also update the prewarm manifest, lock, and embedded seed

          ## Test plan
          - [ ] CI green
          - [ ] Container image builds and the agent starts (exercised on the next deploy)
          EOF
          )
          # The entrypoint injects settings Claude Code owns. A rename or a
          # behaviour change upstream cannot fail a test — the setting just
          # stops applying — so the reminder rides the bump that invalidates it.
          if [ "$PKG" = '@anthropic-ai/claude-code' ]; then
            BODY=$(cat <<EOF
          $BODY
          - [ ] \`disableAgentView\` still suppresses the full-screen agent view, and background subagents still spawn under it (REQ-AGENT-099 AC5). A test asserts both mode literals still carry the key, but nothing can assert the upstream half — that Claude Code still honours it and still spawns background subagents under it; if that second half breaks, the memory-capture and vault-extract hooks stop firing silently.
          EOF
          )
          fi
          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "chore(deps): bump $PKG $CUR -> $LAT" \
            --body "$BODY"

  antigravity-cli:
    # The Antigravity installer is a curl|bash from a Google-hosted URL. The
    # payload it downloads is sha512-verified against a manifest, but the
    # manifest comes from the same host, so the script itself is the only thing
    # worth pinning — and it was not pinned at all.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open the bump PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Compare the pinned installer hash against what the URL serves
        id: ver
        run: |
          set -euo pipefail
          # \K, not \\K. Inside SINGLE quotes the shell passes the backslash
          # through verbatim, so \\K reaches PCRE as literal backslash + K and
          # matches nothing; the assignment then fails under set -e and this job
          # died at step 1 on every run. The sibling agent-clis job uses double
          # quotes, where \\K is correct — same operator, two quoting contexts,
          # and only one of them was right.
          CURRENT=$(grep -oP '^ARG ANTIGRAVITY_INSTALLER_SHA256=\K[0-9a-f]{64}' Dockerfile)
          curl -fsSL https://antigravity.google/cli/install.sh -o /tmp/agy-install.sh
          LATEST=$(sha256sum /tmp/agy-install.sh | cut -d' ' -f1)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Installer unchanged."
          else
            echo "Installer changed: $CURRENT -> $LATEST"
          fi

      - name: Skip if a branch for this hash already exists
        if: steps.ver.outputs.skip != 'true'
        id: branch
        env:
          LATEST: ${{ steps.ver.outputs.latest }}
        run: |
          set -euo pipefail
          BRANCH="bump/antigravity-installer-${LATEST:0:12}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply bump and open PR
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUR: ${{ steps.ver.outputs.current }}
          LAT: ${{ steps.ver.outputs.latest }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -B "$BRANCH"
          sed -i "s/^ARG ANTIGRAVITY_INSTALLER_SHA256=.*/ARG ANTIGRAVITY_INSTALLER_SHA256=${LAT}/" Dockerfile
          git add Dockerfile
          if git diff --cached --quiet; then
            echo "Replacement matched nothing in Dockerfile"
            exit 1
          fi
          git commit -m "chore(deps): antigravity installer hash ${CUR:0:12} -> ${LAT:0:12}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"

          BODY=$(cat <<EOF
          The Antigravity CLI installer served at \`https://antigravity.google/cli/install.sh\` changed.

          - was: \`$CUR\`
          - now: \`$LAT\`

          **Review the diff of the installer script before merging.** This hash is the only thing standing between that URL and \`bash\` running as root in the image; a changed hash is expected when the vendor updates, and is also exactly what a substitution attack looks like.

          Files updated:
          - \`Dockerfile\` (\`ARG ANTIGRAVITY_INSTALLER_SHA256\`)

          ## Test plan
          - [ ] Installer diff reviewed
          - [ ] CI green
          EOF
          )
          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "chore(deps): antigravity installer hash changed" \
            --body "$BODY"

  zizmor:
    runs-on: ubuntu-latest
    # Without this every job inherits the 360-minute ceiling. These jobs curl
    # third-party hosts with no --max-time and several run `npm ci`; a hung TLS
    # connection burns six runner-hours before GitHub kills it. install-deps
    # already wraps npm ci in `timeout 600` for exactly this reason.
    timeout-minutes: 20
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open the bump PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Compare the zizmor pin against what the pinned action supports
        id: ver
        # NOT zizmor's newest release. zizmor-action resolves `version:` against
        # a digest table baked into the action release, so naming a version the
        # PINNED action does not know fails every run with "Unknown version"
        # (v0.5.6 + 1.27.0 did exactly that). The ceiling is that table, and
        # Dependabot raises it by bumping the action pin.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT=$(node scripts/ci/workflow-tool-pins.mjs get zizmor version)
          ACTION_SHA=$(grep -oP "zizmorcore/zizmor-action@\K[0-9a-f]{40}" .github/workflows/zizmor.yml)
          LATEST=$(gh api "repos/zizmorcore/zizmor-action/contents/support/versions?ref=${ACTION_SHA}" \
            --jq .content | base64 -d \
            | awk '$1 ~ /^[0-9]+\.[0-9]+\.[0-9]+$/ { print $1 }' | sort -V | tail -1)
          VERSION_RE='^[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "$CURRENT" =~ $VERSION_RE ]] || [[ ! "$LATEST" =~ $VERSION_RE ]]; then
            echo "Invalid zizmor version: current=$CURRENT latest=$LATEST" >&2
            exit 1
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already on $LATEST (the highest version action $ACTION_SHA knows), nothing to do."
          else
            echo "Bumping $CURRENT -> $LATEST"
          fi

      - name: Skip if a branch for this version already exists
        if: steps.ver.outputs.skip != 'true'
        id: branch
        env:
          LATEST: ${{ steps.ver.outputs.latest }}
        run: |
          set -euo pipefail
          BRANCH="bump/zizmor-$LATEST"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve the release checksum
        # zizmor publishes no checksums.txt, so the hash is taken from the
        # artifact itself. That is a trust-on-first-use pin, not a verification
        # — but from this commit on, any change to the served bytes fails the
        # workflow-audit lane's sha256sum check.
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        id: sum
        env:
          LAT: ${{ steps.ver.outputs.latest }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/zizmor.tar.gz \
            "https://github.com/zizmorcore/zizmor/releases/download/v${LAT}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          SHA=$(sha256sum /tmp/zizmor.tar.gz | cut -d' ' -f1)
          if [[ ! "$SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Could not hash the zizmor release artifact" >&2
            exit 1
          fi
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Apply bump
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUR: ${{ steps.ver.outputs.current }}
          LAT: ${{ steps.ver.outputs.latest }}
          SHA: ${{ steps.sum.outputs.sha256 }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -B "$BRANCH"

          node scripts/ci/workflow-tool-pins.mjs update-and-stage zizmor "$CUR" "$LAT" "$SHA"
          if git diff --cached --quiet; then
            echo "Nothing changed - aborting."
            exit 1
          fi
          git commit -m "chore(deps): bump zizmor $CUR -> $LAT"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"

      - name: Open PR
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUR: ${{ steps.ver.outputs.current }}
          LAT: ${{ steps.ver.outputs.latest }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          BODY=$(cat <<EOF
          Auto-generated bump of \`zizmor\` from \`$CUR\` to \`$LAT\`.

          Both the blocking \`workflow-audit\` lane and the SARIF upload read this version from \`.github/workflow-tool-pins.json\`, so they cannot drift. Keeping the routinely updated pin outside \`.github/workflows/\` also lets the least-privilege \`GITHUB_TOKEN\` push the bump branch without workflow-write permission.

          The ceiling is the digest table baked into the pinned \`zizmor-action\` release, not zizmor's newest tag: naming a version the pinned action does not know fails every run with \`Unknown version\`. Dependabot raises that ceiling when it bumps the action.

          Files updated:
          - \`.github/workflow-tool-pins.json\` (\`zizmor.version\` + \`zizmor.sha256\`)

          ## Test plan
          - [ ] CI green (the \`workflow-audit\` lane verifies the checksum before running, and audits every workflow with the new binary)
          - [ ] \`Zizmor\` workflow green (the action resolves the new version instead of erroring)
          EOF
          )
          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "chore(deps): bump zizmor $CUR -> $LAT" \
            --body "$BODY"

  actionlint:
    runs-on: ubuntu-latest
    # Without this every job inherits the 360-minute ceiling. These jobs curl
    # third-party hosts with no --max-time and several run `npm ci`; a hung TLS
    # connection burns six runner-hours before GitHub kills it. install-deps
    # already wraps npm ci in `timeout 600` for exactly this reason.
    timeout-minutes: 20
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open the bump PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Compare the actionlint pin against latest GitHub release
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT=$(node scripts/ci/workflow-tool-pins.mjs get actionlint version)
          TAG=$(gh api repos/rhysd/actionlint/releases/latest --jq .tag_name)
          LATEST="${TAG#v}"
          VERSION_RE='^[0-9]+\.[0-9]+\.[0-9]+$'
          if [[ ! "$CURRENT" =~ $VERSION_RE ]] || [[ ! "$LATEST" =~ $VERSION_RE ]]; then
            echo "Invalid actionlint version: current=$CURRENT latest=$LATEST" >&2
            exit 1
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already on $LATEST, nothing to do."
          else
            echo "Bumping $CURRENT -> $LATEST"
          fi

      - name: Skip if a branch for this version already exists
        if: steps.ver.outputs.skip != 'true'
        id: branch
        env:
          LATEST: ${{ steps.ver.outputs.latest }}
        run: |
          set -euo pipefail
          BRANCH="bump/actionlint-$LATEST"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve the release checksum
        # actionlint publishes a signed checksums.txt per release, so the new
        # SHA256 is derivable here — the bump PR needs no manual checksum step
        # (unlike the Dockerfile binaries, whose upstreams publish none).
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        id: sum
        env:
          LAT: ${{ steps.ver.outputs.latest }}
        run: |
          set -euo pipefail
          ASSET="actionlint_${LAT}_linux_amd64.tar.gz"
          curl -fsSL -o /tmp/checksums.txt \
            "https://github.com/rhysd/actionlint/releases/download/v${LAT}/actionlint_${LAT}_checksums.txt"
          SHA=$(awk -v a="$ASSET" '$2 == a { print $1 }' /tmp/checksums.txt)
          if [[ ! "$SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "No sha256 for $ASSET in checksums.txt" >&2
            exit 1
          fi
          # Verify the published checksum against the artifact actually served,
          # so a bad checksums.txt can never be committed as a trusted pin.
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${LAT}/${ASSET}"
          echo "${SHA}  /tmp/actionlint.tar.gz" | sha256sum -c -
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Apply bump
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUR: ${{ steps.ver.outputs.current }}
          LAT: ${{ steps.ver.outputs.latest }}
          SHA: ${{ steps.sum.outputs.sha256 }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -B "$BRANCH"

          node scripts/ci/workflow-tool-pins.mjs update-and-stage actionlint "$CUR" "$LAT" "$SHA"
          if git diff --cached --quiet; then
            echo "Nothing changed - aborting."
            exit 1
          fi
          git commit -m "chore(deps): bump actionlint $CUR -> $LAT"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"

      - name: Open PR
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUR: ${{ steps.ver.outputs.current }}
          LAT: ${{ steps.ver.outputs.latest }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          BODY=$(cat <<EOF
          Auto-generated bump of \`actionlint\` from \`$CUR\` to \`$LAT\`.

          The blocking \`workflow-audit\` lane reads the version and SHA256 from \`.github/workflow-tool-pins.json\`. Keeping the routinely updated pin outside \`.github/workflows/\` lets the least-privilege \`GITHUB_TOKEN\` push the bump branch without workflow-write permission.

          The new checksum is taken from the release's \`checksums.txt\` and re-verified against the downloaded artifact in this job, so no manual checksum step is required.

          Files updated:
          - \`.github/workflow-tool-pins.json\` (\`actionlint.version\` + \`actionlint.sha256\`)

          ## Test plan
          - [ ] CI green (the \`actionlint\` job verifies the checksum before running, and lints every workflow with the new binary)
          EOF
          )
          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "chore(deps): bump actionlint $CUR -> $LAT" \
            --body "$BODY"
