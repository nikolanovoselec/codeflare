          node scripts/regenerate-npm-package-lock.mjs preseed/npm-tools
          git add preseed/npm-tools/package.json preseed/npm-tools/package-lock.json
          if git diff --cached --quiet; then
            echo "Nothing changed - aborting."
            exit 1
          fi
          git commit -m "chore(deps): bump bun $CUR -> $LAT"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"

      - name: Open PR
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUR: ${{ steps.ver.outputs.current }}
          LAT: ${{ steps.ver.outputs.latest }}
        run: |
          set -euo pipefail
          BODY=$(cat <<EOF
          Auto-generated bump of \`bun\` from \`$CUR\` to \`$LAT\`.

          Bun is installed for context-mode subprocess startup speed from the committed image-tools lock.

          Files updated:
          - \`preseed/npm-tools/package.json\` + \`package-lock.json\`

          ## Test plan
          - [ ] CI green
          - [ ] Smoke test on integration: \`ctx_execute\` still detects Bun and starts quickly
          EOF
          )
          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "chore(deps): bump bun $CUR -> $LAT" \
            --body "$BODY"

  # Every Pi extension in preseed/agents/pi/package.json (the @juicesharp rpiv
  # family, pi-caveman, pi-web-access, pi-mcp-adapter, @gotgenes/pi-subagents) is pinned in more
  # than the manifest: each version is mirrored as a literal `npm:<name>@<ver>`
  # install spec in entrypoint.sh's Pi settings `required` array and baked into
  # src/lib/agent-seed.generated.ts, so Dependabot (manifest-only) would drift them.
  # `pi-extensions-discover` lists every dep EXCEPT context-mode (pinned in TWO
  # installs and owned atomically by the dedicated `context-mode:` job); the
  # `pi-extensions` matrix then fans out one leg per extension, so each appears
  # separately in the run and bumps in its own PR, and one extension's failure (e.g.
  # a registry fetch error) never blocks the others.
  # (Graphify is no longer an npm pin, it ships as the first-party
  # graphify-native.ts extension.)
  pi-extensions-discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          # This job only reads a manifest, so it never needed credentials at
          # all — which is exactly why it was the one the sweep missed: it had
          # no `token:` line to replace.
          persist-credentials: false
      - name: List Pi extension pins (every dep except context-mode)
        id: list
        run: |
          set -euo pipefail
          PACKAGES=$(node -e 'const p=require("./preseed/agents/pi/package.json");process.stdout.write(JSON.stringify(Object.keys(p.dependencies||{}).filter(n=>n!=="context-mode")))')
          printf 'packages=%s\n' "$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "Pi extensions: $PACKAGES"

  pi-extensions:
    needs: pi-extensions-discover
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.pi-extensions-discover.outputs.packages) }}
    runs-on: ubuntu-latest
    # Without this every job inherits the 360-minute ceiling. These jobs curl
    # third-party hosts with no --max-time and several run `npm ci`; a hung TLS
    # connection burns six runner-hours before GitHub kills it. install-deps
    # already wraps npm ci in `timeout 600` for exactly this reason.
    timeout-minutes: 20
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open the bump PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Resolve the newest release past the cooldown
        id: cooldown
        uses: ./.github/actions/npm-cooldown-version
        with:
          package: ${{ matrix.package }}

      - name: Diff ${{ matrix.package }} against npm latest
        id: ver
        env:
          COOLDOWN_VERSION: ${{ steps.cooldown.outputs.version }}
          PKG: ${{ matrix.package }}
        run: |
          set -euo pipefail
          CUR=$(node -e 'const p=require("./preseed/agents/pi/package.json");process.stdout.write(p.dependencies[process.env.PKG]||"")')
          LAT="$COOLDOWN_VERSION"
          if [ -z "$LAT" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Nothing past the cooldown."; exit 0; fi
          echo "current=$CUR" >> "$GITHUB_OUTPUT"
          echo "latest=$LAT" >> "$GITHUB_OUTPUT"
          DECISION=$(node scripts/ci/semver-forward.mjs "$CUR" "$LAT")
          if [ "$DECISION" = upgrade ]; then
            echo "$PKG: $CUR -> $LAT"
          elif [ "$DECISION" = skip ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Candidate $LAT is not newer than pinned $CUR — nothing to do."
          else
            echo "::error::unexpected forward-only decision: $DECISION"
            exit 2
          fi

      - name: Skip if a branch for this bump already exists
        if: steps.ver.outputs.skip != 'true'
        id: branch
        env:
          PKG: ${{ matrix.package }}
          LAT: ${{ steps.ver.outputs.latest }}
        run: |
          set -euo pipefail
          # Branch keyed on package + target version so a re-run dedupes to the open
          # PR, but a new version opens a fresh branch.
          SLUG=$(printf '%s' "$PKG" | sed 's|@||g; s|/|-|g')
          BRANCH="bump/pi-ext-$SLUG-$LAT"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists, skipping (existing PR likely open)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply bump
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: ${{ matrix.package }}
          CUR: ${{ steps.ver.outputs.current }}
          LAT: ${{ steps.ver.outputs.latest }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -B "$BRANCH"

          node <<'NODE'
          const fs = require('node:fs');
          const { PKG, CUR, LAT } = process.env;
          // Name-anchored replacements only (never a bare version replaceAll) so an
          // unrelated version string elsewhere can never be rewritten.
          function bump(s) {
            return s
              .replaceAll(`"${PKG}": "${CUR}"`, `"${PKG}": "${LAT}"`)
              .replaceAll(`npm:${PKG}@${CUR}`, `npm:${PKG}@${LAT}`);
          }
          for (const f of [
            'preseed/agents/pi/package.json',
            'entrypoint.sh',
            'host/__tests__/pi-settings-packages.test.js',
          ]) {
            const before = fs.readFileSync(f, 'utf-8');
            const after = bump(before);
            if (before !== after) { fs.writeFileSync(f, after); console.log(`updated ${f}`); }
          }
          NODE

          # Regenerate the Pi preseed lockfile. Goal's review-boundary bridge
          # patches private upstream source because ordinary slash commands are
          # not programmatically invokable; reject a bump before opening its PR
          # when that exact candidate no longer satisfies the reviewed anchors.
          node scripts/regenerate-npm-package-lock.mjs preseed/agents/pi
          if [ "$PKG" = '@narumitw/pi-goal' ]; then
            (cd preseed/agents/pi && npm ci --ignore-scripts --no-audit --no-fund)
            node scripts/patch-pi-goal-review-control.mjs \
              "$LAT" preseed/agents/pi/node_modules/@narumitw/pi-goal
          fi
          npm ci --no-audit --no-fund --silent
          npm run generate:agent-seed

          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed (replacement found nothing) - aborting."
            exit 1
          fi
          git commit -m "chore(deps): bump $PKG $CUR -> $LAT"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"

      - name: Open PR
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: ${{ matrix.package }}
          CUR: ${{ steps.ver.outputs.current }}
          LAT: ${{ steps.ver.outputs.latest }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          BODY=$(cat <<EOF
          Auto-generated bump of the Pi extension \`$PKG\` from \`$CUR\` to \`$LAT\`.

          Every Pi extension pin in \`preseed/agents/pi/package.json\` is mirrored in entrypoint.sh's Pi \`required\` install specs and the generated agent seed, so Dependabot can't keep them in sync - \`bump-shadow-pins.yml\` owns them, one PR per extension.

          Files updated by name-anchored string replace + lockfile + seed regenerate:
          - \`preseed/agents/pi/package.json\` + \`package-lock.json\`
          - \`entrypoint.sh\` (Pi settings \`required\` install spec)
          - \`host/__tests__/pi-settings-packages.test.js\` (pinned-version assertion)
          - \`src/lib/agent-seed.generated.ts\` (regenerated)

          ## Test plan
          - [ ] CI green
          - [ ] Review the \`$PKG\` CHANGELOG - MAJOR bumps (esp. \`@gotgenes/pi-subagents\`) can change APIs
          - [ ] For \`@narumitw/pi-goal\`, the locked candidate passed the fail-closed PR review-control source patch before this PR opened
          - [ ] Smoke test on integration: Pi loads all preseed extensions without error
          EOF
          )
          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "chore(deps): bump $PKG $CUR -> $LAT" \
            --body "$BODY"

