          content = content.replace(/YAZI_VERSION="[^"]+"/, `YAZI_VERSION="${lat}"`);
          content = content.replace(/YAZI_SHA256="[^"]+"/, `YAZI_SHA256="NEEDS_UPDATE_SEE_PR_BODY"`);
          fs.writeFileSync('Dockerfile', content);
          NODE

          git add Dockerfile
          if git diff --cached --quiet; then
