  bun:
    # Bun is installed globally as a pinned npm package because context-mode
    # autodetects it for faster ctx_execute/ctx_batch_execute subprocess starts.
    # The Dockerfile literal is invisible to Dependabot, so this job tracks it.
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open the bump PR
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Diff Dockerfile pin against npm latest
        id: ver
        run: |
          set -euo pipefail
          CURRENT=$(grep -oP 'npm install -g bun@\K[0-9][0-9.]*' Dockerfile | head -n1)
          LATEST=$(npm view bun version)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" = "$LATEST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already on $LATEST, nothing to do."
          else
            echo "Bumping $CURRENT -> $LATEST"
          fi

      - name: Skip if a branch for this version already exists
        if: steps.ver.outputs.skip != 'true'
        id: branch
        run: |
          BRANCH="bump/bun-${{ steps.ver.outputs.latest }}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists, skipping (existing PR likely open)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply bump
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -B "${{ steps.branch.outputs.branch }}"
          CUR='${{ steps.ver.outputs.current }}' LAT='${{ steps.ver.outputs.latest }}' node <<'NODE'
          const fs = require('node:fs');
          const cur = process.env.CUR;
          const lat = process.env.LAT;
          const file = 'Dockerfile';
          const before = fs.readFileSync(file, 'utf-8');
          const after = before.replaceAll(`bun@${cur}`, `bun@${lat}`);
          if (before === after) throw new Error('bun pin not found in Dockerfile');
          fs.writeFileSync(file, after);
          NODE
          git add Dockerfile
          if git diff --cached --quiet; then
            echo "Nothing changed - aborting."
            exit 1
          fi
          git commit -m "chore(deps): bump bun ${{ steps.ver.outputs.current }} -> ${{ steps.ver.outputs.latest }}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${{ steps.branch.outputs.branch }}"

      - name: Open PR
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUR: ${{ steps.ver.outputs.current }}
          LAT: ${{ steps.ver.outputs.latest }}
        run: |
          set -euo pipefail
          BODY=$(cat <<EOF
          Auto-generated bump of \`bun\` from \`$CUR\` to \`$LAT\`.

          Bun is pinned as a Dockerfile \`npm install -g bun@X\` literal for context-mode subprocess startup speed, so Dependabot cannot see it.

          Files updated:
          - \`Dockerfile\` (\`bun@$CUR\` -> \`bun@$LAT\`)

          ## Test plan
          - [ ] CI green
          - [ ] Smoke test on integration: \`ctx_execute\` still detects Bun and starts quickly
          EOF
          )
          gh pr create \
            --base develop \
            --head "${{ steps.branch.outputs.branch }}" \
            --title "chore(deps): bump bun $CUR -> $LAT" \
            --body "$BODY"

  # Every Pi extension in preseed/agents/pi/package.json (the @juicesharp rpiv
  # family, pi-web-access, pi-mcp-adapter, @gotgenes/pi-subagents) is pinned in more
  # than the manifest: each version is mirrored as a literal `npm:<name>@<ver>`
  # install spec in entrypoint.sh's Pi settings `required` array and baked into
  # src/lib/agent-seed.generated.ts, so Dependabot (manifest-only) would drift them.
  # `pi-extensions-discover` lists every dep EXCEPT context-mode (pinned in TWO
  # installs and owned atomically by the dedicated `context-mode:` job); the
  # `pi-extensions` matrix then fans out one leg per extension, so each appears
  # separately in the run and bumps in its own PR, and one extension's failure (e.g.
  # the rpiv-todo session-isolation version guard) never blocks the others.
  # (Graphify is no longer an npm pin, it ships as the first-party
  # graphify-native.ts extension.)
  pi-extensions-discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: develop
      - name: List Pi extension pins (every dep except context-mode)
        id: list
        run: |
          set -euo pipefail
          PACKAGES=$(node -e 'const p=require("./preseed/agents/pi/package.json");process.stdout.write(JSON.stringify(Object.keys(p.dependencies||{}).filter(n=>n!=="context-mode")))')
          printf 'packages=%s\n' "$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "Pi extensions: $PACKAGES"

  pi-extensions:
    needs: pi-extensions-discover
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.pi-extensions-discover.outputs.packages) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open the bump PR
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Diff ${{ matrix.package }} against npm latest
        id: ver
        env:
          PKG: ${{ matrix.package }}
        run: |
          set -euo pipefail
          CUR=$(node -e 'const p=require("./preseed/agents/pi/package.json");process.stdout.write(p.dependencies[process.env.PKG]||"")')
          LAT=$(npm view "$PKG" version | tr -d '\r\n ')
          echo "current=$CUR" >> "$GITHUB_OUTPUT"
          echo "latest=$LAT" >> "$GITHUB_OUTPUT"
          if [ "$CUR" = "$LAT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$PKG already at latest ($CUR), nothing to do."
          else
            echo "$PKG: $CUR -> $LAT"
          fi

      - name: Skip if a branch for this bump already exists
        if: steps.ver.outputs.skip != 'true'
        id: branch
        env:
          PKG: ${{ matrix.package }}
          LAT: ${{ steps.ver.outputs.latest }}
        run: |
          set -euo pipefail
          # Branch keyed on package + target version so a re-run dedupes to the open
          # PR, but a new version opens a fresh branch.
          SLUG=$(printf '%s' "$PKG" | sed 's|@||g; s|/|-|g')
          BRANCH="bump/pi-ext-$SLUG-$LAT"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists, skipping (existing PR likely open)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply bump
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: ${{ matrix.package }}
          CUR: ${{ steps.ver.outputs.current }}
          LAT: ${{ steps.ver.outputs.latest }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -B "$BRANCH"

          node <<'NODE'
          const fs = require('node:fs');
          const { PKG, CUR, LAT } = process.env;
          // Name-anchored replacements only (never a bare version replaceAll) so an
          // unrelated version string elsewhere can never be rewritten.
          function bump(s) {
            return s
              .replaceAll(`"${PKG}": "${CUR}"`, `"${PKG}": "${LAT}"`)
              .replaceAll(`npm:${PKG}@${CUR}`, `npm:${PKG}@${LAT}`);
          }
          for (const f of [
            'preseed/agents/pi/package.json',
            'entrypoint.sh',
            'host/__tests__/pi-settings-packages.test.js',
          ]) {
            const before = fs.readFileSync(f, 'utf-8');
            const after = bump(before);
            if (before !== after) { fs.writeFileSync(f, after); console.log(`updated ${f}`); }
          }
          NODE

          # Regenerate the pi preseed lockfile to match the bumped manifest without
          # executing its runtime-layout postinstall, then regenerate the agent seed.
          node scripts/regenerate-pi-preseed-lock.mjs
          npm ci --no-audit --no-fund --silent
          npm run generate:agent-seed

          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed (replacement found nothing) - aborting."
            exit 1
          fi
          git commit -m "chore(deps): bump $PKG $CUR -> $LAT"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"

      - name: Open PR
        if: steps.ver.outputs.skip != 'true' && steps.branch.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: ${{ matrix.package }}
          CUR: ${{ steps.ver.outputs.current }}
          LAT: ${{ steps.ver.outputs.latest }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          set -euo pipefail
          BODY=$(cat <<EOF
          Auto-generated bump of the Pi extension \`$PKG\` from \`$CUR\` to \`$LAT\`.

          Every Pi extension pin in \`preseed/agents/pi/package.json\` is mirrored in entrypoint.sh's Pi \`required\` install specs and the generated agent seed, so Dependabot can't keep them in sync - \`bump-shadow-pins.yml\` owns them, one PR per extension.

          Files updated by name-anchored string replace + lockfile + seed regenerate:
          - \`preseed/agents/pi/package.json\` + \`package-lock.json\`
          - \`entrypoint.sh\` (Pi settings \`required\` install spec)
          - \`host/__tests__/pi-settings-packages.test.js\` (pinned-version assertion)
          - \`src/lib/agent-seed.generated.ts\` (regenerated)

          ## Test plan
          - [ ] CI green
          - [ ] Review the \`$PKG\` CHANGELOG - MAJOR bumps (esp. \`@gotgenes/pi-subagents\`) can change APIs
          - [ ] \`@juicesharp/rpiv-todo\` only: a version change trips the session-isolation \`EXPECTED_VERSION\` guard at image build; re-sync or remove \`preseed/agents/pi/npm/rpiv-todo-session-isolation\` before merge
          - [ ] Smoke test on integration: Pi loads all preseed extensions without error
          EOF
          )
          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "chore(deps): bump $PKG $CUR -> $LAT" \
            --body "$BODY"

