name: Container Image
# Reusable build → scan → push pipeline for the session-container image,
# parameterized by target registry:
#   cloudflare — registry.cloudflare.com via `wrangler containers push` (default)
#   dockerhub  — docker.io via docker push; the documented bypass for when the
#                CF managed registry drops connections mid-upload ("use of
#                closed network connection"). Requires DOCKERHUB_USERNAME /
#                DOCKERHUB_TOKEN secrets and (after first push) flipping the
#                auto-created Docker Hub repo to Public so the Cloudflare
#                container runtime can pull without auth.
#
# Build avoidance: the image tag is `in-<hash>` where <hash> covers every
# build input (Dockerfile COPY sources + the Dockerfile itself) plus an ISO
# week salt. If that tag already exists in the target registry, build, scan,
# and push are skipped and the existing image is reused — most deploys touch
# only worker src/ and skip the multi-GB build+scan entirely. The weekly salt
# bounds two forms of staleness at ≤7 days: agent CLIs installed with @latest
# inside the Dockerfile, and the Trivy CVE verdict of the reused image
# (REQ-SEC-011: every pushed image was scanned green before its first push).
# A non-empty cache-bust input disables reuse AND busts the npm-install layer
# cache, exactly like the previous CLAUDE_CODE_CACHE_BUSTER behavior.
on:
  workflow_call:
    inputs:
      registry:
        description: 'Target registry: cloudflare | dockerhub'
        type: string
        default: 'cloudflare'
      environment:
        description: 'GitHub environment (scopes vars/secrets)'
        type: string
        required: true
      ref:
        description: 'Git ref/SHA to build'
        type: string
        required: true
      worker-name:
        description: 'Worker name; the image repo is <worker-name>-container'
        type: string
        required: true
      cache-bust:
        description: 'Non-empty = force a full rebuild (content is written to .cache-bust)'
        type: string
        default: ''
      runner:
        description: 'runs-on label'
        type: string
        default: 'ubuntu-latest'
    outputs:
      image_tag:
        # The full registry URI must NOT be an output: it embeds the account id
        # (or Docker Hub username), which is a masked secret, and the runner
        # silently drops any job output that may contain a secret ("Skip output
        # ... since it may contain secret"). Only the secret-free content-address
        # tag crosses the job boundary; callers rebuild the URI with their own
        # secrets in env.
        description: 'Content-address image tag (in-<hash>); callers rebuild the full registry URI locally'
        value: ${{ jobs.image.outputs.image_tag }}
      reused:
        description: '"true" when an identical-input image already existed and build+scan+push were skipped'
        value: ${{ jobs.image.outputs.reused }}

permissions:
  contents: read

jobs:
  image:
    name: Build, scan, push (${{ inputs.registry }})
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write # read and refresh the cross-ref GHCR BuildKit cache
      id-token: write # OIDC identity the provenance attestation is signed against
      attestations: write # store the attestation on this repository
    timeout-minutes: 60
    env:
      # Registry credentials are deliberately NOT job-level. At job scope they
      # sit in process.env for every third-party action in this job —
      # docker/login-action, setup-buildx, trivy-action, actions/cache,
      # attest-build-provenance — none of which need them, so one compromised
      # release of any of them reads a production Cloudflare deploy token. Only
      # the two steps that talk to a registry declare them.
      IMAGE_NAME: ${{ inputs.worker-name }}-container
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      # Secret-free by construction (see workflow_call outputs comment above).
      image_tag: ${{ steps.hash.outputs.tag }}
      reused: ${{ steps.reuse.outputs.reused || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Compute image input hash
        id: hash
        run: |
          # Every path the Dockerfile COPYs, plus the Dockerfile itself. The
          # weekly salt forces at most one rebuild+rescan per ISO week even
          # with unchanged inputs (fresh @latest agents, fresh CVE verdict).
          # .dockerignore decides what the COPYs actually include and
          # .trivyignore decides which CVEs the scan tolerates. Neither was
          # hashed, so deleting a suppression left the tag identical, the reuse
          # probe hit, and build+scan+push were skipped — the image shipped with
          # the CVE and the scan that would now fail never ran.
          HASHED_PATHS=".github/workflows/container-image.yml Dockerfile .dockerignore .trivyignore entrypoint.sh host/package.json host/package-lock.json host/tsconfig.json host/src openvscode preseed scripts/browser-ide-ui-state.py scripts/materialize-agent-seed.mjs scripts/patch-context-mode-bundles.mjs scripts/verify-pi-lockstep.mjs scripts/ci/smoke-openvscode-sidebar-image.mjs scripts/ci/validate-trivy-result.mjs src/lib/agent-seed.generated.ts"

          # Guard: every COPY source in the Dockerfile must be covered by
          # HASHED_PATHS — otherwise the reuse gate could serve a stale image
          # after someone adds a new COPY. Unknown source => build fresh.
          NO_REUSE=0
          while read -r src; do
            case "$src" in
              .cache-bust) ;; # represented by the cache-bust input
              Dockerfile|entrypoint.sh|host/package.json|host/package-lock.json|host/tsconfig.json|host/src/*|openvscode/*|preseed/*|scripts/browser-ide-ui-state.py|scripts/materialize-agent-seed.mjs|scripts/patch-context-mode-bundles.mjs|scripts/verify-pi-lockstep.mjs|scripts/ci/smoke-openvscode-sidebar-image.mjs|src/lib/agent-seed.generated.ts) ;;
              *)
                echo "::warning::COPY source '$src' not covered by the image input hash — disabling reuse for this run. Add it to HASHED_PATHS in container-image.yml."
                NO_REUSE=1
                ;;
            esac
          # Join line continuations, then match COPY *and* ADD case-insensitively
          # and drop flag words. The previous form matched only uppercase COPY,
          # never saw ADD, and read just the first line of a `COPY a \\`
          # continuation — every one of those is a content-injecting instruction
          # the reuse gate would not have seen, so an image could be reused
          # without the new content ever being built or scanned.
          # `--from=` instructions copy from an earlier build stage, not from the
          # repo, so they are skipped whole (emitting their paths would trip the
          # unknown-source branch and disable reuse on every build).
          done < <(awk '
            {
              line = line $0
              if (sub(/\\[ \t]*$/, " ", line)) next
              # sub() first: split() on an EXPLICIT separator does not strip
              # leading whitespace the way the default FS does, so an indented
              # COPY would land "" in f[1] and the instruction would go unseen —
              # silently reintroducing the blind spot this rewrite closed.
              sub(/^[ \t]+/, "", line)
              n = split(line, f, /[ \t]+/)
              inst = toupper(f[1])
              if (inst == "COPY" || inst == "ADD") {
                from_stage = 0
                for (i = 2; i <= n; i++) if (f[i] ~ /^--from/) from_stage = 1
                if (!from_stage) for (i = 2; i < n; i++) if (f[i] !~ /^--/) print f[i]
              }
              line = ""
            }
          ' Dockerfile)

          # --verify + explicit failure: without it, `git rev-parse HEAD:missing`
          # prints "HEAD:missing" to STDOUT and exits 128, and set -e does not
          # fire inside this loop. A renamed path or a typo in HASHED_PATHS would
          # then contribute a constant literal instead of that file's content
          # hash — silently, permanently, and with a normal-looking tag — so the
          # image would stop tracking one of its own build inputs.
          for p in $HASHED_PATHS; do
            git rev-parse --verify --quiet "HEAD:$p" >/dev/null || {
              echo "::error::HASHED_PATHS entry '$p' does not resolve at HEAD — the image input hash would silently stop tracking it. Fix the path in container-image.yml."
              exit 1
            }
          done
          HASH=$( { for p in $HASHED_PATHS; do git rev-parse "HEAD:$p"; done; echo "week=$(date -u +%G-W%V)"; } | sha256sum | cut -c1-16 )
          echo "tag=in-${HASH}" >> "$GITHUB_OUTPUT"
          echo "no_reuse=${NO_REUSE}" >> "$GITHUB_OUTPUT"
          echo "trivy_db_key=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "Image tag: in-${HASH} (no_reuse=${NO_REUSE})"

      - name: Log in to Docker Hub
        if: inputs.registry == 'dockerhub'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check registry for an existing identical-input image
        id: reuse
        if: inputs.cache-bust == '' && steps.hash.outputs.no_reuse == '0'
        env:
          TAG: ${{ steps.hash.outputs.tag }}
          REGISTRY: ${{ inputs.registry }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ "${REGISTRY}" = "dockerhub" ]; then
            URI="docker.io/${DOCKERHUB_USER}/${IMAGE_NAME}:${TAG}"
            if docker manifest inspect "$URI" >/dev/null 2>&1; then
              echo "reused=true" >> "$GITHUB_OUTPUT"
              echo "Identical-input image already in registry: ${URI} — skipping build/scan/push"
            else
              echo "No existing image for tag ${TAG} — building"
            fi
          else
            # Short-lived pull creds via the same CF API the prune script uses.
            # Any failure here degrades to a fresh build (safe direction).
            CRED=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/containers/registries/registry.cloudflare.com/credentials" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' \
              --data '{"expiration_minutes":10,"permissions":["pull"]}') || CRED='{}'
            if [ "$(printf '%s' "$CRED" | jq -r .success)" != "true" ]; then
              echo "::warning::could not mint registry credentials — building fresh"
              exit 0
            fi
            # Mask the minted credential before it can reach a log. It is a live
            # registry password with a 10-minute window; without this any later
            # `set -x`, jq error, or debug dump prints it verbatim.
            echo "::add-mask::$(printf '%s' "$CRED" | jq -r .result.password)"
            AUTH=$(printf '%s:%s' "$(printf '%s' "$CRED" | jq -r .result.username)" "$(printf '%s' "$CRED" | jq -r .result.password)" | base64 -w0)
            echo "::add-mask::${AUTH}"
            ACCEPT='application/vnd.oci.image.manifest.v1+json,application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.docker.distribution.manifest.list.v2+json'
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Basic ${AUTH}" -H "Accept: ${ACCEPT}" \
              "https://registry.cloudflare.com/v2/${CLOUDFLARE_ACCOUNT_ID}/${IMAGE_NAME}/manifests/${TAG}" || echo 000)
            if [ "$CODE" = "200" ]; then
              URI="registry.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/${IMAGE_NAME}:${TAG}"
              echo "reused=true" >> "$GITHUB_OUTPUT"
              echo "Identical-input image already in registry: ${URI} — skipping build/scan/push"
            else
              echo "No existing image for tag ${TAG} (HTTP ${CODE}) — building"
            fi
          fi

      - name: Write cache buster (force fresh npm install layers)
        if: steps.reuse.outputs.reused != 'true' && inputs.cache-bust != ''
        env:
          CACHE_BUST: ${{ inputs.cache-bust }}
        run: printf '%s\n' "$CACHE_BUST" > .cache-bust

      - name: Log in to GHCR for shared BuildKit cache
        id: cache-login
        if: steps.reuse.outputs.reused != 'true'
        continue-on-error: true
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve shared cache availability
        id: cache
        if: steps.reuse.outputs.reused != 'true'
        env:
          LOGIN_OUTCOME: ${{ steps.cache-login.outcome }}
        run: >-
          node scripts/ci/container-build-cache-policy.mjs availability
          "$LOGIN_OUTCOME" >> "$GITHUB_OUTPUT"

      # The docker-container driver supports the registry-backed cache shared
      # across deployment refs. GitHub's `type=gha` cache is ref-scoped, while
      # this registry cache remains available to later deployment runs.
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        if: steps.reuse.outputs.reused != 'true'

      - name: Build container image
        id: docker-build
        if: steps.reuse.outputs.reused != 'true'
        env:
          TAG: ${{ steps.hash.outputs.tag }}
          REGISTRY: ${{ inputs.registry }}
          REF: ${{ inputs.ref }}
          CACHE_ENABLED: ${{ steps.cache.outputs.enabled }}
        run: |
          set -euo pipefail
          # --load keeps the image available to the local docker daemon
          # so the Trivy scan step and the push step that follow can
          # reference it by tag, unchanged.
          CACHE_REF="ghcr.io/${GITHUB_REPOSITORY,,}/container-build-cache:linux-amd64"
          CACHE_ARGS=()
          if [ "$CACHE_ENABLED" = "true" ]; then
            CACHE_ARGS+=(
              --cache-from "type=registry,ref=${CACHE_REF}"
              --cache-to "type=registry,ref=${CACHE_REF},mode=max,oci-mediatypes=true,image-manifest=true,ignore-error=true"
            )
          fi
          docker buildx build --platform linux/amd64 \
            "${CACHE_ARGS[@]}" \
            --load \
            --label "org.opencontainers.image.revision=${REF}" \
            -t "${IMAGE_NAME}:${TAG}" .
          echo "local_ref=${IMAGE_NAME}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Verify packaged native Pi Chat and official Claude
        if: steps.reuse.outputs.reused != 'true'
        env:
          IMAGE: ${{ steps.docker-build.outputs.local_ref }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /usr/local/bin/node "$IMAGE" \
            /opt/codeflare/openvscode/smoke-openvscode-sidebar-image.mjs \
            | tee /tmp/browser-ide-image-evidence.txt
          IMAGE_BYTES=$(docker image inspect "$IMAGE" --format '{{.Size}}')
          IMAGE_ID=$(docker image inspect "$IMAGE" --format '{{.Id}}')
          printf 'image_bytes=%s image_id=%s\n' "$IMAGE_BYTES" "$IMAGE_ID" \
            | tee -a /tmp/browser-ide-image-evidence.txt
          [ "$IMAGE_BYTES" -le 4500000000 ] || {
            echo "Complete image exceeds the 4.5 GB Browser IDE migration ceiling." >&2
            exit 1
          }

      - name: Measure idle code-server resources
        if: steps.reuse.outputs.reused != 'true'
        env:
          IMAGE: ${{ steps.docker-build.outputs.local_ref }}
        run: |
          set -euo pipefail
          claude_extension_version=$(jq -r '.version' openvscode/agent-sidebar/official-claude.json)
          pi_extensions=$(docker run --rm --entrypoint /usr/local/bin/code-server "$IMAGE" \
            --extensions-dir /opt/codeflare/openvscode/extensions/pi \
            --list-extensions --show-versions)
          claude_extensions=$(docker run --rm --entrypoint /usr/local/bin/code-server "$IMAGE" \
            --extensions-dir /opt/codeflare/openvscode/extensions/claude \
            --list-extensions --show-versions)
          none_extensions=$(docker run --rm --entrypoint /usr/local/bin/code-server "$IMAGE" \
            --extensions-dir /opt/codeflare/openvscode/extensions/none \
            --list-extensions --show-versions)
          printf '%s\n' "$pi_extensions" | grep -Fxi 'codeflare.codeflare-agent-sidebar@0.0.0'
          printf '%s\n' "$claude_extensions" | grep -Fxi "anthropic.claude-code@${claude_extension_version}"
          [ -z "$none_extensions" ] || { printf '%s\n' "$none_extensions"; exit 1; }
          printf 'host_discovery=pi:%s claude:%s none:empty\n' \
            'codeflare.codeflare-agent-sidebar@0.0.0' "anthropic.claude-code@${claude_extension_version}" \
            | tee -a /tmp/browser-ide-image-evidence.txt

          started_ms=$(date +%s%3N)
          container=$(docker run -d --entrypoint /usr/local/bin/code-server "$IMAGE" \
            --bind-addr 127.0.0.1:13337 \
            --auth none \
            --disable-telemetry \
            --disable-update-check \
            --disable-proxy \
            --disable-getting-started-override \
            --disable-workspace-trust \
            --user-data-dir /tmp/openvscode-smoke-data/data \
            --extensions-dir /opt/codeflare/openvscode/extensions/pi \
            --enable-proposed-api codeflare.codeflare-agent-sidebar \
            /home/user/workspace)
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if docker exec "$container" curl -fsS http://127.0.0.1:13337/ >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          [ "$ready" -eq 1 ] || { docker logs "$container"; exit 1; }
          readiness_ms=$(( $(date +%s%3N) - started_ms ))
          [ "$readiness_ms" -le 60000 ] || { echo "code-server cold readiness exceeded 60s" >&2; exit 1; }
          STATS=$(docker exec "$container" sh -c \
            'printf "processes=%s rss_kib=%s" "$(ps -e --no-headers | wc -l)" "$(ps -e -o rss= | awk '\''{s+=$1} END {print s+0}'\'')"')
          processes=$(printf '%s\n' "$STATS" | sed -n 's/.*processes=\([0-9][0-9]*\).*/\1/p')
          rss_kib=$(printf '%s\n' "$STATS" | sed -n 's/.*rss_kib=\([0-9][0-9]*\).*/\1/p')
          [ -n "$processes" ] && [ "$processes" -le 24 ] || { echo "code-server process ceiling exceeded: $STATS" >&2; exit 1; }
          [ -n "$rss_kib" ] && [ "$rss_kib" -le 1048576 ] || { echo "code-server RSS ceiling exceeded: $STATS" >&2; exit 1; }
          printf 'cold_readiness_ms=%s %s\n' "$readiness_ms" "$STATS" \
            | tee -a /tmp/browser-ide-image-evidence.txt
          if docker exec "$container" pgrep -af '(/usr/local/bin/pi|/usr/local/bin/claude|anthropic\.claude-code/.*/claude)' >/tmp/sidebar-agents.txt; then
            cat /tmp/sidebar-agents.txt
            echo 'Agent process started before native Chat or the Claude panel was used.' >&2
            exit 1
          fi
          if docker logs "$container" 2>&1 | grep -E 'CANNOT use API proposal|API proposal.*not found|Failed to register participant codeflare\.pi'; then
            docker logs "$container"
            echo 'Native Pi Chat contribution was rejected by code-server embedded Code.' >&2
            exit 1
          fi

          docker rm -f "$container" >/dev/null
          container=$(docker run -d --entrypoint /bin/sh "$IMAGE" -c '
            /opt/codeflare/openvscode/claude/prepare-sidebar-config.sh /tmp/openvscode-claude-smoke-data claude &&
            exec /usr/local/bin/code-server "$@"
          ' openvscode-claude-smoke \
            --bind-addr 127.0.0.1:13337 \
            --auth none \
            --disable-telemetry \
            --disable-update-check \
            --disable-proxy \
            --disable-getting-started-override \
            --disable-workspace-trust \
            --user-data-dir /tmp/openvscode-claude-smoke-data/data \
            --extensions-dir /opt/codeflare/openvscode/extensions/claude \
            /home/user/workspace)
          ready=0
          for _ in $(seq 1 60); do
            if docker exec "$container" curl -fsS http://127.0.0.1:13337/ >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          [ "$ready" -eq 1 ] || { docker logs "$container"; exit 1; }
          docker exec "$container" /usr/local/bin/node -e '
            const settings = require("/tmp/openvscode-claude-smoke-data/data/User/settings.json");
            if (settings["claudeCode.initialPermissionMode"] !== "bypassPermissions" ||
                settings["claudeCode.allowDangerouslySkipPermissions"] !== true ||
                settings["claudeCode.environmentVariables"]?.[0]?.value !== "/tmp/codeflare-sidebar/claude/config") process.exit(1);
          '
          sleep 3
          if docker logs "$container" 2>&1 | grep -E 'Unsupported platform|Extension activation failed.*[Aa]nthropic|anthropic\.claude-code.*(error|failed)'; then
            docker logs "$container"
            echo 'Official Claude extension failed against code-server embedded Code.' >&2
            exit 1
          fi
          if docker exec "$container" pgrep -af 'anthropic\.claude-code/.*/claude' >/tmp/claude-agent.txt; then
            cat /tmp/claude-agent.txt
            echo 'Official Claude process started before its panel was used.' >&2
            exit 1
          fi
          printf 'official_claude_host=ready settings_path=/tmp/openvscode-claude-smoke-data/data/User/settings.json lazy_process=true\n' \
            | tee -a /tmp/browser-ide-image-evidence.txt

      - name: Verify real code-server through the session proxy
        if: steps.reuse.outputs.reused != 'true'
        env:
          IMAGE: ${{ steps.docker-build.outputs.local_ref }}
        run: |
          set -euo pipefail
          container=$(docker run -d \
            -e CONTAINER_AUTH_TOKEN=browser-ide-smoke-token \
            -e SESSION_ID=smoke \
            -e SESSION_MODE=advanced \
            --entrypoint /bin/sh "$IMAGE" -c '
              /usr/local/bin/code-server \
                --bind-addr 127.0.0.1:13337 --auth none \
                --disable-telemetry --disable-update-check --disable-proxy \
                --disable-getting-started-override --disable-workspace-trust \
                --user-data-dir /tmp/openvscode-proxy-smoke/data \
                --extensions-dir /opt/codeflare/openvscode/extensions/none \
                /home/user/workspace >/tmp/code-server-proxy-smoke.log 2>&1 &
              exec /usr/local/bin/node /app/host/dist/server.js
            ')
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            status=$(docker exec "$container" curl -sS -L --max-redirs 5 -o /tmp/prefixed-editor.html \
              -w '%{http_code}' \
              -H 'Authorization: Bearer browser-ide-smoke-token' \
              -H 'Origin: https://codeflare.example' \
              -H 'X-Forwarded-Host: codeflare.example' \
              -H 'X-Forwarded-Proto: https' \
              http://127.0.0.1:8080/api/vscode/smoke/ || true)
            if [ "$status" = 200 ]; then ready=1; break; fi
            sleep 1
          done
          [ "$ready" -eq 1 ] || {
            docker logs "$container"
            docker exec "$container" cat /tmp/code-server-proxy-smoke.log || true
            exit 1
          }
          if docker exec "$container" grep -Eq '(src|href)="/' /tmp/prefixed-editor.html; then
            docker exec "$container" grep -E '(src|href)="/' /tmp/prefixed-editor.html
            echo 'code-server emitted a root-scoped initial asset URL through the session proxy.' >&2
            exit 1
          fi

          docker exec "$container" curl -fsS \
            -H 'Authorization: Bearer browser-ide-smoke-token' \
            -H 'Origin: https://codeflare.example' \
            -H 'X-Forwarded-Host: codeflare.example' \
            -H 'X-Forwarded-Proto: https' \
            http://127.0.0.1:8080/api/vscode/smoke/manifest.json \
            -o /tmp/prefixed-manifest.json
          asset=$(docker exec "$container" jq -r '.icons[0].src' /tmp/prefixed-manifest.json)
          case "$asset" in
            ./*) ;;
            *) echo "Manifest asset escaped the session-relative path: $asset" >&2; exit 1 ;;
          esac
          docker exec "$container" curl -fsS \
            -H 'Authorization: Bearer browser-ide-smoke-token' \
            -H 'Origin: https://codeflare.example' \
            -H 'X-Forwarded-Host: codeflare.example' \
            -H 'X-Forwarded-Proto: https' \
            "http://127.0.0.1:8080/api/vscode/smoke/${asset#./}" \
            -o /dev/null

          docker exec "$container" /usr/local/bin/node -e '
            const WebSocket = require("/app/host/node_modules/ws");
            const ws = new WebSocket(
              "ws://127.0.0.1:8080/api/vscode/smoke/?reconnectionToken=11111111-1111-4111-8111-111111111111&reconnection=false&skipWebSocketFrames=false",
              { headers: {
                Authorization: "Bearer browser-ide-smoke-token",
                Origin: "https://codeflare.example",
                "X-Forwarded-Host": "codeflare.example",
                "X-Forwarded-Proto": "https",
              } },
            );
            const timer = setTimeout(() => {
              process.stderr.write("prefixed code-server WebSocket did not open\n");
              ws.terminate();
              process.exit(1);
            }, 10000);
            ws.once("open", () => {
              setTimeout(() => {
                clearTimeout(timer);
                if (ws.readyState !== WebSocket.OPEN) {
                  process.stderr.write("prefixed code-server WebSocket closed during upstream handshake\n");
                  process.exit(1);
                }
                process.stdout.write("prefixed_ws=ready\n");
                ws.terminate();
              }, 1000);
            });
            ws.once("unexpected-response", (_request, response) => {
              clearTimeout(timer);
              process.stderr.write(`prefixed code-server WebSocket returned ${response.statusCode}\n`);
              response.resume();
              process.exit(1);
            });
            ws.once("error", (error) => {
              clearTimeout(timer);
              process.stderr.write(`${error.message}\n`);
              process.exit(1);
            });
          ' | tee -a /tmp/browser-ide-image-evidence.txt
          printf 'prefixed_http=ready prefixed_asset=ready external_path=/api/vscode/smoke/ origin=https://codeflare.example\n' \
            | tee -a /tmp/browser-ide-image-evidence.txt

      - name: Upload image evidence
        if: always() && steps.reuse.outputs.reused != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-ide-image-evidence
          path: /tmp/browser-ide-image-evidence.txt
          retention-days: 5
          if-no-files-found: error
      - name: Provision scan scratch space and free disk
        if: steps.reuse.outputs.reused != 'true'
        # Trivy exports the full uncompressed image to a temp dir before
        # analyzing layers. On GitHub-hosted runners the root disk arrives
        # ~90% full of preinstalled toolchains (a fresh VM per job — nothing
        # accumulates and docker prunes reclaim ~0B), so the export dies on /
        # with "no space left on device". The Azure resource disk at /mnt is a
        # separate, nearly empty volume with tens of GB free: point Trivy's
        # temp dir and cache there instead of deleting GitHub's preinstalls.
        # Self-hosted runners instead accumulate tagged images from prior
        # deploys in /var/lib/docker, so prior *-container images and dangling
        # layers are dropped too — everything except the image we scan next.
        env:
          # Through the environment, never interpolated into the script body.
          KEEP: ${{ steps.docker-build.outputs.local_ref }}
        run: |
          sudo mkdir -p /mnt/trivy-tmp /mnt/trivy-cache
          sudo chmod 1777 /mnt/trivy-tmp /mnt/trivy-cache
          # Guard: an empty KEEP would make grep -vxF match nothing and delete
          # the scan target too.
          if [ -n "$KEEP" ]; then
            docker images --format '{{.Repository}}:{{.Tag}}' \
              | grep -vxF "$KEEP" \
              | xargs -r docker rmi -f || true
          fi
          docker image prune -f || true
          rm -rf /tmp/trivy-* || true
          df -h / /tmp /mnt 2>/dev/null || true

      - name: Restore Trivy vulnerability DB cache
        if: steps.reuse.outputs.reused != 'true'
        # Keyed by day: at most one DB download per day across all runs;
        # restore-keys serves yesterday's DB while a fresh one uploads.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /mnt/trivy-cache
          key: trivy-db-${{ steps.hash.outputs.trivy_db_key }}
          restore-keys: trivy-db-

      - name: Scan container image for vulnerabilities
        if: steps.reuse.outputs.reused != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Both the uncompressed-image export and the vuln DB go to the big
          # /mnt resource disk; the root disk stays out of the equation.
          TMPDIR: /mnt/trivy-tmp
          TRIVY_CACHE_DIR: /mnt/trivy-cache
        with:
          image-ref: ${{ steps.docker-build.outputs.local_ref }}
          severity: HIGH,CRITICAL
          # Gate only on CVEs that have an available fix. Unfixed base-image
          # CVEs (blank Fixed Version, no upstream patch) cannot be remediated
          # by rebuilding and would otherwise block every deploy whenever the
          # Trivy feed adds one. The following step applies the only remaining
          # bounded exception and rejects every other reported finding.
          ignore-unfixed: true
          exit-code: 0
          format: json
          output: /tmp/trivy-result.json
          scanners: vuln
          trivyignores: .trivyignore
          timeout: 15m

      - name: Enforce vulnerability scan and bounded exceptions
        if: steps.reuse.outputs.reused != 'true'
        run: node scripts/ci/validate-trivy-result.mjs /tmp/trivy-result.json

      - name: Generate an SBOM for the image
        if: steps.reuse.outputs.reused != 'true'
        # The Trivy scan answers "are there known CVEs today". It does not answer
        # "what is actually in this image", which is the question asked after a
        # new CVE lands — and answering it by re-scanning assumes the image is
        # still pullable and still the one that shipped. A CycloneDX SBOM
        # recorded at build time answers it from the artifact itself.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TMPDIR: /mnt/trivy-tmp
          TRIVY_CACHE_DIR: /mnt/trivy-cache
        with:
          image-ref: ${{ steps.docker-build.outputs.local_ref }}
          scan-type: image
          format: cyclonedx
          output: /tmp/sbom.cdx.json
          # An SBOM is an inventory, not a gate — findings are the scan's job.
          exit-code: 0
          timeout: 15m

      - name: Upload the SBOM
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ inputs.registry }}-${{ steps.hash.outputs.tag }}
          path: /tmp/sbom.cdx.json
          retention-days: 90
          if-no-files-found: error

      - name: Install locked wrangler
        if: steps.reuse.outputs.reused != 'true' && inputs.registry == 'cloudflare'
        run: npm ci --prefix .github/npm-tools/wrangler --no-audit --no-fund

      - name: Push image
        id: push
        if: steps.reuse.outputs.reused != 'true'
        env:
          TAG: ${{ steps.hash.outputs.tag }}
          REGISTRY: ${{ inputs.registry }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ "${REGISTRY}" = "dockerhub" ]; then
            REGISTRY_URI="docker.io/${DOCKERHUB_USER}/${IMAGE_NAME}:${TAG}"
            docker tag "${IMAGE_NAME}:${TAG}" "${REGISTRY_URI}"
            # Retry transient registry push failures: 30 attempts, 30s apart.
            attempt=0; max=30
            until [ "$attempt" -ge "$max" ]; do
              attempt=$((attempt+1))
              echo "::group::docker push (attempt $attempt/$max)"
              if docker push "${REGISTRY_URI}"; then echo "::endgroup::"; break; fi
              echo "::endgroup::"
              if [ "$attempt" -ge "$max" ]; then echo "::error::docker push failed after $max attempts"; exit 1; fi
              echo "::warning::docker push failed (attempt $attempt/$max); retrying in 30s"
              sleep 30
            done
          else
            # Retry transient registry/control-plane push failures: 30 attempts, 30s apart.
            attempt=0; max=30
            until [ "$attempt" -ge "$max" ]; do
              attempt=$((attempt+1))
              echo "::group::wrangler containers push (attempt $attempt/$max)"
              # NB: `if <pipeline>` is required, not a bare `cmd | tee` + $PIPESTATUS:
              # GitHub runs steps under `bash -eo pipefail`, so a bare failing pipeline
              # would trip `set -e` and abort the step before any retry could run. The
              # `if` condition suppresses `set -e`; pipefail still surfaces wrangler's
              # exit through the pipe while tee keeps writing the log for URI extraction.
              if .github/npm-tools/wrangler/node_modules/.bin/wrangler containers push "${IMAGE_NAME}:${TAG}" 2>&1 | tee /tmp/push-output.txt; then
                echo "::endgroup::"
                break
              fi
              echo "::endgroup::"
              if [ "$attempt" -ge "$max" ]; then
                echo "::error::wrangler containers push failed after $max attempts"
                exit 1
              fi
              echo "::warning::wrangler containers push failed (attempt $attempt/$max); retrying in 30s"
              sleep 30
            done
            # Extract the registry URI from the "Pushed image:" line (includes tag)
            # `|| true` so the diagnostic below is actually reachable: steps run
            # under `bash -eo pipefail`, and VAR=$(failing pipeline) trips set -e
            # at the assignment, so the `cat` that dumps the push output — the
            # only thing that tells you WHY extraction failed — never ran. `head`
            # can also take SIGPIPE and return 141 under pipefail.
            REGISTRY_URI=$(grep -oP '(?<=Pushed image: )registry\.cloudflare\.com/\S+' /tmp/push-output.txt | head -1 || true)
            if [ -z "$REGISTRY_URI" ]; then
              echo "::error::Failed to extract registry URI from wrangler containers push output"
              cat /tmp/push-output.txt
              exit 1
            fi
          fi
          echo "Registry URI: ${REGISTRY_URI}"

          # Provenance is keyed on the digest the REGISTRY assigned, because that
          # is what `gh attestation verify` resolves an image reference to. A
          # config digest would produce an attestation the standard tooling
          # cannot check, so both paths read the real manifest digest back or
          # fail — an unverifiable attestation is worse than none.
          if [ "${REGISTRY}" = "dockerhub" ]; then
            # Guard the empty case in the template, not after the fact: steps run
            # as `bash -e`, and `index` on an empty RepoDigests slice fails the
            # command, aborting the step before the check below could report why.
            DIGEST=$(docker image inspect "${REGISTRY_URI}" \
              --format '{{if .RepoDigests}}{{index .RepoDigests 0}}{{end}}' | cut -d@ -s -f2)
          else
            # `wrangler containers push` prints no digest and leaves the docker
            # daemon unauthenticated against registry.cloudflare.com — but the
            # reuse gate above proves the manifest is readable anyway: mint the
            # same short-lived pull credential and take Docker-Content-Digest off
            # the response. Same Accept set as the reuse probe, so the digest
            # returned is for the same representation.
            CRED=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/containers/registries/registry.cloudflare.com/credentials" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' \
              --data '{"expiration_minutes":10,"permissions":["pull"]}')
            if [ "$(printf '%s' "$CRED" | jq -r .success)" != "true" ]; then
              echo "::error::Could not mint registry credentials to read back the pushed manifest digest"
              exit 1
            fi
            # Mask the minted credential before it can reach a log. It is a live
            # registry password with a 10-minute window; without this any later
            # `set -x`, jq error, or debug dump prints it verbatim.
            echo "::add-mask::$(printf '%s' "$CRED" | jq -r .result.password)"
            AUTH=$(printf '%s:%s' "$(printf '%s' "$CRED" | jq -r .result.username)" "$(printf '%s' "$CRED" | jq -r .result.password)" | base64 -w0)
            echo "::add-mask::${AUTH}"
            ACCEPT='application/vnd.oci.image.manifest.v1+json,application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.docker.distribution.manifest.list.v2+json'
            DIGEST=$(curl -sS -o /dev/null -D - -H "Authorization: Basic ${AUTH}" -H "Accept: ${ACCEPT}" \
              "https://registry.cloudflare.com/v2/${CLOUDFLARE_ACCOUNT_ID}/${IMAGE_NAME}/manifests/${TAG}" \
              | tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" { print $2 }')
          fi

          case "${DIGEST}" in
            sha256:*) ;;
            *)
              echo "::error::Pushed to ${REGISTRY} but could not read back a manifest digest (got '${DIGEST}') — refusing to attest an unverifiable subject"
              exit 1
              ;;
          esac
          echo "Manifest digest: ${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        # Runs on BOTH registries, so the production path is covered rather than
        # only the emergency bypass. Skipped when the image was reused: no new
        # artifact was produced, and the identical-input image already carries
        # the attestation from the build that created it.
        #
        # subject-name is the bare image name, never the registry URI — the URI
        # embeds the account id / Docker Hub username, and an attestation is
        # PUBLIC. push-to-registry stays false for the same reason plus the extra
        # write scope it would need; `gh attestation verify` resolves by digest
        # against this repository, so the attestation is still verifiable:
        #   gh attestation verify oci://<registry>/<path>:<tag> \
        #     --repo nikolanovoselec/codeflare
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false
