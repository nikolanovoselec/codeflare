name: Prepare safe-check baked seed
on:
  push:
    branches: ['tmp/prepare-safe-check-tools-*']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Generate baked seed with the existing compiler
        run: node scripts/generate-agent-seed.mjs
      - name: Record source and artifact provenance
        run: |
          git diff --check
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/source-head.txt"
          sha256sum preseed/agents/claude/skills/safe-local-checks/SKILL.md preseed/agents/claude/skills/safe-local-checks/scripts/safe-local-check.mjs preseed/agents/pi/extensions/guard-helpers.ts src/lib/agent-seed.generated.ts > "$RUNNER_TEMP/sha256sums.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safe-check-baked-seed
          path: |
            src/lib/agent-seed.generated.ts
            ${{ runner.temp }}/source-head.txt
            ${{ runner.temp }}/sha256sums.txt
          if-no-files-found: error
          retention-days: 7
