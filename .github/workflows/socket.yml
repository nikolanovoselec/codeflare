name: Socket Security

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: socket-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  socket:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Requires SOCKET_SECURITY_API_KEY repository secret.
      # Generate one at https://socket.dev/dashboard/org/settings/api-tokens
      - name: Socket Security Analysis
        uses: SocketDev/action@4337a545deecc20f19a909e52db7a2f6ba292f42 # v1.2.0
        with:
          repo: ${{ github.repository }}
