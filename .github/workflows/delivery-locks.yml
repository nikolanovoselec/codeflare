# Temporary branch-only metadata resolution; remove before opening the delivery PR.
name: Delivery lock resolution
on:
  push:
    branches: [merge/develop-dropdown-maintenance]
    paths:
      - package.json
      - '**/package.json'
      - .github/workflows/delivery-locks.yml
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            path: .
          - name: web-ui
            path: web-ui
          - name: host
            path: host
          - name: sidebar
            path: openvscode/agent-sidebar
          - name: landing
            path: landing
          - name: oxlint
            path: image/oxlint
          - name: npm-tools
            path: preseed/npm-tools
          - name: pi
            path: preseed/agents/pi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Resolve committed manifests without lifecycle scripts
        env:
          PACKAGE_PATH: ${{ matrix.path }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node scripts/regenerate-npm-package-lock.mjs "$PACKAGE_PATH"
          node --input-type=module <<'RECEIPT'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const path = join(process.env.PACKAGE_PATH, 'package-lock.json');
          writeFileSync('lock-receipt.json', JSON.stringify({ sourceSha: process.env.SOURCE_SHA,
            path, sha256: createHash('sha256').update(readFileSync(path)).digest('hex') }) + '\n');
          RECEIPT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delivery-lock-${{ matrix.name }}-${{ github.sha }}
          path: |
            ${{ matrix.path }}/package-lock.json
            lock-receipt.json
          if-no-files-found: error
          retention-days: 3
