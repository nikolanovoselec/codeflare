name: E2E Tests
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options:
          - integration
          - production
        default: integration

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    environment: ${{ inputs.environment || 'integration' }}
    timeout-minutes: 15
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Validate required variables
        run: |
          if [ -z "$E2E_BASE_URL" ]; then
            echo "::error::E2E_BASE_URL is not set. Configure it in the '${{ inputs.environment }}' environment variables (e.g., https://your-app.example.com)."
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Cache root node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache-root
        with:
          path: node_modules
          key: root-${{ hashFiles('package-lock.json') }}

      - name: Cache web-ui node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache-webui
        with:
          path: web-ui/node_modules
          key: webui-${{ hashFiles('web-ui/package-lock.json') }}

      - name: Install root dependencies
        if: steps.cache-root.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install web-ui dependencies
        if: steps.cache-webui.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: web-ui

      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome

      - name: Run E2E API tests
        run: npm run test:e2e

      - name: Run E2E UI tests
        run: npm run test:e2e:ui
