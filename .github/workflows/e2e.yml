name: E2E Tests
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options:
          - integration
          - production
        default: integration

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    # Always use integration environment — it holds the CF Access service token
    # secrets needed for E2E auth. The target worker URL is resolved from the input.
    environment: integration
    timeout-minutes: 15
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Resolve target worker
        id: target
        run: |
          TARGET="${{ inputs.environment || 'integration' }}"
          if [ "$TARGET" = "production" ]; then
            # Production uses custom domain
            echo "base_url=https://codeflare.novoselec.ch" >> "$GITHUB_OUTPUT"
            echo "worker_name=codeflare-production" >> "$GITHUB_OUTPUT"
          else
            # Integration uses workers.dev subdomain
            echo "base_url=https://codeflare-integration.nikola-novoselec.workers.dev" >> "$GITHUB_OUTPUT"
            echo "worker_name=codeflare-integration" >> "$GITHUB_OUTPUT"
          fi
          echo "Target: $TARGET"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Ensure SERVICE_AUTH_SECRET is set on target worker
        run: |
          if [ -z "${CF_ACCESS_CLIENT_SECRET}" ]; then
            echo "::error::CF_ACCESS_CLIENT_SECRET is not set in the integration environment."
            exit 1
          fi

          WORKER="${{ steps.target.outputs.worker_name }}"
          echo "Setting SERVICE_AUTH_SECRET on worker: $WORKER"
          printf '%s' "${CF_ACCESS_CLIENT_SECRET}" | npx wrangler secret put SERVICE_AUTH_SECRET --name "$WORKER" 2>/dev/null

          # Seed service token user in KV allowlist
          if [ -n "${CF_ACCESS_CLIENT_ID}" ]; then
            SHORT_ID=$(echo "$CF_ACCESS_CLIENT_ID" | cut -d. -f1)
            SERVICE_EMAIL="service-${SHORT_ID}@codeflare.local"
            echo "Seeding E2E service token user: ${SERVICE_EMAIL}"

            KV_TITLE="${WORKER}-kv"
            KV_ID=$(npx wrangler kv namespace list 2>/dev/null \
              | sed -n '/^\[/,/^\]/p' \
              | jq -r --arg title "$KV_TITLE" '.[] | select(.title == $title) | .id' \
              | head -1)

            if [ -n "$KV_ID" ]; then
              KV_VALUE="{\"addedBy\":\"e2e\",\"addedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"role\":\"admin\"}"
              npx wrangler kv key put "user:${SERVICE_EMAIL}" "${KV_VALUE}" --namespace-id "$KV_ID" --remote 2>/dev/null || \
              echo "::warning::Could not seed E2E user in KV (non-fatal)"
            else
              echo "::warning::KV namespace not found for worker $WORKER (non-fatal)"
            fi
          fi

      - name: Smoke test — verify E2E target is reachable and auth works
        env:
          E2E_BASE_URL: ${{ steps.target.outputs.base_url }}
        run: |
          BASE="$E2E_BASE_URL"

          echo "Testing: $BASE/health"
          HEALTH=$(curl -sS -o /tmp/health.json -w "%{http_code}" "$BASE/health" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" || true)
          echo "Health status: $HEALTH"
          cat /tmp/health.json 2>/dev/null; echo

          if [ "$HEALTH" = "302" ]; then
            echo "::error::CF Access returned 302 redirect for /health. The service token is not accepted by the CF Access application protecting $BASE."
            exit 1
          fi

          echo "Testing: $BASE/api/sessions"
          SESSIONS=$(curl -sS -o /tmp/sessions.json -w "%{http_code}" "$BASE/api/sessions" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H "X-Service-Auth: $CF_ACCESS_CLIENT_SECRET" || true)
          echo "Sessions status: $SESSIONS"
          cat /tmp/sessions.json 2>/dev/null; echo

          if [ "$SESSIONS" = "302" ]; then
            echo "::error::CF Access returned 302 redirect. The service token is not accepted by the CF Access application protecting $BASE."
            exit 1
          fi

          if [ "$SESSIONS" = "401" ] || [ "$SESSIONS" = "403" ]; then
            echo "::error::Auth failed ($SESSIONS). SERVICE_AUTH_SECRET may not be set on the worker, or the secret doesn't match CF_ACCESS_CLIENT_SECRET."
            exit 1
          fi

      - name: Cache root node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache-root
        with:
          path: node_modules
          key: root-${{ hashFiles('package-lock.json') }}

      - name: Cache web-ui node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache-webui
        with:
          path: web-ui/node_modules
          key: webui-${{ hashFiles('web-ui/package-lock.json') }}

      - name: Install root dependencies
        if: steps.cache-root.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install web-ui dependencies
        if: steps.cache-webui.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: web-ui

      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome

      - name: Run E2E API tests
        env:
          E2E_BASE_URL: ${{ steps.target.outputs.base_url }}
        run: npm run test:e2e

      - name: Run E2E UI tests
        env:
          E2E_BASE_URL: ${{ steps.target.outputs.base_url }}
        run: npm run test:e2e:ui
