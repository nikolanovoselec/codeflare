name: E2E Tests
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options:
          - integration
          - production
        default: integration

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    environment: ${{ inputs.environment || 'integration' }}
    timeout-minutes: 15
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Validate required variables
        run: |
          if [ -z "$E2E_BASE_URL" ]; then
            echo "::error::E2E_BASE_URL is not set. Configure it in the '${{ inputs.environment }}' environment variables (e.g., https://your-app.example.com)."
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Smoke test — verify E2E target is reachable and auth works
        run: |
          # Normalize URL
          BASE="$E2E_BASE_URL"
          [[ "$BASE" =~ ^https?:// ]] || BASE="https://$BASE"

          echo "Testing: $BASE/health"
          HEALTH=$(curl -sS -o /tmp/health.json -w "%{http_code}" "$BASE/health" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" || true)
          echo "Health status: $HEALTH"
          cat /tmp/health.json 2>/dev/null; echo

          echo "Testing: $BASE/api/setup/status"
          SETUP=$(curl -sS -o /tmp/setup.json -w "%{http_code}" "$BASE/api/setup/status" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H "X-Requested-With: fetch" || true)
          echo "Setup status: $SETUP"
          cat /tmp/setup.json 2>/dev/null; echo

          echo "Testing: $BASE/api/sessions"
          SESSIONS=$(curl -sS -o /tmp/sessions.json -w "%{http_code}" "$BASE/api/sessions" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H "X-Service-Auth: $CF_ACCESS_CLIENT_SECRET" || true)
          echo "Sessions status: $SESSIONS"
          cat /tmp/sessions.json 2>/dev/null; echo

          if [ "$SESSIONS" = "401" ] || [ "$SESSIONS" = "403" ]; then
            echo "::error::Auth failed ($SESSIONS). Check CF_ACCESS_CLIENT_ID/SECRET and ensure the service token has access to the CF Access application protecting $BASE."
            exit 1
          fi

          if [ "$SESSIONS" = "302" ]; then
            echo "::error::CF Access returned 302 redirect. The service token is not accepted by the CF Access application protecting $BASE. Verify the service token is added to the Access policy."
            exit 1
          fi

      - name: Cache root node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache-root
        with:
          path: node_modules
          key: root-${{ hashFiles('package-lock.json') }}

      - name: Cache web-ui node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache-webui
        with:
          path: web-ui/node_modules
          key: webui-${{ hashFiles('web-ui/package-lock.json') }}

      - name: Install root dependencies
        if: steps.cache-root.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install web-ui dependencies
        if: steps.cache-webui.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: web-ui

      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome

      - name: Run E2E API tests
        run: npm run test:e2e

      - name: Run E2E UI tests
        run: npm run test:e2e:ui
