name: PR Checks
# Fires on:
#   - push to main (post-merge regression gate; Deploy fires only on green)
#   - pull_request targeting main OR develop (pre-merge gate; develop
#     is included so the feature → develop step of the canonical flow
#     gets the same pre-merge signal as feature → main does)
#   - workflow_dispatch (manual re-run; runs every lane unconditionally)
#
# `push` deliberately does NOT list develop: while a develop → main PR is
# open, a push to develop already fires a pull_request (synchronize) run,
# so adding develop under push too would run this workflow TWICE for one
# push. The pull_request run is the pre-merge gate; dropping the redundant
# push run leaves exactly one PR Checks run per develop push.
#
# Cost note: per merge to main this still fires twice — once pre-merge on
# the PR head (pull_request) and once post-merge on the merge commit
# (push to main). The post-merge run is the one Deploy gates on via
# workflow_run; the pre-merge run is what blocks the merge button. Those
# are distinct refs/purposes, not the duplicate this trigger list avoids.
#
# Topology: the `changes` job path-filters the diff; the lanes run in
# PARALLEL, each gated on its filter (all lanes run on workflow_dispatch).
# The `summary` job — check name "test", the required branch-protection
# context — aggregates: failure/cancelled in any needed lane fails it,
# skipped lanes (nothing relevant changed) pass it, and it reconciles the
# shard reports against the tree so no suite can go missing quietly.
#
# Every suite — backend shards, the Node-runtime leg, frontend shards,
# landing — runs through .github/actions/vitest-suite, so all of them get
# the same JSON-report gate rather than the backend alone.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  # Merge queue: the queue builds its own ref and needs this same required
  # context to report against it, or every queued PR stalls waiting for a
  # check that never runs.
  merge_group:
  workflow_dispatch:
  schedule:
    # Nightly full-matrix sweep: every lane runs regardless of diff, catching
    # flaky tests and dependency/audit drift between pushes.
    - cron: '30 3 * * *'

concurrency:
  # github.ref is the per-PR merge ref for pull_request events, so two PRs
  # sharing one head branch never cancel each other (each tests its own merge
  # result) while superseded pushes of the same PR still cancel.
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      webui: ${{ steps.filter.outputs.webui }}
      landing: ${{ steps.filter.outputs.landing }}
      host: ${{ steps.filter.outputs.host }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - id: filter
        # Diff-based filtering needs a diff: on schedule and manual dispatch
        # every lane runs unconditionally, so the step is skipped and its
        # (empty) outputs are never consulted.
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          # `shared` is an anchor, not a lane: pipeline changes re-run every lane.
          # Root package.json/lock are shared because the root toolchain (vitest,
          # oxlint, knip, wrangler) gates every lane's behavior.
          filters: |
            shared: &shared
              - '.github/workflows/test.yml'
              - '.github/actions/**'
              - 'scripts/ci/**'
              - 'package.json'
              - 'package-lock.json'
            backend:
              - *shared
              - 'src/**'
              - 'scripts/**'
              - 'preseed/**'
              - 'wrangler.toml'
              - 'vitest.config.ts'
              - 'tsconfig.json'
            webui:
              - *shared
              - 'web-ui/**'
            landing:
              - *shared
              - 'landing/**'
            host:
              - *shared
              - 'host/**'
              - 'preseed/**'

  quality:
    name: Quality (lint / knip / audit)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.webui == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Agent seed generator drift guard
        # The committed src/lib/agent-seed.generated.ts must equal a fresh generation
        # from preseed/. `pretest` regenerates it during `npm test`, so a stale committed
        # copy would silently ship OLD extension bytes to R2/containers (the deploy-seeding
        # path embeds this file). Fail fast if the generator output drifts from what is
        # committed. The generator uses only Node builtins, so it needs no node_modules.
        run: |
          node scripts/generate-agent-seed.mjs
          git diff --exit-code src/lib/agent-seed.generated.ts \
            || { echo "::error::agent-seed.generated.ts is stale — run 'npm run generate:agent-seed' and commit the result"; exit 1; }

      - uses: ./.github/actions/install-deps
        with:
          key-prefix: root

      - uses: ./.github/actions/install-deps
        with:
          directory: web-ui
          key-prefix: webui

      - name: Lint backend
        run: npm run lint

      - name: Lint frontend
        run: npm run lint
        working-directory: web-ui

      - name: Dead code check (backend)
        run: npm run knip

      - name: Dead code check (frontend)
        run: npm run knip
        working-directory: web-ui

      - name: Security audit (backend)
        run: npm audit --audit-level=high --omit=dev

      - name: Security audit (frontend)
        run: npm audit --audit-level=high --omit=dev
        working-directory: web-ui

  typecheck:
    name: Typecheck
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.webui == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - uses: ./.github/actions/install-deps
        with:
          key-prefix: root

      - uses: ./.github/actions/install-deps
        with:
          directory: web-ui
          key-prefix: webui

      - name: Generate Workers runtime types
        run: npx wrangler types

      - name: Type check backend
        run: npm run typecheck
        timeout-minutes: 5

      - name: Type check frontend
        run: npm run typecheck
        working-directory: web-ui
        timeout-minutes: 5

  backend-tests:
    name: Backend tests (${{ matrix.slug }})
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      needs.changes.outputs.backend == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Four shards, not two. Roughly 85% of a shard's wall clock is per-file
        # Vite transform and workerd isolate setup rather than test execution
        # (measured: 18s of assertions inside 81s), and about half of that
        # overhead sits in the main process where extra pool workers cannot
        # reach it. It is per-process, though, so it divides cleanly across
        # shards — each of which is its own runner.
        #
        # The Node-runtime suite is not shardable, so it gets its own leg rather
        # than riding one shard and making it the straggler (it cost shard 1 an
        # extra ~35s while its siblings idled).
        include:
          - shard: '1/4'
            slug: shard-1
            script: test
            tolerate-pool-crash: 'true'
            pre-run: ''
          - shard: '2/4'
            slug: shard-2
            script: test
            tolerate-pool-crash: 'true'
            pre-run: ''
          - shard: '3/4'
            slug: shard-3
            script: test
            tolerate-pool-crash: 'true'
            pre-run: ''
          - shard: '4/4'
            slug: shard-4
            script: test
            tolerate-pool-crash: 'true'
            pre-run: ''
          - shard: ''
            slug: node
            script: 'test:node'
            # Plain Node, no workerd — a non-zero exit here is always a failure.
            tolerate-pool-crash: 'false'
            # `pretest` hooks `npm test`, not `npm run test:node`, and these
            # tests read the generated seeds.
            pre-run: 'npm run pretest'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - uses: ./.github/actions/install-deps
        with:
          key-prefix: root

      - name: Create assets directory (wrangler.toml requires web-ui/dist)
        run: mkdir -p web-ui/dist

      - name: Run suite (fail-closed gate)
        uses: ./.github/actions/vitest-suite
        with:
          shard: ${{ matrix.shard }}
          script: ${{ matrix.script }}
          artifact-name: backend-${{ matrix.slug }}
          pre-run: ${{ matrix.pre-run }}
          tolerate-pool-crash: ${{ matrix.tolerate-pool-crash }}

  frontend-tests:
    name: Frontend tests (${{ matrix.slug }})
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      needs.changes.outputs.webui == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # 129 jsdom test files took 76s in one job — the longest lane in the run
      # once the backend was sharded. Same reasoning as the backend split: the
      # cost is per-file and per-process, so it divides across runners.
      matrix:
        include:
          - shard: '1/3'
            slug: shard-1
          - shard: '2/3'
            slug: shard-2
          - shard: '3/3'
            slug: shard-3
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - uses: ./.github/actions/install-deps
        with:
          directory: web-ui
          key-prefix: webui

      - name: Build frontend
        # Not a test dependency — it is here so a broken production build fails
        # a PR. Only one shard needs to pay for it.
        if: matrix.slug == 'shard-1'
        run: npm run build
        working-directory: web-ui

      - name: Run suite (fail-closed gate)
        uses: ./.github/actions/vitest-suite
        with:
          working-directory: web-ui
          shard: ${{ matrix.shard }}
          artifact-name: frontend-${{ matrix.slug }}

  landing-tests:
    name: Landing tests
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      needs.changes.outputs.landing == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - uses: ./.github/actions/install-deps
        with:
          directory: landing
          key-prefix: landing

      - name: Run suite (fail-closed gate)
        # Container-API render tests + pure-logic unit tests (landing/README.md)
        uses: ./.github/actions/vitest-suite
        with:
          working-directory: landing
          artifact-name: landing

  host-tests:
    name: Host tests
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      needs.changes.outputs.host == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - uses: ./.github/actions/install-deps
        # wrangler-static-assets.test.js imports 'wrangler' from the ROOT
        # node_modules (module lookup walks up from host/__tests__).
        with:
          key-prefix: root

      - uses: ./.github/actions/install-deps
        with:
          directory: host
          key-prefix: host

      - name: Create assets directory (wrangler.toml requires web-ui/dist)
        # wrangler-static-assets.test.js reads wrangler.toml via unstable_readConfig,
        # which resolves the [assets] directory; without the dir the config loads
        # without assets and the test fails.
        run: mkdir -p web-ui/dist

      - name: Build host (TypeScript)
        run: npm run build
        working-directory: host

      - name: Install rclone for sync-filter behavioral tests
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Run host hook tests (node:test)
        # host/__tests__/ci-excluded.txt lists exact filenames of tests that need
        # graphify CLI, python3 graphify module, rclone state, or gh-in-PR-context
        # that only exist inside the codeflare container. They run during
        # development, not in CI. Whole-line match (-x) so an entry can never
        # swallow a similarly named test and a stray blank line excludes nothing.
        run: |
          node --experimental-test-module-mocks --test --test-timeout=60000 \
            $(ls host/__tests__/*.test.js \
              | grep -vxFf <(sed 's|^|host/__tests__/|' host/__tests__/ci-excluded.txt))
        timeout-minutes: 5

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  summary:
    # Check name "test" is the required branch-protection context on main —
    # renaming this job's `name` breaks the merge gate.
    name: test
    needs:
      - changes
      - quality
      - typecheck
      - backend-tests
      - frontend-tests
      - landing-tests
      - host-tests
      - dependency-review
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate lane results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          BAD=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')
          if [ -n "$BAD" ]; then
            echo "::error::Failed lanes: $(echo "$BAD" | tr '\n' ' ')"
            exit 1
          fi
          echo "All lanes green (skipped = not affected by this change)"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: always()
        with:
          persist-credentials: false

      - name: Download suite reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '{backend-*,frontend-*,landing}'
          path: /tmp/test-artifacts

      - name: Reconcile suite coverage against the tree
        # Fail-closed: every test file in every suite's tree must appear in some
        # report. A per-run gate can only vouch for files it was handed, so a file
        # lost to a mis-shard or a worker dying mid-run would otherwise pass
        # silently. Lane results distinguish "path filter skipped this suite" from
        # "the suite ran and its reports vanished". No `always()` — if a lane
        # already failed above, this job is done deciding.
        env:
          LANES: >-
            {"backend":"${{ needs.backend-tests.result }}",
             "frontend":"${{ needs.frontend-tests.result }}",
             "landing":"${{ needs.landing-tests.result }}"}
        run: node scripts/ci/check-suite-completeness.mjs /tmp/test-artifacts "$LANES"

      - name: Publish test-result table
        # Reporting only — the aggregate step above already decided the
        # outcome, so a render hiccup must never flip the required context.
        if: always()
        continue-on-error: true
        run: node scripts/ci/render-test-summary.mjs /tmp/test-artifacts >> "$GITHUB_STEP_SUMMARY"
