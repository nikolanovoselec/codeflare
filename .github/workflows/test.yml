name: PR Checks
# Fires on:
#   - push to main (post-merge regression gate; Deploy fires only on green)
#   - pull_request targeting main OR develop (pre-merge gate; develop
#     is included so the feature → develop step of the canonical flow
#     gets the same pre-merge signal as feature → main does)
#   - workflow_dispatch (manual re-run; runs every lane unconditionally)
#
# `push` deliberately does NOT list develop: while a develop → main PR is
# open, a push to develop already fires a pull_request (synchronize) run,
# so adding develop under push too would run this workflow TWICE for one
# push. The pull_request run is the pre-merge gate; dropping the redundant
# push run leaves exactly one PR Checks run per develop push.
#
# Cost note: per merge to main this still fires twice — once pre-merge on
# the PR head (pull_request) and once post-merge on the merge commit
# (push to main). The post-merge run is the one Deploy gates on via
# workflow_run; the pre-merge run is what blocks the merge button. Those
# are distinct refs/purposes, not the duplicate this trigger list avoids.
#
# Topology: the `changes` job path-filters the diff; the lanes run in
# PARALLEL, each gated on its filter (all lanes run on workflow_dispatch).
# The `summary` job — check name "test", the required branch-protection
# context — aggregates: failure/cancelled in any needed lane fails it,
# skipped lanes (nothing relevant changed) pass it, and it reconciles the
# shard reports against the tree so no suite can go missing quietly.
#
# Every suite — backend shards, the Node-runtime leg, frontend shards,
# landing — runs through .github/actions/vitest-suite, so all of them get
# the same JSON-report gate rather than the backend alone.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  # Merge queue: the queue builds its own ref and needs this same required
  # context to report against it, or every queued PR stalls waiting for a
  # check that never runs.
  #
  # This alone does NOT make the queue usable, and turning it on while only this
  # workflow handles merge_group would hang every queued PR forever: `main`'s
  # ruleset also requires `Property-based fuzzing` and CodeQL, and neither
  # fuzz.yml nor codeql.yml has a merge_group trigger. Add it there first.
  merge_group:
  workflow_dispatch:
  # Called by deploy.yml on manual dispatch. A manual deploy is the one path
  # that does not arrive through the workflow_run gate, so it runs these checks
  # inline against the exact commit it is about to ship rather than trusting
  # that some earlier run covered it. Reusable workflows inherit the caller's
  # github context, so the diff filter is skipped and every lane executes.
  workflow_call:
    inputs:
      concurrency_key:
        description: >-
          Extra discriminator for the concurrency group. deploy.yml passes its
          run id so each dispatched deploy verifies in its own group.
        type: string
        default: ''

concurrency:
  # github.ref is the per-PR merge ref for pull_request events, so two PRs
  # sharing one head branch never cancel each other (each tests its own merge
  # result) while superseded pushes of the same PR still cancel.
  #
  # github.workflow is in the key because deploy.yml calls this workflow: a
  # called workflow inherits the CALLER's context, so a manual production deploy
  # from main would otherwise land in the same group as the ordinary
  # push-to-main run and one would cancel the other — turning verify.result into
  # 'cancelled' and silently skipping the whole deploy. Here github.workflow is
  # "Deploy" for the inline run and "PR Checks" for the real one.
  #
  # That is not enough on its own: deploy.yml groups by ENVIRONMENT so two
  # environments can deploy from one branch at the same time, but both inline
  # verifies would still share workflow+ref and the second dispatch would cancel
  # the first's verify — same silent skipped deploy. deploy.yml therefore passes
  # its run id as concurrency_key; it is empty for every non-called event, which
  # leaves the supersede-the-previous-push behaviour intact.
  group: test-${{ github.workflow }}-${{ github.ref }}-${{ inputs.concurrency_key }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Node 22+ shares a V8 bytecode cache between processes; these lanes spawn node
  # hundreds of times (vitest workers, gate scripts, generators). Declared here
  # rather than written to GITHUB_ENV from a composite action — a workflow-level
  # literal is inert, whereas anything that writes GITHUB_ENV is a code-execution
  # surface the moment its value stops being a constant (zizmor github-env).
  NODE_COMPILE_CACHE: /tmp/node-compile-cache

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # Single source of truth for "the diff filter did not run, so every lane
      # must run". Derived from the filter step's own outcome rather than a
      # hand-listed set of event names: those two lists were duplicated and
      # drifted, which is exactly how merge_group ended up skipping every lane
      # while the required check still reported green. Any future trigger the
      # filter does not handle now defaults to running everything.
      full: ${{ steps.filter.outcome == 'skipped' }}
      backend: ${{ steps.filter_fallback.outputs.backend || steps.filter.outputs.backend }}
      webui: ${{ steps.filter_fallback.outputs.webui || steps.filter.outputs.webui }}
      landing: ${{ steps.filter_fallback.outputs.landing || steps.filter.outputs.landing }}
      host: ${{ steps.filter_fallback.outputs.host || steps.filter.outputs.host }}
      pi: ${{ steps.filter_fallback.outputs.pi || steps.filter.outputs.pi }}
      ide: ${{ steps.filter_fallback.outputs.ide || steps.filter.outputs.ide }}
      workflows: ${{ steps.filter_fallback.outputs.workflows || steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        # Diff-based filtering needs a diff: when the nightly wrapper calls this
        # workflow, and on manual dispatch, every lane runs unconditionally, so
        # the step is skipped and its
        # (empty) outputs are never consulted.
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # `shared` is an anchor, not a lane: anything that can change what ANY
          # lane means re-runs every lane.
          #
          # The rule is deliberately broad, because the failure mode is silent:
          # a file in no filter means a PR touching only that file runs zero
          # lanes, gets a green required check, and — since push-to-main then
          # produces another all-skipped green run — satisfies the deploy gate
          # and ships. Every entry below was previously uncovered, including the
          # Dockerfile, entrypoint.sh, the lint/dead-code rulesets, the CVE
          # suppression list, and the file that decides which backend tests run
          # under Node instead of workerd.
          #
          # Docs and licence files stay uncovered on purpose: a docs-only change
          # legitimately runs nothing.
          filters: |
            shared: &shared
              - '.github/workflows/test.yml'
              - '.github/actions/**'
              - 'scripts/ci/**'
              - 'package.json'
              - 'package-lock.json'
              - 'vitest.node-suite.mjs'
              - 'vitest.node.config.ts'
              - '.oxlintrc.json'
              - 'knip.json'
              - 'Dockerfile'
              - 'entrypoint.sh'
              - '.dockerignore'
              - '.trivyignore'
              - '.cache-bust'
            backend:
              - *shared
              - 'src/**'
              - 'scripts/**'
              - 'preseed/**'
              - 'wrangler.toml'
              - 'vitest.config.ts'
              - 'tsconfig.json'
            webui:
              - *shared
              - 'web-ui/**'
            landing:
              - *shared
              - 'landing/**'
              - 'src/lib/design-ready.ts'
            pi:
              - '.github/workflows/test.yml'
              - '.github/actions/install-deps/**'
              - 'package.json'
              - 'package-lock.json'
              - 'preseed/agents/pi/**'
              - 'src/lib/agent-seed.generated.ts'
              - 'scripts/agent-seed-core.mjs'
              - 'scripts/materialize-agent-seed.mjs'
              - 'scripts/measure-pi-runtime-context.mjs'
              - 'scripts/pi-prompt-contract.mjs'
              - 'scripts/verify-pi-prompt.mjs'
            ide:
              - *shared
              - 'host/package.json'
              - 'host/package-lock.json'
              - 'host/tsconfig.json'
              - 'host/src/**'
              - 'openvscode/**'
              - 'preseed/**'
              - 'src/lib/agent-seed.generated.ts'
              - 'scripts/browser-ide-ui-state.py'
              - 'scripts/browser-ide-extensions.py'
              - 'scripts/materialize-agent-seed.mjs'
              - 'scripts/patch-context-mode-bundles.mjs'
              - 'scripts/ci/smoke-openvscode-sidebar-image.mjs'
            host:
              - *shared
              # host/__tests__ asserts on the STRUCTURE of workflows other than
              # test.yml: deploy-requires-tests.test.js and
              # workflow-deploy-max-instances.test.js read deploy.yml,
              # zizmor-version-lockstep.test.js reads zizmor.yml,
              # workflow-stress-test.test.js reads stress-test.yml. Without
              # '.github/**' here, a PR editing only deploy.yml skips this lane,
              # so the guard written specifically to make that edit visible never
              # runs. A test that can be disarmed by editing the file it guards
              # is not a guard.
              - '.github/**'
              - 'host/**'
              - 'preseed/**'
              - 'scripts/browser-ide-ui-state.py'
              # browser-ide-extensions.py is guarded by
              # host/__tests__/browser-ide-extensions.test.js; without it here a PR
              # editing only that script skips the lane that tests it.
              - 'scripts/browser-ide-extensions.py'
              # Shared seed compiler and release-contract behavior is exercised
              # by host/__tests__/agent-seed-{core,release}.test.js.
              - 'scripts/agent-seed-core.mjs'
              - 'scripts/agent-seed-core.d.mts'
              - 'scripts/agent-seed-release.mjs'
              - 'scripts/agent-seed-release.d.mts'
              - 'scripts/agent-seed-release-limits.mjs'
              - 'scripts/agent-seed-release-limits.d.mts'
            workflows:
              - '.github/**'
              - 'scripts/ci/workflow-tool-pins.mjs'

      # GitHub's pull-request files API can return diff/not_available for a
      # large generated graph even though the exact commits are checked out.
      # Fail safe by proving both commit identities through local git, recording
      # the changed-file set for diagnostics, and selecting every lane. This
      # over-selects work but can never turn an unavailable API diff into green
      # skipped coverage.
      - id: filter_fallback
        if: steps.filter.outcome == 'failure'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/ci/path-filter-fallback.sh

  quality:
    name: Quality (lint / knip / audit)
    needs: changes
    # `host` is in this list because the bash -n syntax gate below covers every
    # tracked *.sh, and the `host` filter is the only one matching a change that
    # touches host/** or .github/** alone — those PRs previously ran the host
    # lane but not this one, so the syntax check never saw them. (preseed/** is
    # already in the `backend` filter, so preseed-only PRs were always covered;
    # an earlier version of this comment claimed otherwise and was wrong.)
    if: >-
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.webui == 'true' ||
      needs.changes.outputs.host == 'true' ||
      needs.changes.outputs.ide == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Shell syntax check
        # Nothing in this repository has ever parsed entrypoint.sh — 3181 lines
        # running as PID 1 in every session container, with `set -euo pipefail`.
        # It is in exactly the position container-image.yml was in when an
        # unparseable run: block shipped and CI stayed green: built on the deploy
        # path, never executed by any lane. shellcheck was enabled for .github/**
        # after that; this covers the rest of the tree.
        #
        # `bash -n` only, not shellcheck: a syntax error is unambiguously a bug,
        # so the gate has no false positives and needs no severity policy. It
        # would have caught the class that motivated it.
        run: |
          set -euo pipefail
          mapfile -t SCRIPTS < <(git ls-files '*.sh')
          if [ ${#SCRIPTS[@]} -eq 0 ]; then
            echo "::error::No shell scripts found — this check is looking in the wrong place."
            exit 1
          fi
          failed=0
          for f in "${SCRIPTS[@]}"; do
            if ! bash -n "$f" 2>/tmp/shellsyntax.err; then
              echo "::error file=${f}::$(head -1 /tmp/shellsyntax.err)"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] && echo "Parsed ${#SCRIPTS[@]} shell script(s), all valid."
          exit $failed

      - name: Agent seed generator drift guard
        # The committed src/lib/agent-seed.generated.ts must equal a fresh generation
        # from preseed/. `pretest` regenerates it during `npm test`, so a stale committed
        # copy would silently ship OLD extension bytes to R2/containers (the deploy-seeding
        # path embeds this file). Fail fast if the generator output drifts from what is
        # committed. The generator uses only Node builtins, so it needs no node_modules.
        run: |
          node scripts/generate-agent-seed.mjs
          git diff --exit-code src/lib/agent-seed.generated.ts \
            || { echo "::error::agent-seed.generated.ts is stale — run 'npm run generate:agent-seed' and commit the result"; exit 1; }

      - uses: ./.github/actions/install-deps
        with:
          key-prefix: root

      - uses: ./.github/actions/install-deps
        with:
          directory: web-ui
          key-prefix: webui

      - name: Lint backend
        run: npm run lint

      - name: Lint frontend
        run: npm run lint
        working-directory: web-ui

      - name: Dead code check (backend)
        run: npm run knip

      - name: Dead code check (frontend)
        run: npm run knip
        working-directory: web-ui

      - name: Security audit (backend)
        run: npm audit --package-lock-only --audit-level=high --omit=dev

      - name: Security audit (frontend)
        run: npm audit --package-lock-only --audit-level=high --omit=dev
        working-directory: web-ui

  typecheck:
    name: Typecheck
    needs: changes
    if: >-
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.webui == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - uses: ./.github/actions/install-deps
        with:
          key-prefix: root

      - uses: ./.github/actions/install-deps
        with:
          directory: web-ui
          key-prefix: webui

      - name: Generate Workers runtime types
        run: npx wrangler types

      - name: Type check backend
        run: npm run typecheck
        timeout-minutes: 5

      - name: Type check frontend
        run: npm run typecheck
        working-directory: web-ui
        timeout-minutes: 5

  backend-tests:
    name: Backend tests (${{ matrix.slug }})
    needs: changes
    if: >-
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.backend == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix:
        # Run 33339769228 supplies current per-file durations. With the calibrated
        # 1.6-second per-file Workers startup cost, longest-first assignment targets
        # twelve roughly 35-second groups plus Node to shorten the backend critical path.
        include:
          - { balance-group: '1/12', slug: shard-1, script: test, tolerate-pool-crash: 'true', pre-run: '', coverage: 'true' }
          - { balance-group: '2/12', slug: shard-2, script: test, tolerate-pool-crash: 'true', pre-run: '', coverage: 'true' }
          - { balance-group: '3/12', slug: shard-3, script: test, tolerate-pool-crash: 'true', pre-run: '', coverage: 'true' }
          - { balance-group: '4/12', slug: shard-4, script: test, tolerate-pool-crash: 'true', pre-run: '', coverage: 'true' }
          - { balance-group: '5/12', slug: shard-5, script: test, tolerate-pool-crash: 'true', pre-run: '', coverage: 'true' }
          - { balance-group: '6/12', slug: shard-6, script: test, tolerate-pool-crash: 'true', pre-run: '', coverage: 'true' }
          - { balance-group: '7/12', slug: shard-7, script: test, tolerate-pool-crash: 'true', pre-run: '', coverage: 'true' }
          - { balance-group: '8/12', slug: shard-8, script: test, tolerate-pool-crash: 'true', pre-run: '', coverage: 'true' }
          - { balance-group: '9/12', slug: shard-9, script: test, tolerate-pool-crash: 'true', pre-run: '', coverage: 'true' }
          - { balance-group: '10/12', slug: shard-10, script: test, tolerate-pool-crash: 'true', pre-run: '', coverage: 'true' }
          - { balance-group: '11/12', slug: shard-11, script: test, tolerate-pool-crash: 'true', pre-run: '', coverage: 'true' }
          - { balance-group: '12/12', slug: shard-12, script: test, tolerate-pool-crash: 'true', pre-run: '', coverage: 'true' }
          - { balance-group: '', slug: node, script: 'test:node', tolerate-pool-crash: 'false', pre-run: 'npm run pretest', coverage: 'false' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - uses: ./.github/actions/install-deps
        with:
          key-prefix: root

      - name: Create assets directory (wrangler.toml requires web-ui/dist)
        run: mkdir -p web-ui/dist

      - name: Run suite (fail-closed gate)
        uses: ./.github/actions/vitest-suite
        with:
          balance-group: ${{ matrix.balance-group }}
          script: ${{ matrix.script }}
          artifact-name: backend-${{ matrix.slug }}
          pre-run: ${{ matrix.pre-run }}
          tolerate-pool-crash: ${{ matrix.tolerate-pool-crash }}
          coverage: ${{ matrix.coverage }}

  workflow-audit:
    name: Workflow audit
    needs: changes
    if: >-
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the zizmor pin
        id: zizmor-pin
        run: node scripts/ci/workflow-tool-pins.mjs github-output zizmor >> "$GITHUB_OUTPUT"

      - name: Cache zizmor archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/codeflare/zizmor-${{ steps.zizmor-pin.outputs.version }}.tar.gz
          key: ${{ runner.os }}-${{ runner.arch }}-zizmor-${{ steps.zizmor-pin.outputs.version }}-${{ steps.zizmor-pin.outputs.sha256 }}

      - name: Run zizmor (checksum-pinned binary)
        # zizmor.yml uploads SARIF to code scanning and is informational by
        # design — findings there notify, they do not block. This step is the
        # gate: it is part of the required `test` context, and zizmor exits 12
        # when any finding survives (verified; 0 when clean), so a new workflow
        # vulnerability fails the merge instead of landing and being noticed
        # later in an alert list.
        #
        # Own binary rather than the action: the action's failure semantics
        # depend on whether it is uploading SARIF, and a gate must not be
        # ambiguous about when it fires. Upstream publishes no checksum file,
        # so this SHA256 was computed from the release artifact and pinned in
        # .github/workflow-tool-pins.json.
        env:
          ZIZMOR_VERSION: ${{ steps.zizmor-pin.outputs.version }}
          ZIZMOR_SHA256: ${{ steps.zizmor-pin.outputs.sha256 }}
          ZIZMOR_ARCHIVE: ${{ runner.tool_cache }}/codeflare/zizmor-${{ steps.zizmor-pin.outputs.version }}.tar.gz
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$ZIZMOR_ARCHIVE")"
          if [ ! -f "$ZIZMOR_ARCHIVE" ]; then
            curl -fsSL --retry 3 --retry-all-errors --max-time 120 -o "${ZIZMOR_ARCHIVE}.tmp" \
              "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
            mv "${ZIZMOR_ARCHIVE}.tmp" "$ZIZMOR_ARCHIVE"
          fi
          echo "${ZIZMOR_SHA256}  ${ZIZMOR_ARCHIVE}" | sha256sum -c -
          # The checksum above is self-certified: the bump job hashed the same
          # download it then committed as the trusted pin, so it only protects
          # against tampering AFTER the bump. Compromise the release on bump day
          # and your hash gets pinned — after which your binary gates every PR
          # for workflow vulnerabilities and can report clean. zizmor publishes
          # SLSA provenance for its release artifacts, which is an INDEPENDENT
          # signal: it attests the artifact was built by zizmorcore's own
          # workflow, which a substituted binary cannot forge.
          # Bounded retry: this is the one call here with no offline mode, and
          # it feeds the required `test` context. An attestation API blip must
          # not fail a merge on infrastructure rather than on findings — the
          # same reasoning that made the zizmor audit itself offline.
          for attempt in 1 2 3; do
            if gh attestation verify "$ZIZMOR_ARCHIVE" --repo zizmorcore/zizmor; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::attestation verification failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 5))
          done
          tar -xzf "$ZIZMOR_ARCHIVE" -C /tmp zizmor
          # Offline for the same reason zizmor.yml is: the online audit dies
          # fatally when the advisory API blips, which would fail merges on
          # infrastructure rather than on findings.
          /tmp/zizmor --no-online-audits --format plain .github/

      - name: Resolve the actionlint pin
        id: actionlint-pin
        run: node scripts/ci/workflow-tool-pins.mjs github-output actionlint >> "$GITHUB_OUTPUT"

      - name: Cache actionlint archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/codeflare/actionlint-${{ steps.actionlint-pin.outputs.version }}.tar.gz
          key: ${{ runner.os }}-${{ runner.arch }}-actionlint-${{ steps.actionlint-pin.outputs.version }}-${{ steps.actionlint-pin.outputs.sha256 }}

      - name: Run actionlint (checksum-pinned binary)
        # Catches workflow-file errors GitHub only surfaces as jobless
        # "completed/failure" validation runs (duplicate mapping keys, invalid
        # expressions) before they cost a push round.
        #
        # shellcheck used to be off entirely, on the theory that zizmor owned
        # script hygiene and shellcheck's style findings would fail the lane on
        # nits. That also switched off SYNTAX checking, and a `run:` block in
        # container-image.yml shipped with an unbalanced pipeline that made the
        # script unparseable. Nothing caught it: that file only executes during a
        # deploy, so the branch was green while the container build was dead.
        # It is now on at --severity=error, which keeps every style and warning
        # nit out of the gate while still failing on the class of defect that
        # cannot be anything but a bug. pyflakes stays off (no python in these
        # workflows).
        env:
          ACTIONLINT_VERSION: ${{ steps.actionlint-pin.outputs.version }}
          ACTIONLINT_SHA256: ${{ steps.actionlint-pin.outputs.sha256 }}
          ACTIONLINT_ARCHIVE: ${{ runner.tool_cache }}/codeflare/actionlint-${{ steps.actionlint-pin.outputs.version }}.tar.gz
          SHELLCHECK_OPTS: '--severity=error'
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$ACTIONLINT_ARCHIVE")"
          if [ ! -f "$ACTIONLINT_ARCHIVE" ]; then
            curl -fsSL --retry 3 --retry-all-errors --max-time 120 -o "${ACTIONLINT_ARCHIVE}.tmp" \
              "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
            mv "${ACTIONLINT_ARCHIVE}.tmp" "$ACTIONLINT_ARCHIVE"
          fi
          echo "${ACTIONLINT_SHA256}  ${ACTIONLINT_ARCHIVE}" | sha256sum -c -
          tar -xzf "$ACTIONLINT_ARCHIVE" -C /tmp actionlint
          /tmp/actionlint -color -pyflakes=

  bundle-size:
    name: Bundle size
    needs: changes
    if: >-
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.webui == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - uses: ./.github/actions/install-deps
        with:
          key-prefix: root

      - name: Create assets directory (wrangler.toml requires web-ui/dist)
        # The bundle being measured is the Worker script; the assets directory
        # only has to exist for wrangler to resolve its config.
        run: mkdir -p web-ui/dist

      - name: Measure the Worker bundle
        # --dry-run needs no credentials and no network: it bundles exactly what
        # a real deploy would upload and prints the size Cloudflare enforces.
        #
        # But `image = "./Dockerfile"` makes wrangler BUILD the container image
        # as part of the dry run — pulling a 50MB base layer and burning ~3
        # minutes to produce something container-image.yml already builds, scans,
        # and content-addresses. The size line is printed before that starts and
        # does not depend on it, so point the image at a registry reference for
        # the measurement. The config lives in the repo root because wrangler
        # resolves `main` and the assets dir relative to the config file.
        run: |
          set -euo pipefail
          sed 's|^image = "\./Dockerfile"$|image = "registry.example.invalid/size-check:latest"|' \
            wrangler.toml > wrangler.size-check.toml
          if ! grep -q 'registry.example.invalid/size-check' wrangler.size-check.toml; then
            echo "::error::the containers image line in wrangler.toml no longer matches the size-check patch — it would rebuild the image (slow) instead of measuring. Update the sed in test.yml."
            exit 1
          fi
          npx wrangler deploy --dry-run --outdir /tmp/worker-bundle \
            --config wrangler.size-check.toml 2>&1 | tee /tmp/wrangler-dry-run.log
        env:
          NO_COLOR: '1'

      - name: Check against the budget
        run: node scripts/ci/check-bundle-size.mjs /tmp/wrangler-dry-run.log

  coverage-backend:
    name: Coverage merge (backend)
    needs: [changes, backend-tests]
    if: >-
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.backend == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/merge-coverage
        with:
          artifact-pattern: 'backend-shard-*'
          artifact-prefix: 'backend-shard'
          expected-shards: '12'
          slug: backend
          package-root: .
          changed-base: ${{ github.event.pull_request.base.sha }}
          changed-line-threshold: '80'
          statements-threshold: '88'
          branches-threshold: '80'
          functions-threshold: '89'
          lines-threshold: '89'

  coverage-frontend:
    name: Coverage merge (frontend)
    needs: [changes, frontend-tests]
    if: >-
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.webui == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/merge-coverage
        with:
          artifact-pattern: 'frontend-shard-*'
          artifact-prefix: 'frontend-shard'
          expected-shards: '3'
          slug: frontend
          package-root: web-ui
          changed-base: ${{ github.event.pull_request.base.sha }}
          changed-line-threshold: '70'
          changed-line-exclusions: >-
            web-ui/src/components/admin/ActivityPage.tsx,
            web-ui/src/components/admin/AdministrationLayout.tsx,
            web-ui/src/components/admin/AdministrationOverview.tsx,
            web-ui/src/components/admin/AnalyticsPage.tsx,
            web-ui/src/components/admin/AnalyticsUserDetail.tsx,
            web-ui/src/components/admin/EnvironmentAreaFields.tsx,
            web-ui/src/components/admin/EnvironmentIndex.tsx,
            web-ui/src/components/admin/ReportsPage.tsx,
            web-ui/src/components/admin/environment-areas.ts
          statements-threshold: '75'
          branches-threshold: '63'
          functions-threshold: '75'
          lines-threshold: '77'

  frontend-tests:
    name: Frontend tests (${{ matrix.slug }})
    needs: changes
    if: >-
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.webui == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 3
      # 129 jsdom test files took 76s in one job — the longest lane in the run
      # once the backend was sharded. Same reasoning as the backend split: the
      # cost is per-file and per-process, so it divides across runners.
      matrix:
        include:
          - shard: '1/3'
            slug: shard-1
          - shard: '2/3'
            slug: shard-2
          - shard: '3/3'
            slug: shard-3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - uses: ./.github/actions/install-deps
        with:
          directory: web-ui
          key-prefix: webui

      - name: Build frontend
        # Not a test dependency — it is here so a broken production build fails
        # a PR. Only one shard needs to pay for it.
        if: matrix.slug == 'shard-1'
        run: npm run build
        working-directory: web-ui

      - name: Run suite (fail-closed gate)
        uses: ./.github/actions/vitest-suite
        with:
          working-directory: web-ui
          shard: ${{ matrix.shard }}
          artifact-name: frontend-${{ matrix.slug }}
          coverage: 'true'

  landing-tests:
    name: Landing tests
    needs: changes
    if: >-
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.landing == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - uses: ./.github/actions/install-deps
        with:
          directory: landing
          key-prefix: landing

      - name: Build landing
        # Same reason the web-ui shard builds (see frontend-tests): landing's
        # vitest uses getViteConfig for Container-API component rendering, which
        # does not exercise astro routing, content collections or adapter output.
        # Without this, a change that breaks `astro build` passes PR Checks green
        # and only surfaces in deploy.yml's build-worker job — after the gate that
        # was supposed to catch it already approved the merge.
        run: npm run build
        working-directory: landing

      - name: Run suite (fail-closed gate)
        # Container-API render tests + pure-logic unit tests (landing/README.md)
        uses: ./.github/actions/vitest-suite
        with:
          working-directory: landing
          artifact-name: landing

  pi-prompt:
    name: Pi prompt verification
    needs: changes
    if: >-
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.pi == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - uses: ./.github/actions/install-deps
        with:
          key-prefix: root

      - uses: ./.github/actions/install-deps
        with:
          directory: preseed/agents/pi
          key-prefix: pi-prompt
          ignore-scripts: 'true'

      - name: Verify real Pi prompt budget
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/pi-runtime"
          mkdir -p "$RUNNER_TEMP/pi-runtime/npm"
          ln -s "$GITHUB_WORKSPACE/preseed/agents/pi/node_modules" "$RUNNER_TEMP/pi-runtime/npm/node_modules"
          node -e 'const fs=require("fs");const p=require("./preseed/agents/pi/package.json");const packages=Object.entries(p.dependencies).map(([name,version])=>name==="context-mode"?{source:`npm:${name}@${version}`,extensions:[],skills:[]}:`npm:${name}@${version}`);fs.writeFileSync(process.argv[1],JSON.stringify({packages}));' "$RUNNER_TEMP/pi-runtime/settings.json"
          node scripts/verify-pi-prompt.mjs \
            --generated src/lib/agent-seed.generated.ts \
            --runtime-agent-dir "$RUNNER_TEMP/pi-runtime" \
            --pi-package-root preseed/agents/pi/node_modules/@earendil-works/pi-coding-agent \
            --report "$RUNNER_TEMP/pi-prompt-report.json"

      - name: Measure real Pi initial tool exposure
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/pi-seed" "$RUNNER_TEMP/pi-isolated"
          mkdir -p "$RUNNER_TEMP/pi-isolated"
          node scripts/materialize-agent-seed.mjs \
            --seed src/lib/agent-seed.generated.ts \
            --out "$RUNNER_TEMP/pi-seed"
          for mode in default advanced; do
            agent_dir="$RUNNER_TEMP/pi-seed/$mode/.pi/agent"
            cp "$RUNNER_TEMP/pi-runtime/settings.json" "$agent_dir/settings.json"
            mkdir -p "$agent_dir/npm"
            ln -s "$GITHUB_WORKSPACE/preseed/agents/pi/node_modules" "$agent_dir/npm/node_modules"
            (
              cd "$RUNNER_TEMP/pi-isolated"
              PI_AGENT_DIR="$agent_dir" \
              PI_CODING_AGENT_ROOT="$GITHUB_WORKSPACE/preseed/agents/pi/node_modules/@earendil-works/pi-coding-agent" \
                node "$GITHUB_WORKSPACE/scripts/measure-pi-runtime-context.mjs" \
                --agent-dir "$agent_dir" \
                > "$RUNNER_TEMP/pi-runtime-context-$mode.json"
            )
          done

      - name: Verify real Pi runtime reports
        env:
          CODEFLARE_PI_REPORT_ROOT: ${{ runner.temp }}
        run: node --test preseed/agents/pi/test/runtime-projection.test.mjs

      - name: Upload Pi prompt reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-prompt-report-pr
          path: |
            ${{ runner.temp }}/pi-prompt-report.json
            ${{ runner.temp }}/pi-runtime-context-default.json
            ${{ runner.temp }}/pi-runtime-context-advanced.json
          retention-days: 14
          if-no-files-found: error

  host-tests:
    name: Host tests (${{ matrix.slug }})
    needs: changes
    if: >-
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.host == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        # Run 32890939456 measured the five native partitions at 7, 41, 9, 11,
        # and 28 seconds. These groups retain exact one-pass coverage while
        # balancing measured work at approximately 49 and 48 seconds.
        include:
          - { shards: '1/5 2/5', slug: shard-1 }
          - { shards: '3/5 4/5 5/5', slug: shard-2 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - uses: ./.github/actions/install-deps
        # wrangler-static-assets.test.js imports 'wrangler' from the ROOT
        # node_modules (module lookup walks up from host/__tests__).
        with:
          key-prefix: root

      - uses: ./.github/actions/install-deps
        with:
          directory: host
          key-prefix: host

      - name: Create assets directory (wrangler.toml requires web-ui/dist)
        # wrangler-static-assets.test.js reads wrangler.toml via unstable_readConfig,
        # which resolves the [assets] directory; without the dir the config loads
        # without assets and the test fails.
        run: mkdir -p web-ui/dist

      - name: Build host (TypeScript)
        run: npm run build
        working-directory: host

      - name: Cache rclone archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/codeflare/rclone-v1.73.5-linux-amd64.zip
          key: ${{ runner.os }}-${{ runner.arch }}-rclone-v1.73.5-932cf4b7484de74d82b4875488e0009469fd21f9904673385184520fe11a1bf0

      - name: Install rclone for sync-filter behavioral tests
        env:
          RCLONE_RELEASE_VERSION: 1.73.5
          RCLONE_SHA256: 932cf4b7484de74d82b4875488e0009469fd21f9904673385184520fe11a1bf0
          RCLONE_ARCHIVE: ${{ runner.tool_cache }}/codeflare/rclone-v1.73.5-linux-amd64.zip
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RCLONE_ARCHIVE")"
          if [ ! -f "$RCLONE_ARCHIVE" ]; then
            curl -fsSL --retry 3 --retry-all-errors --max-time 120 -o "${RCLONE_ARCHIVE}.tmp" \
              "https://downloads.rclone.org/v${RCLONE_RELEASE_VERSION}/rclone-v${RCLONE_RELEASE_VERSION}-linux-amd64.zip"
            mv "${RCLONE_ARCHIVE}.tmp" "$RCLONE_ARCHIVE"
          fi
          echo "${RCLONE_SHA256}  ${RCLONE_ARCHIVE}" | sha256sum -c -
          rm -rf "$RUNNER_TEMP/rclone"
          unzip -q "$RCLONE_ARCHIVE" -d "$RUNNER_TEMP/rclone"
          sudo install -m 0755 \
            "$RUNNER_TEMP/rclone/rclone-v${RCLONE_RELEASE_VERSION}-linux-amd64/rclone" \
            /usr/local/bin/rclone
          rclone version

      - name: Select host tests
        # The exclusion list and the *.test.js glob are the two ways a host test
        # can silently stop running, so the selection is computed once, here, and
        # its invariants are asserted by host/__tests__/host-test-inventory.test.js
        # (which runs inside this very selection). This step is the backstop that
        # test cannot be: if the selection came out empty, no test ran at all and
        # a green lane would mean nothing.
        working-directory: host/__tests__
        run: |
          set -euo pipefail
          # Whole-line match (-x) so an entry can never swallow a similarly named
          # test and a stray blank line excludes nothing.
          # Strip comments and blanks first: the exclusion file documents WHY each
          # entry is excluded, and a `#` line handed to grep -vxF would be a
          # filename that matches nothing (harmless) while the inventory test
          # would reject it as naming no test.
          #
          # Trim before filtering, because host-test-inventory.test.js trims too.
          # Without this the two disagree on ` foo.test.js`: the test accepts it
          # as an exclusion and asserts the file exists, while -vxF here matches
          # nothing and the lane runs it anyway.
          sed -e 's/[[:space:]]*$//' -e 's/^[[:space:]]*//' ci-excluded.txt \
            | grep -vE '^(#|$)' > "$RUNNER_TEMP/excluded.txt"
          SELECTED=$(printf '%s\n' *.test.js | sort | grep -vxFf "$RUNNER_TEMP/excluded.txt" || true)
          COUNT=$(printf '%s\n' "$SELECTED" | grep -c . || true)
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::Host test selection is empty — the lane would pass having run nothing."
            exit 1
          fi
          printf '%s\n' "$SELECTED" | sed 's|^|host/__tests__/|' > "$RUNNER_TEMP/host-tests.txt"
          echo "Running $COUNT host tests ($(grep -c . "$RUNNER_TEMP/excluded.txt") excluded)."

      - name: Run host hook tests (node:test)
        # host/__tests__/ci-excluded.txt lists tests that genuinely cannot run
        # here. The file list comes from the audited selection step above. Each
        # native 1/5 partition appears exactly once across the two measured groups.
        env:
          SHARDS: ${{ matrix.shards }}
        run: |
          set -euo pipefail
          part=0
          for shard in $SHARDS; do
            part=$((part + 1))
            xargs -a "$RUNNER_TEMP/host-tests.txt" \
              node --experimental-test-module-mocks --test --test-timeout=60000 \
                --test-shard="$shard" \
                --test-reporter=spec --test-reporter-destination=stdout \
                --test-reporter=junit --test-reporter-destination="$RUNNER_TEMP/host-report-${part}.xml"
          done

          # node --test exits 0 when selected files define no tests. Count actual
          # testcases across every constituent partition rather than trusting exit 0.
          COUNT=$(grep -h -c '<testcase' "$RUNNER_TEMP"/host-report-*.xml | awk '{ total += $1 } END { print total + 0 }')
          if [ "${COUNT:-0}" -lt 1 ]; then
            echo "::error::The host lane executed 0 tests. It ran the files it selected and none of them asserted anything."
            exit 1
          fi
          echo "Host lane executed ${COUNT} tests."
        timeout-minutes: 5

  browser-ide:
    name: Browser IDE agents
    needs: changes
    if: >-
      needs.changes.outputs.full == 'true' ||
      needs.changes.outputs.ide == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.21.1'

      - uses: ./.github/actions/install-deps
        with:
          directory: openvscode/agent-sidebar
          key-prefix: browser-ide

      - name: Audit pinned extension dependencies and licenses
        run: npm audit --audit-level=high && npm run check:dependencies
        working-directory: openvscode/agent-sidebar

      - name: Typecheck extension
        run: npm run typecheck
        working-directory: openvscode/agent-sidebar

      - name: Build extension and verify deterministic package bytes
        working-directory: openvscode/agent-sidebar
        run: |
          set -euo pipefail
          rm -rf dist
          NODE_ENV=production npm run build
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/sidebar-dist-first.sha256"
          test -s "$RUNNER_TEMP/sidebar-dist-first.sha256"
          rm -rf dist
          NODE_ENV=production npm run build
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/sidebar-dist-second.sha256"
          diff -u "$RUNNER_TEMP/sidebar-dist-first.sha256" "$RUNNER_TEMP/sidebar-dist-second.sha256"

      - name: Run Browser IDE agent suite (fail-closed gate)
        uses: ./.github/actions/vitest-suite
        with:
          working-directory: openvscode/agent-sidebar
          artifact-name: browser-ide


  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          license-check: 'true'
          vulnerability-check: 'true'
          show-openssf-scorecard: 'true'
          # GitHub's dependency graph reports null licenses for these six
          # platform artifacts even though their exact lock metadata is
          # Apache-2.0. Versioned purls make every future Codex bump re-enter
          # review instead of inheriting an evergreen exception.
          allow-dependencies-licenses: >-
            pkg:npm/@openai/codex-darwin-arm64@0.147.0-darwin-arm64,
            pkg:npm/@openai/codex-darwin-x64@0.147.0-darwin-x64,
            pkg:npm/@openai/codex-linux-arm64@0.147.0-linux-arm64,
            pkg:npm/@openai/codex-linux-x64@0.147.0-linux-x64,
            pkg:npm/@openai/codex-win32-arm64@0.147.0-win32-arm64,
            pkg:npm/@openai/codex-win32-x64@0.147.0-win32-x64

  summary:
    # Check name "test" is the required branch-protection context on main —
    # renaming this job's `name` breaks the merge gate.
    name: test
    needs:
      - changes
      - quality
      - typecheck
      - workflow-audit
      - bundle-size
      - coverage-backend
      - coverage-frontend
      - backend-tests
      - frontend-tests
      - landing-tests
      - pi-prompt
      - host-tests
      - browser-ide
      - dependency-review
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: always()
        with:
          persist-credentials: false

      - name: Aggregate lane results
        env:
          RESULTS: ${{ toJSON(needs) }}
          FULL: ${{ needs.changes.outputs.full }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          BAD=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')
          if [ -n "$BAD" ]; then
            echo "::error::Failed lanes: $(echo "$BAD" | tr '\n' ' ')"
            exit 1
          fi

          # `skipped` counts as a pass ONLY when the diff filter actually ran and
          # decided the lane was unaffected. When it did not run (FULL=true:
          # merge_group, schedule, dispatch) every lane was supposed to execute,
          # so a skip means a gating expression is wrong — and silently passing
          # it is how a merge queue ends up green having run nothing. Dependency
          # review alone opts out because it is defined only for pull requests.
          if [ "$FULL" = "true" ]; then
            EXPECTED_SKIPS='dependency-review'
            SKIPPED=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result == "skipped") | .key')
            for lane in $SKIPPED; do
              case " $EXPECTED_SKIPS " in
                *" $lane "*) ;;
                *)
                  echo "::error::Lane '$lane' was skipped on a full run (no diff filter ran, so every lane should have executed). Its if: condition is wrong — a skipped lane cannot be allowed to pass here."
                  exit 1
                  ;;
              esac
            done
          fi
          echo "All lanes green (skipped = not affected)"

      - name: Download suite reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '{backend-*,frontend-*,landing,browser-ide}'
          path: /tmp/test-artifacts

      - name: Reconcile suite coverage against the tree
        # Fail-closed: every test file in every suite's tree must appear in some
        # report. A per-run gate can only vouch for files it was handed, so a file
        # lost to a mis-shard or a worker dying mid-run would otherwise pass
        # silently. Lane results distinguish "path filter skipped this suite" from
        # "the suite ran and its reports vanished". No `always()` — if a lane
        # already failed above, this job is done deciding.
        env:
          LANES: >-
            {"backend":"${{ needs.backend-tests.result }}",
             "frontend":"${{ needs.frontend-tests.result }}",
             "landing":"${{ needs.landing-tests.result }}",
             "browser-ide":"${{ needs.browser-ide.result }}"}
        run: node scripts/ci/check-suite-completeness.mjs /tmp/test-artifacts "$LANES"

      - name: Write exact tested-tree receipt
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          tested_commit=$(git rev-parse HEAD)
          tested_tree=$(git rev-parse 'HEAD^{tree}')
          jq -n \
            --arg repository "$REPOSITORY" \
            --arg runId "$RUN_ID" \
            --argjson runAttempt "$RUN_ATTEMPT" \
            --arg testedCommit "$tested_commit" \
            --arg testedTree "$tested_tree" \
            '{schema:"codeflare.pr-checks-receipt.v3",repository:$repository,workflowPath:".github/workflows/test.yml",runId:$runId,runAttempt:$runAttempt,testedCommit:$testedCommit,testedTree:$testedTree}' \
            > /tmp/pr-checks-receipt.json

      - name: Upload exact tested-tree receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-checks-receipt-${{ github.run_id }}
          path: /tmp/pr-checks-receipt.json
          retention-days: 7
          if-no-files-found: error

      - name: Publish test-result table
        # Reporting only — the aggregate step above already decided the
        # outcome, so a render hiccup must never flip the required context.
        if: always()
        continue-on-error: true
        run: node scripts/ci/render-test-summary.mjs /tmp/test-artifacts >> "$GITHUB_STEP_SUMMARY"
