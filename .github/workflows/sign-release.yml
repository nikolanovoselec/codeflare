name: Sign Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-version release tag to sign
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sign-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  sign:
    name: Sign release assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate release source
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$SOURCE_REF" != "refs/heads/main" ]]; then
            echo "::error::recovery signing must be dispatched from main"
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag must match vMAJOR.MINOR.PATCH"
            exit 1
          fi
          release_json="$(gh release view "$RELEASE_TAG" --json tagName,isDraft)"
          jq -e --arg tag "$RELEASE_TAG" \
            '.tagName == $tag and .isDraft == false' <<< "$release_json" >/dev/null
          release_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "::error::$RELEASE_TAG does not identify a commit reachable from main"
            exit 1
          fi
          printf 'RELEASE_COMMIT=%s\n' "$release_commit" >> "$GITHUB_ENV"

      - name: Build deterministic release archive
        run: |
          set -euo pipefail
          mkdir -p release-assets
          archive="release-assets/codeflare-$RELEASE_TAG.tar.gz"
          git archive --format=tar --prefix="codeflare-$RELEASE_TAG/" "$RELEASE_COMMIT" | gzip -n > "$archive"
          (
            cd release-assets
            sha256sum "codeflare-$RELEASE_TAG.tar.gz" > SHA256SUMS
          )

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Sign release assets
        run: |
          set -euo pipefail
          for asset in "release-assets/codeflare-$RELEASE_TAG.tar.gz" release-assets/SHA256SUMS; do
            cosign sign-blob --yes --bundle "$asset.sigstore.json" "$asset"
          done

      - name: Attest release assets
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            release-assets/codeflare-v*.tar.gz
            release-assets/SHA256SUMS

      - name: Upload signed release assets
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
