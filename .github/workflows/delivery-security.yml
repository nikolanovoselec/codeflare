# Temporary source-audit evidence; remove before pushing the final PR batch.
name: Delivery source security audit
on:
  push:
    branches: [delivery/preseed-alignment-20261017]
    paths:
      - .github/workflows/delivery-security.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'
      - name: Audit every committed npm lock including development dependencies
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/delivery-audits"
          node --input-type=module <<'RECEIPT'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const paths = execFileSync('git', ['ls-files', '*package-lock.json'], { encoding: 'utf8' }).trim().split('\n');
          writeFileSync(`${process.env.RUNNER_TEMP}/delivery-audits/source-receipt.json`, JSON.stringify({
            sourceSha: process.env.SOURCE_SHA, locks: paths.map(path => ({ path,
              sha256: createHash('sha256').update(readFileSync(path)).digest('hex') })) }) + '\n');
          RECEIPT
          result=0
          while IFS= read -r lock; do
            directory=$(dirname "$lock")
            slug=$(printf '%s' "$lock" | tr '/.' '__')
            set +e
            (cd "$directory" && timeout 90s npm audit --package-lock-only --ignore-scripts --audit-level=high --json --registry=https://registry.npmjs.org) > "$RUNNER_TEMP/delivery-audits/$slug.json" 2> "$RUNNER_TEMP/delivery-audits/$slug.stderr"
            code=$?
            set -e
            printf '%s\t%s\t%s\n' "$lock" "$code" "$slug.json" >> "$RUNNER_TEMP/delivery-audits/results.tsv"
            if [ "$code" -ne 0 ]; then result=1; fi
          done < <(git ls-files '*package-lock.json')
          exit "$result"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: delivery-source-audits-${{ github.sha }}
          path: ${{ runner.temp }}/delivery-audits
          if-no-files-found: error
          retention-days: 3
