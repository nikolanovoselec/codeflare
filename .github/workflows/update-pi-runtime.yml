name: Prepare Pi Runtime Update

# Dependency generation is CI-only. Produce the atomic updater's patch without
# creating branches, committing, publishing, or changing any live runtime.
on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
    paths:
      - .github/workflows/update-pi-runtime.yml

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check whether the verified update is still required
        id: source
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('preseed/npm-tools/package.json', 'utf8'));
          const version = manifest.dependencies['@earendil-works/pi-coding-agent'];
          if (!['1.3.0', '1.4.0'].includes(version)) throw new Error(`Unreviewed Pi source version: ${version}`);
          console.log(`required=${version === '1.3.0'}`);
          NODE

      - name: Generate the verified Pi 1.4.0 update atomically
        if: steps.source.outputs.required == 'true'
        run: node scripts/update-pi-runtime-artifacts.mjs 1.3.0 1.4.0

      - name: Verify runtime and prewarm lockstep
        run: node scripts/verify-pi-lockstep.mjs preseed/npm-tools/package.json preseed/agents/pi/package.json

      - name: Capture generated changes
        if: steps.source.outputs.required == 'true'
        run: |
          git diff --check
          git diff --stat
          git diff --binary > "$RUNNER_TEMP/pi-runtime-update.patch"
          test -s "$RUNNER_TEMP/pi-runtime-update.patch"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.source.outputs.required == 'true'
        with:
          name: pi-runtime-1.4.0-${{ github.run_id }}
          path: ${{ runner.temp }}/pi-runtime-update.patch
          if-no-files-found: error
          retention-days: 7
