name: Prepare Pi Runtime Update

# Dependency generation is CI-only. Produce the atomic updater's patch without
# creating branches, committing, publishing, or changing any live runtime.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Generate the verified Pi 1.4.0 update atomically
        run: node scripts/update-pi-runtime-artifacts.mjs 1.3.0 1.4.0

      - name: Verify lockstep and capture generated changes
        run: |
          node scripts/verify-pi-lockstep.mjs preseed/npm-tools/package.json preseed/agents/pi/package.json
          git diff --check
          git diff --stat
          git diff --binary > "$RUNNER_TEMP/pi-runtime-update.patch"
          test -s "$RUNNER_TEMP/pi-runtime-update.patch"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pi-runtime-1.4.0-${{ github.run_id }}
          path: ${{ runner.temp }}/pi-runtime-update.patch
          if-no-files-found: error
          retention-days: 7
