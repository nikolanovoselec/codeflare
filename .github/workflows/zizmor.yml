name: Zizmor
# Static security audit of the GitHub Actions workflows themselves
# (template injection, pwn-request vectors, unpinned actions, credential
# leaks). Findings upload as SARIF to code scanning — same surface as
# CodeQL/Scorecard. This workflow only RECORDS: the blocking check is the
# `workflow-audit` lane in test.yml, which runs the same pinned zizmor and
# fails the required `test` context on any finding. Splitting them keeps the
# alert history in code scanning while making the gate unambiguous.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

permissions: {}

concurrency:
  # github.ref is the per-PR merge ref for pull_request events, so two PRs
  # sharing one head branch never cancel each other while superseded pushes
  # of the same PR still do.
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # SARIF upload
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reproduce locally with: zizmor .github/workflows
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6599ee8b7a49aef6a770f63d261d214911a7ce02 # v0.6.0
        with:
          # Offline: the online known-vulnerable-actions audit dies fatally
          # ("no audit was performed") whenever the GitHub advisory API blips,
          # failing the whole lane on infrastructure rather than findings.
          online-audits: false
          # The action defaults to `latest`, which floats the security auditor
          # itself — a new zizmor release silently changes what this repo
          # considers acceptable, in either direction. Pinned and bumped by
          # bump-shadow-pins.yml like every other non-Dependabot version.
          #
          # This must stay equal to ZIZMOR_VERSION in test.yml, whose
          # workflow-audit lane is the BLOCKING gate — a SARIF upload produced
          # by a different auditor than the one that gates merges reports
          # findings nobody is required to fix, and misses ones that are.
          # host/__tests__/zizmor-version-lockstep.test.js asserts the equality.
          #
          # The action resolves this version against a digest table baked into
          # the action release, so it can only name a version the PINNED action
          # knows: v0.5.6 + '1.27.0' failed every run with "Unknown version".
          # The bump job reads that table at the pinned SHA rather than taking
          # zizmor's newest release.
          version: '1.27.0'
