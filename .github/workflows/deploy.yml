name: Deploy
# main is the protected production branch; the only push that reaches
# it is a merged PR. workflow_run waits for that PR's "PR Checks" to
# finish on the merge commit and only deploys when it ended green.
# This closes the "we shipped a broken main" window that plain
# `push: [main]` left open when the checks and deploy triggered in
# parallel off the same SHA. workflow_dispatch stays so a stuck
# deploy can be re-run manually, and so integration deploys from
# develop (or any other branch) can still be triggered on demand.
#
# Topology (staged jobs, no test re-run — the workflow_run gate already
# guarantees a green PR Checks run for this exact SHA):
#   prepare ──┬── build-worker (frontend + landing dist artifact)   ──┬── deploy
#             └── container (reusable container-image.yml:            │
#                 input-hash reuse gate → build → scan → push)      ──┘
# deploy = wrangler config mutations + wrangler deploy + bulk secrets +
# post-deploy health smoke + registry prune.
#
# The `registry: dockerhub` input replaces the former deploy-dockerhub.yml
# copy of this file — same pipeline, image pushed to docker.io instead
# (bypass for CF managed-registry connection drops; needs
# DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets and a public Docker Hub repo).
on:
  workflow_run:
    workflows: ['PR Checks']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target'
        type: choice
        options:
          - production
          - integration
          - enterprise
          - enterprise integration
        default: integration
      registry:
        description: 'Container registry (dockerhub = bypass when the CF managed registry drops connections mid-upload)'
        type: choice
        options:
          - cloudflare
          - dockerhub
        default: cloudflare

concurrency:
  group: deploy-${{ ((github.event_name == 'workflow_run' || github.ref == 'refs/heads/main') && (inputs.environment || 'production')) || (inputs.environment == 'enterprise' && 'enterprise') || (inputs.environment == 'enterprise integration' && 'enterprise integration') || 'integration' }}
  cancel-in-progress: true

permissions:
  contents: read

# On workflow_run: only deploy when PR Checks ended green.
# On workflow_dispatch (manual): always run; the production-only-from-main
# guard step still rejects bad input.
#
# The gate `if:` is repeated on EVERY job (not centralized on prepare with
# plain `needs:` chaining) because GitHub Actions treats a job skipped via
# if: as success() for `needs:` resolution — a failed PR Checks would skip
# prepare but downstream needs: would still be satisfied. The gate must sit
# on each job that does real work.
# Two additional workflow_run guards beyond conclusion==success defeat
# the public-repo pwn-request vector. PR Checks fires on both push and
# pull_request to main/develop. A fork PR with a head branch named
# 'main' would pass the outer workflow_run `branches: [main]` filter
# (the filter matches the PR head ref name, not the source repo).
# Without the two extra guards below, jobs would check out the fork's
# untrusted SHA with actions:write perms and access to deploy secrets.
# Hardened as a result of Scorecard DangerousWorkflowID alert #34 audit.
#   workflow_run.event == 'push'                   -- only post-merge runs trigger deploy
#   head_repository.full_name == github.repository -- and only from this repo, never a fork

jobs:
  prepare:
    name: Resolve deploy target
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run'
       && github.event.workflow_run.conclusion == 'success'
       && github.event.workflow_run.event == 'push'
       && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # production is locked to main (the guard step below rejects it elsewhere);
    # enterprise and enterprise integration are separate single-tenant envs that may
    # be deployed from any branch (e.g. develop) for iteration; everything else off
    # non-main -> integration.
    environment: ${{ (github.ref == 'refs/heads/main' && (inputs.environment || 'production')) || (inputs.environment == 'enterprise' && 'enterprise') || (inputs.environment == 'enterprise integration' && 'enterprise integration') || 'integration' }}
    outputs:
      env_name: ${{ (github.ref == 'refs/heads/main' && (inputs.environment || 'production')) || (inputs.environment == 'enterprise' && 'enterprise') || (inputs.environment == 'enterprise integration' && 'enterprise integration') || 'integration' }}
      # On workflow_run: pin to the SHA whose PR Checks just ended green.
      # Without this, actions/checkout falls back to default-branch HEAD at
      # job start time, which can drift if a second push lands on main
      # between the green check and the deploy.
      ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      worker_name: ${{ vars.CLOUDFLARE_WORKER_NAME || 'codeflare' }}
      cache_bust: ${{ vars.CLAUDE_CODE_CACHE_BUSTER == 'active' && github.sha || '' }}
      registry: ${{ inputs.registry || 'cloudflare' }}
    steps:
      # Expression values reach the shell only via env (git refs may contain
      # shell metacharacters; zizmor template-injection).
      - name: Block production deploys from non-main branches
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.environment == 'production'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Production deploys are only allowed from main. Got branch: ${REF}"
          exit 1

      - name: Log resolved parameters
        env:
          ENV_NAME: ${{ (github.ref == 'refs/heads/main' && (inputs.environment || 'production')) || (inputs.environment == 'enterprise' && 'enterprise') || (inputs.environment == 'enterprise integration' && 'enterprise integration') || 'integration' }}
          REF: ${{ github.event.workflow_run.head_sha || github.ref }}
          WORKER: ${{ vars.CLOUDFLARE_WORKER_NAME || 'codeflare' }}
          REGISTRY: ${{ inputs.registry || 'cloudflare' }}
        run: |
          echo "environment: ${ENV_NAME}"
          echo "ref:         ${REF}"
          echo "worker:      ${WORKER}"
          echo "registry:    ${REGISTRY}"

  build-worker:
    name: Build worker assets
    needs: prepare
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run'
       && github.event.workflow_run.conclusion == 'success'
       && github.event.workflow_run.event == 'push'
       && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # See the pwn-request rationale above: the shared gate guarantees this
      # checkout only ever sees already-merged, maintainer-trusted SHAs.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Cache web-ui node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-webui
        with:
          path: web-ui/node_modules
          key: webui-${{ hashFiles('web-ui/package-lock.json') }}
          restore-keys: webui-

      - name: Cache landing node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-landing
        with:
          path: landing/node_modules
          key: landing-${{ hashFiles('landing/package-lock.json') }}
          restore-keys: landing-

      - name: Install web-ui dependencies
        if: steps.cache-webui.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: web-ui

      - name: Install landing dependencies
        if: steps.cache-landing.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: landing

      - name: Build frontend
        run: npm run build
        working-directory: web-ui

      # Landing builds AFTER web-ui: its output lands inside web-ui/dist/landing,
      # which the web-ui build would otherwise wipe (REQ-LANDING-001).
      - name: Build landing page
        run: npm run build
        working-directory: landing

      - name: Upload built assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-ui-dist
          path: web-ui/dist
          retention-days: 1
          if-no-files-found: error

  container:
    name: Container image
    needs: prepare
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run'
       && github.event.workflow_run.conclusion == 'success'
       && github.event.workflow_run.event == 'push'
       && github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: read
      actions: write # type=gha buildx cache writes to the Actions cache service
    # secrets: inherit is deliberate (zizmor secrets-inherit): the callee job
    # binds inputs.environment, and enterprise deploys rely on environment-
    # scoped secret overrides that explicit pass-through (evaluated in THIS
    # job's env-less context) would not see.
    uses: ./.github/workflows/container-image.yml
    with:
      registry: ${{ needs.prepare.outputs.registry }}
      environment: ${{ needs.prepare.outputs.env_name }}
      ref: ${{ needs.prepare.outputs.ref }}
      worker-name: ${{ needs.prepare.outputs.worker_name }}
      cache-bust: ${{ needs.prepare.outputs.cache_bust }}
      runner: ${{ vars.RUNNER || 'ubuntu-latest' }}
    secrets: inherit

  deploy:
    name: Deploy worker
    needs: [prepare, build-worker, container]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run'
       && github.event.workflow_run.conclusion == 'success'
       && github.event.workflow_run.event == 'push'
       && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    environment: ${{ needs.prepare.outputs.env_name }}
    timeout-minutes: 20
    env:
      WORKER_NAME: ${{ needs.prepare.outputs.worker_name }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Cache root node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-root
        with:
          path: node_modules
          key: root-${{ hashFiles('package-lock.json') }}
          restore-keys: root-

      - name: Install root dependencies
        if: steps.cache-root.outputs.cache-hit != 'true'
        run: npm ci

      - name: Download built assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-ui-dist
          path: web-ui/dist

      - name: Resolve KV namespace
        run: |
          KV_TITLE="${WORKER_NAME}-kv"

          # Check if namespace already exists
          KV_ID=$(npx wrangler kv namespace list 2>/dev/null \
            | sed -n '/^\[/,/^\]/p' \
            | jq -r --arg title "$KV_TITLE" '.[] | select(.title == $title) | .id' \
            | head -1)

          if [ -z "$KV_ID" ]; then
            echo "Creating KV namespace: $KV_TITLE"
            KV_ID=$(npx wrangler kv namespace create "$KV_TITLE" 2>&1 \
              | grep -oP '"[a-f0-9]{32}"' | tr -d '"' | head -1)
          fi

          if [ -z "$KV_ID" ]; then
            echo "::error::Failed to resolve KV namespace ID"
            exit 1
          fi

          echo "KV namespace ID: $KV_ID"
          sed -i "s/id = \"placeholder\"/id = \"$KV_ID\"/" wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply worker name to wrangler config
        run: |
          sed -i "0,/^name = \".*\"/{s/^name = \".*\"/name = \"${WORKER_NAME}\"/}" wrangler.toml
          echo "Using worker name: ${WORKER_NAME}"
          sed -n '1,8p' wrangler.toml
          echo "--- Verifying DO binding intact ---"
          grep 'name = "CONTAINER"' wrangler.toml || { echo "FATAL: DO binding name corrupted!"; exit 1; }

      - name: Apply container resource tier
        env:
          TIER: ${{ vars.RESSOURCE_TIER || 'default' }}
          MAX_INSTANCES_OVERRIDE: ${{ vars.MAX_INSTANCES }}
        run: |
          MAX_INSTANCES=10

          case "$TIER" in
            low)
              # 0.25 vCPU / 1 GiB RAM / 4 GB disk (Cloudflare basic preset)
              INSTANCE_BLOCK='instance_type = "basic"'
              ;;
            high)
              INSTANCE_BLOCK=$'[containers.instance_type]\nvcpu = 2\nmemory_mib = 6144\ndisk_mb = 12000'
              ;;
            saas|default)
              INSTANCE_BLOCK=$'[containers.instance_type]\nvcpu = 1\nmemory_mib = 3072\ndisk_mb = 6000'
              ;;
            *)
              echo "::error::Invalid RESSOURCE_TIER=\"$TIER\". Allowed values: low, high, saas. Leave unset for default."
              exit 1
              ;;
          esac

          # Override max_instances if MAX_INSTANCES variable is set
          if [ -n "$MAX_INSTANCES_OVERRIDE" ]; then
            if ! echo "$MAX_INSTANCES_OVERRIDE" | grep -qE '^[1-9][0-9]*$'; then
              echo "::error::MAX_INSTANCES must be a positive integer, got: $MAX_INSTANCES_OVERRIDE"
              exit 1
            fi
            MAX_INSTANCES="$MAX_INSTANCES_OVERRIDE"
          fi

          awk -v block="$INSTANCE_BLOCK" -v max_instances="$MAX_INSTANCES" '
            BEGIN {
              skip_old = 0;
            }
            {
              if ($0 ~ /^max_instances = /) {
                print "max_instances = " max_instances;
                print "";
                n = split(block, lines, "\n");
                for (i = 1; i <= n; i++) {
                  print lines[i];
                }
                skip_old = 1;
                next;
              }

              if (skip_old == 1) {
                if ($0 ~ /^\[containers\.instance_type\]/) next;
                if ($0 ~ /^vcpu = /) next;
                if ($0 ~ /^memory_mib = /) next;
                if ($0 ~ /^disk_mb = /) next;
                if ($0 ~ /^instance_type = /) next;
                if ($0 ~ /^$/) next;
                skip_old = 0;
              }

              print $0;
            }
          ' wrangler.toml > wrangler.toml.tmp

          mv wrangler.toml.tmp wrangler.toml

          echo "Using RESSOURCE_TIER=${TIER}"
          echo "Resolved max_instances=${MAX_INSTANCES}"
          echo "Resolved container config:"
          sed -n '30,52p' wrangler.toml

      - name: Point wrangler.toml to pre-pushed image
        env:
          REGISTRY_URI: ${{ needs.container.outputs.registry_uri }}
        run: |
          if [ -z "$REGISTRY_URI" ]; then
            echo "::error::container job produced no registry URI"
            exit 1
          fi
          sed -i "s|image = \"./Dockerfile\"|image = \"${REGISTRY_URI}\"|" wrangler.toml
          echo "--- Verifying image config ---"
          grep 'image =' wrangler.toml

      - name: Enable strict Gateway egress VPC binding (enterprise mode)
        # REQ-ENTERPRISE-016: the cf1:network EGRESS binding is enterprise-only and
        # committed commented-out so default/fork deploys (accounts without Workers
        # VPC / cf1:network) and the vitest-pool-workers test runtime stay green.
        # Uncomment it only when this deploy targets an enterprise env.
        if: ${{ vars.ENTERPRISE_MODE == 'active' }}
        run: |
          sed -i \
            -e '/^# \[\[vpc_networks\]\]$/s/^# //' \
            -e '/^# binding = "EGRESS"$/s/^# //' \
            -e '/^# network_id = "cf1:network"$/s/^# //' \
            -e '/^# remote = true$/s/^# //' \
            wrangler.toml
          for ln in '[[vpc_networks]]' 'binding = "EGRESS"' 'network_id = "cf1:network"' 'remote = true'; do
            grep -qxF "$ln" wrangler.toml || { echo "::error::strict-egress binding line not enabled: $ln"; exit 1; }
          done
          echo "--- strict-egress VPC binding enabled for enterprise deploy ---"

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAR_ONBOARDING: ${{ vars.ONBOARDING_LANDING_PAGE || 'inactive' }}
          VAR_MAX_SESSIONS_USER: ${{ vars.MAX_SESSIONS_USER }}
          VAR_MAX_SESSIONS_ADMIN: ${{ vars.MAX_SESSIONS_ADMIN }}
          VAR_STRESS_TEST_MODE: ${{ vars.STRESS_TEST_MODE }}
          VAR_SAAS_MODE: ${{ vars.SAAS_MODE }}
          VAR_SAAS_EXTRA_IDPS: ${{ vars.SAAS_EXTRA_IDPS }}
          VAR_ENTERPRISE_MODE: ${{ vars.ENTERPRISE_MODE }}
          VAR_OAUTH_CLIENT_ID: ${{ (vars.SAAS_MODE == 'active' || vars.ONBOARDING_LANDING_PAGE == 'active') && secrets.OAUTH_CLIENT_ID || '' }}
        run: |
          # Optional --var flags are assembled in bash from env (never inline
          # ${{ }} in the command: template-injection hygiene + safe quoting).
          run_deploy() {
            local args=(--var "ONBOARDING_LANDING_PAGE:${VAR_ONBOARDING}" --var "CLOUDFLARE_WORKER_NAME:${WORKER_NAME}")
            [ -n "$VAR_MAX_SESSIONS_USER" ] && args+=(--var "MAX_SESSIONS_USER:${VAR_MAX_SESSIONS_USER}")
            [ -n "$VAR_MAX_SESSIONS_ADMIN" ] && args+=(--var "MAX_SESSIONS_ADMIN:${VAR_MAX_SESSIONS_ADMIN}")
            [ -n "$VAR_STRESS_TEST_MODE" ] && args+=(--var "STRESS_TEST_MODE:${VAR_STRESS_TEST_MODE}")
            [ -n "$VAR_SAAS_MODE" ] && args+=(--var "SAAS_MODE:${VAR_SAAS_MODE}")
            [ -n "$VAR_SAAS_EXTRA_IDPS" ] && args+=(--var "SAAS_EXTRA_IDPS:${VAR_SAAS_EXTRA_IDPS}")
            [ -n "$VAR_ENTERPRISE_MODE" ] && args+=(--var "ENTERPRISE_MODE:${VAR_ENTERPRISE_MODE}")
            [ -n "$VAR_OAUTH_CLIENT_ID" ] && args+=(--var "OAUTH_CLIENT_ID:${VAR_OAUTH_CLIENT_ID}")
            npx wrangler deploy --name "${WORKER_NAME}" "${args[@]}"
          }
          # Retry transient CF control-plane failures (e.g. 500 on container-app
          # image swap): 30 attempts, 30s apart, so a transient error never wastes
          # the completed build.
          attempt=0; max=30
          until [ "$attempt" -ge "$max" ]; do
            attempt=$((attempt+1))
            echo "::group::wrangler deploy (attempt $attempt/$max)"
            if run_deploy; then
              echo "::endgroup::"
              echo "wrangler deploy succeeded on attempt $attempt"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::wrangler deploy failed (attempt $attempt/$max); retrying in 30s"
            sleep 30
          done
          echo "::error::wrangler deploy failed after $max attempts"
          exit 1

      - name: Set worker secrets (bulk)
        # One `wrangler secret bulk` call replaces the former eight sequential
        # `wrangler secret put` steps. Same conditional semantics: mode-gated
        # secrets are only uploaded when their mode is active, optional ones
        # only when non-empty.
        run: |
          FILE=$(mktemp)
          trap 'rm -f "$FILE"' EXIT
          SECRETS='{}'
          add() {
            SECRETS=$(printf '%s' "$SECRETS" | jq --arg k "$1" --arg v "$2" '. + {($k): $v}')
          }

          add CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN"

          # CF_ACCESS_CLIENT_SECRET (CF Access mode) or OAUTH_E2E_TEST_SECRET
          # (GitHub OIDC mode) — the service-auth identity used by the
          # stress-test workflow's X-Service-Auth requests.
          AUTH_SECRET="${CF_ACCESS_CLIENT_SECRET:-${OAUTH_E2E_TEST_SECRET}}"
          if [ -n "$AUTH_SECRET" ]; then
            add SERVICE_AUTH_SECRET "$AUTH_SECRET"
          else
            echo "No CF_ACCESS_CLIENT_SECRET or OAUTH_E2E_TEST_SECRET — skipping service auth secret"
          fi

          if [ "${ONBOARDING_MODE}" = "active" ] || [ "${SAAS_MODE_VAR}" = "active" ]; then
            if [ -n "$RESEND_API_KEY" ]; then
              add RESEND_API_KEY "$RESEND_API_KEY"
            else
              echo "::warning::RESEND_API_KEY not set — email notifications will be skipped"
            fi
            if [ -n "$RESEND_EMAIL" ]; then add RESEND_EMAIL "$RESEND_EMAIL"; fi
            # GitHub sign-in is the entry path for BOTH SaaS mode and the
            # onboarding /login (REQ-AUTH-020), so the OAuth secrets must be
            # provisioned whenever either mode is active.
            if [ -n "$OAUTH_CLIENT_SECRET" ]; then add OAUTH_CLIENT_SECRET "$OAUTH_CLIENT_SECRET"; fi
            if [ -n "$OAUTH_JWT_SECRET" ]; then add OAUTH_JWT_SECRET "$OAUTH_JWT_SECRET"; fi
          fi

          if [ "${SAAS_MODE_VAR}" = "active" ]; then
            if [ -n "$STRIPE_SECRET_KEY" ]; then add STRIPE_SECRET_KEY "$STRIPE_SECRET_KEY"; fi
            if [ -n "$STRIPE_WEBHOOK_SECRET" ]; then add STRIPE_WEBHOOK_SECRET "$STRIPE_WEBHOOK_SECRET"; fi
          fi

          if [ -n "$ENC_KEY" ]; then
            add ENCRYPTION_KEY "$ENC_KEY"
          else
            echo "No ENCRYPTION_KEY — credentials stored as plaintext, R2 uses default encryption"
          fi

          if [ -n "$AIG_GATEWAY_URL" ]; then add AIG_GATEWAY_URL "$AIG_GATEWAY_URL"; else echo "No AIG_GATEWAY_URL — enterprise LLM routing disabled"; fi
          if [ -n "$AIG_TOKEN" ]; then add AIG_TOKEN "$AIG_TOKEN"; fi

          printf '%s' "$SECRETS" > "$FILE"
          echo "Uploading secrets: $(printf '%s' "$SECRETS" | jq -r 'keys | join(", ")')"
          npx wrangler secret bulk "$FILE" --name "${WORKER_NAME}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          OAUTH_E2E_TEST_SECRET: ${{ secrets.OAUTH_E2E_TEST_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_EMAIL: ${{ secrets.RESEND_EMAIL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_JWT_SECRET: ${{ secrets.OAUTH_JWT_SECRET }}
          ENC_KEY: ${{ secrets.ENCRYPTION_KEY }}
          AIG_GATEWAY_URL: ${{ secrets.AIG_GATEWAY_URL }}
          AIG_TOKEN: ${{ secrets.AIG_TOKEN }}
          ONBOARDING_MODE: ${{ vars.ONBOARDING_LANDING_PAGE }}
          SAAS_MODE_VAR: ${{ vars.SAAS_MODE }}

      - name: Seed service user in KV (stress-test identity, optional)
        run: |
          AUTH_SECRET="${CF_ACCESS_CLIENT_SECRET:-${OAUTH_E2E_TEST_SECRET}}"
          if [ -z "${AUTH_SECRET}" ]; then
            echo "No service-auth secret — skipping KV service-user seed"
            exit 0
          fi
          # Fixed email matching the worker's X-Service-Auth identity
          SERVICE_EMAIL="e2e-service@codeflare.local"
          echo "Seeding service user: ${SERVICE_EMAIL}"
          KV_VALUE="{\"addedBy\":\"deploy\",\"addedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"role\":\"admin\"}"
          npx wrangler kv key put "user:${SERVICE_EMAIL}" "${KV_VALUE}" --binding KV --remote 2>/dev/null || \
          echo "::warning::Could not seed service user in KV (non-fatal)"
        env:
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          OAUTH_E2E_TEST_SECRET: ${{ secrets.OAUTH_E2E_TEST_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Post-deploy smoke (health)
        # /health is public (run_worker_first in wrangler.toml), so this needs
        # no auth. E2E_BASE_URL is the environment-scoped deployed base URL;
        # environments without it skip the smoke with a notice.
        env:
          BASE: ${{ vars.E2E_BASE_URL }}
        run: |
          if [ -z "$BASE" ]; then
            echo "::notice::No E2E_BASE_URL var for this environment — skipping post-deploy smoke"
            exit 0
          fi
          CODE=000
          for i in 1 2 3 4 5; do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' "$BASE/health" || echo 000)
            echo "Attempt $i: $BASE/health -> $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Deployment healthy"
              exit 0
            fi
            sleep 10
          done
          echo "::error::post-deploy smoke failed: $BASE/health returned $CODE"
          exit 1

      # Prune old container images from the CF registry (scripts/ci/prune-registry.mjs;
      # CF-registry-only — Docker Hub manages its own storage). Non-fatal: cleanup
      # is best-effort, any error is a warning and the deploy stays green.
      - name: Prune old container images
        if: needs.prepare.outputs.registry == 'cloudflare'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REGISTRY_URI: ${{ needs.container.outputs.registry_uri }}
          KEEP_N: '10'
        run: node scripts/ci/prune-registry.mjs
