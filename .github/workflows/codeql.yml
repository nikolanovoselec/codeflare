name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  # github.ref is the per-PR merge ref for pull_request events, so two PRs
  # sharing one head branch never cancel each other while superseded pushes
  # of the same PR still do.
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  analyze:
    name: Analyze (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: worker
            config: ./.github/codeql/codeql-worker.yml
          - shard: container-ui
            config: ./.github/codeql/codeql-container-ui.yml
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: javascript-typescript
          config-file: ${{ matrix.config }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: /language:javascript-typescript/${{ matrix.shard }}

  gate:
    name: Analyze
    if: always()
    needs: analyze
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 1
    steps:
      - name: Require every CodeQL shard
        env:
          RESULT: ${{ needs.analyze.result }}
        run: test "$RESULT" = success
