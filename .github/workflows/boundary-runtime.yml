name: Protected Review Runtime

on:
  workflow_call:
    inputs:
      runtime_sha:
        required: true
        type: string
      dev_origin:
        required: true
        type: string
      integration_origin:
        required: true
        type: string
      production_origin:
        required: true
        type: string

permissions: {}

jobs:
  collect:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.state == 'open'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
    outputs:
      artifact_id: ${{ steps.transfer.outputs.artifact-id }}
    steps:
      # Only the immutable Codeflare implementation is executed. No target-repository checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nikolanovoselec/codeflare
          ref: ${{ inputs.runtime_sha }}
          path: .review-runtime
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Collect exact claimed operator result
        run: node .review-runtime/scripts/operator-boundary-action.mjs collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CODEFLARE_DEV_ORIGIN: ${{ inputs.dev_origin }}
          CODEFLARE_INTEGRATION_ORIGIN: ${{ inputs.integration_origin }}
          CODEFLARE_PRODUCTION_ORIGIN: ${{ inputs.production_origin }}
          REVIEW_TRANSFER_FILE: ${{ runner.temp }}/boundary-result.json
      - name: Transfer bounded terminal bytes, not authority
        id: transfer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boundary-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/boundary-result.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: collect
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: write
      checks: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nikolanovoselec/codeflare
          ref: ${{ inputs.runtime_sha }}
          path: .review-runtime
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .review-runtime/package-lock.json
      - run: npm ci --prefix .review-runtime
      - name: Read bounded collector transfer
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ needs.collect.outputs.artifact_id }}
          path: ${{ runner.temp }}/review-transfer
      - name: Publish with independent protected identity
        run: node .review-runtime/scripts/operator-boundary-action.mjs publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CODEFLARE_DEV_ORIGIN: ${{ inputs.dev_origin }}
          CODEFLARE_INTEGRATION_ORIGIN: ${{ inputs.integration_origin }}
          CODEFLARE_PRODUCTION_ORIGIN: ${{ inputs.production_origin }}
          REVIEW_TRANSFER_FILE: ${{ runner.temp }}/review-transfer/boundary-result.json
