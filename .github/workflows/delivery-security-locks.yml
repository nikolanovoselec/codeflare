# Temporary remote lock correction/evidence; remove before final PR push.
name: Delivery security lock correction
on:
  push:
    branches: [delivery/preseed-alignment-20261017]
    paths:
      - .github/workflows/delivery-security-locks.yml
permissions:
  contents: read
jobs:
  correct-and-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.11.1'
      - name: Resolve only audited transitive security packages
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/delivery-security-locks"
          for directory in .github/npm-tools/wrangler host landing .; do
            (cd "$directory" && timeout 120s npm update sharp source-map-js --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org)
            node scripts/apply-npm-security-lock-pins.mjs "$directory/package-lock.json"
          done
      - name: Record bounded patch and exact resulting lock digests
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node --input-type=module <<'RECEIPT'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const expected = ['.github/npm-tools/wrangler/package-lock.json', 'host/package-lock.json', 'landing/package-lock.json', 'package-lock.json'].sort();
          const changed = execFileSync('git', ['diff', '--name-only'], { encoding: 'utf8' }).trim().split('\n').sort();
          if (JSON.stringify(changed) !== JSON.stringify(expected)) throw new Error(`Unexpected changed paths: ${JSON.stringify(changed)}`);
          const patch = execFileSync('git', ['diff', '--binary', '--', ...expected]);
          const sha256 = bytes => createHash('sha256').update(bytes).digest('hex');
          const all = execFileSync('git', ['ls-files', '*package-lock.json'], { encoding: 'utf8' }).trim().split('\n');
          writeFileSync(`${process.env.RUNNER_TEMP}/delivery-security-locks/locks.patch`, patch);
          writeFileSync(`${process.env.RUNNER_TEMP}/delivery-security-locks/source-receipt.json`, JSON.stringify({
            sourceSha: process.env.SOURCE_SHA, patchSha256: sha256(patch), changedPaths: expected,
            locks: all.map(path => ({ path, sourceSha256: sha256(execFileSync('git', ['show', `${process.env.SOURCE_SHA}:${path}`])),
              sha256: sha256(readFileSync(path)) })) }) + '\n');
          RECEIPT
      - name: Validate four corrected locks without package lifecycle execution
        run: |
          set -euo pipefail
          for directory in .github/npm-tools/wrangler host landing .; do
            slug=$(printf '%s' "$directory" | tr '/.' '__')
            (cd "$directory" && timeout 120s npm ci --dry-run --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org) > "$RUNNER_TEMP/delivery-security-locks/$slug-ci-dry-run.txt" 2>&1
          done
      - name: Audit all ten resulting locks including development dependencies
        run: |
          set -euo pipefail
          result=0
          while IFS= read -r lock; do
            directory=$(dirname "$lock")
            slug=$(printf '%s' "$lock" | tr '/.' '__')
            set +e
            (cd "$directory" && timeout 90s npm audit --package-lock-only --ignore-scripts --audit-level=high --json --registry=https://registry.npmjs.org) > "$RUNNER_TEMP/delivery-security-locks/$slug.json" 2> "$RUNNER_TEMP/delivery-security-locks/$slug.stderr"
            code=$?
            set -e
            printf '%s\t%s\t%s\n' "$lock" "$code" "$slug.json" >> "$RUNNER_TEMP/delivery-security-locks/results.tsv"
            if [ "$code" -ne 0 ]; then result=1; fi
          done < <(git ls-files '*package-lock.json')
          exit "$result"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: delivery-security-locks-${{ github.sha }}
          path: ${{ runner.temp }}/delivery-security-locks
          if-no-files-found: error
          retention-days: 3
